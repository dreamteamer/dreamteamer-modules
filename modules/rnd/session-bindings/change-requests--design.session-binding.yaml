# DESIGN — the rnd-agent designs a request that has neither a design nor a plan yet. The gate is the
# design command-binding's, narrowed to "no plan" so it never overlaps the build session below.
# A kind @dreamteamer/core contributes: without core this folder is in rnd's `ignore`, so rnd still
# compiles alone; with core it is staged and validated like any binding.
collection: collections/rnd/change-requests
available_when:
  status:
    _in: [suggested, accepted]
  design_docs:
    _empty: true
  implementation_plans:
    _empty: true
done_when:
  design_docs:
    _nempty: true
harness: claude-code
agent: agents/rnd-agent
command: commands/rnd/design
concurrency: one
stale_after: 30
description: the rnd-agent designs the request — one session at a time
