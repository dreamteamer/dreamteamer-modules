# REVIEW — the qa-manager reviews a request whose plan is done and that is not yet verified: the code
# review after implement, the test review before verified_on (rnd 0.5.2's code and test review gates,
# collapsed to the fields this rnd has). Done when verified_on is stamped.
collection: collections/rnd/change-requests
available_when:
  status:
    _eq: accepted
  verified_on:
    _empty: true
  implementation_plans:
    status:
      _eq: done
done_when:
  verified_on:
    _nempty: true
harness: claude-code
agent: agents/qa-manager
command: commands/rnd/review
concurrency: one
stale_after: 30
description: the qa-manager reviews the built change — one reviewer at a time
