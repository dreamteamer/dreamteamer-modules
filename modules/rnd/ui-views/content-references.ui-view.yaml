# the references list — the default a bare /content/rnd/references renders.
#
# ⚠ `carousel`, not `table`: a reference IS its screenshots. The layout draws one card per record —
# title, description, and a carousel over the images in `screenshots_folder`, which the host renders
# from the `${env:…}` template and lists (extension 0.17.0). On an older extension an unregistered
# layout degrades visibly rather than erroring, and the columns below still name real fields.
path: /content/rnd/references
target: list
collection: collections/rnd/references
layout: carousel
options:
  folder_field: screenshots_folder
  text_field: description
  columns:
    - name
    - type
    - company
    - observed_on
    - last-modified
  sort: '-observed_on'
default: true
