name: rnd/user-stories
description: >-
  One capability from the user's side, written as the sentence they would say.
use_when: >-
  a capability is discussed from the USER's side — write the sentence they would say here; a design
  doc cites these, and a feature without one is a guess about who wants it
templates:
  - collection-templates/rnd-provenance
storage:
  path: data/rnd/user-stories
  codec: md
  shape: file
  suffix: user-story
# ⚠ THE SLUG COMES FROM `key`, NOT FROM `name`. A story's `name` is the sentence the user would SAY,
# and in this workspace that sentence is Hebrew — which the engine's `slug` filter (`slugOrHash`)
# turns into an `x1a2b3c4` hash without failing. Every id would be unreadable and ungreppable. The
# same trap is already documented on `projects` and on `rnd/screens`; this is the third instance, and
# it is the reason `key` is required.
id:
  generate: '{{ created | date }}--{{ key }}'
  pattern: ^\d{4}-\d{2}-\d{2}--[a-z0-9-]+$
schema:
  type: object
  required:
    - name
    - key
  properties:
    key:
      type: string
      description: The latin handle that becomes the id — `first-sign-in-otp`, `see-vesting-schedule`. Lowercase, hyphenated. It exists because `name` is Hebrew and would hash.
    name:
      type: string
      description: The story in one line — what someone can do that they could not before.
    description:
      type: string
      description: One line of context for a list view.
    content:
      type: string
      format: markdown
      x-body: true
      description: The story itself, with whatever acceptance detail makes "done" unambiguous.
    tags:
      examples: ['dreamteamer', 'v06']
      type: array
      items:
        type: string
      description: >-
        Free strings, lowercase and hyphenated. Optionally `key:value` with NO space around the colon
        (`analysis:meeting-insights`, `enriched:web-search`) — a space makes YAML parse the entry as a map instead of a
        string. Nothing validates a tag; there is no `tags` collection. Reuse one already in use before inventing one: `dt values <collection> tags` lists them.
    status:
      type: string
      enum:
        - pending
        - in-progress
        - done
      default: pending
      description: Where the story stands. This is the progress marker for the slice — there is no separate run record.
    product-design-doc:
      type: string
      x-reference: rnd/product-design-docs
      description: The design this story implements a piece of.
    product:
      type: string
      x-reference: rnd/products
      x-inverse:
        field: user_stories
        description: What users can do with this product — generated from `rnd/user-stories.product`.
      description: >-
        The PRODUCT this story belongs to, directly. The chain story → design doc → product exists, but a
        product page that cannot list its own stories without a two-hop join is a product page that lies by
        omission — and on a four-product engagement "which product is this story for" is the first question
        a reviewer asks. Added 2026-09-12 when a workspace found all 57 of one product's stories unreachable from any product record.
    source:
      type: string
      x-reference: rnd/draft-docs
      description: The spec draft this story was carved out of.
    screen:
      type: string
      x-reference: rnd/screens
      # ⚠ NO `x-inverse` here — `rnd/screens.user_stories` already carries `x-inverse-of`, and
      # declaring both spellings compiles clean and then warns on EVERY compile, forever.
      description: The screen this story runs through. A story with no screen is a capability nobody has decided where to put.
    journey:
      type: string
      description: >-
        The FLOW this story is one step of — a lowercase-hyphenated handle like `first-sign-in`,
        `exercise-and-sell`, `update-bank-details`. A journey is not its own collection on purpose:
        it is the stories, in `step` order, and `dt values rnd/user-stories journey` enumerates every
        one. When a scope document names the journey set as a deliverable, the set has
        to be countable rather than described.
    step:
      type: integer
      description: Position of this story within its `journey`, from 1. Absent for a story that stands alone.
order: 40
list_fields:
  - name
  - last-modified
  - status
  - tags
icon: comment   # not `book` — `notebooks` already wears `book`; a story is the sentence a user would SAY
