name: rnd/change-requests
description: A proposed product change with source gaps, acceptance and linked stories; approval is explicit.
use_when: when a source gap or requested behavior changes the product contract, record the proposed change and acceptance before scheduling implementation
storage:
  path: data/rnd/change-requests
  format: md
ids:
  from: '{{ key }}'
  pattern: ^[a-z0-9][a-z0-9-]*$
fields:
  key:
    type: string
    description: Stable lowercase hyphenated handle.
    required: true
    pattern: ^[a-z0-9][a-z0-9-]*$
  name:
    type: string
    description: 'Short and descriptive — a handful of words naming what changes, the way a list row reads it ("Activity page loads instantly"). Never a sentence and never the reasoning: the one-liner is `description`, the detail is the body.'
    required: true
    examples: ['Activity page loads instantly', 'Deadline on the grantee roster']
  description:
    type: string
    description: 'One line, brief: what changes, for whom. A sentence, not a paragraph — the paragraph, the ask in its own words and the evidence belong in the body.'
    examples: ['The Activity page shows its first 20 entries as each repo answers instead of waiting for every history.']
  source:
    type: string
    description: Source records and section locators; distinguish evidence from design.
  content:
    type: markdown
    description: 'The details, and everything longer than one line: why, the ask in the source''s own words, what is out of scope, what it touches by id, the phases. The name and the description stay short because this is where the length goes.'
    body: true
  products:
    type: rnd/products
    description: Affected products.
    many: true
    required: true
  journeys:
    type: rnd/user-journeys
    description: Affected end-to-end journeys.
    many: true
  status:
    type: string
    description: Decision on the change, not implementation progress.
    enum:
      - suggested
      - accepted
      - rejected
      - implemented
    default: suggested
  priority:
    type: string
    description: Delivery priority.
    enum:
      - critical
      - high
      - medium
      - low
  acceptance:
    type: string
    description: 'Evidence required to accept the change — one entry per piece of evidence, each written so it can fail. On the CLI, repeat `--acceptance` once per entry: one flag holding several lines is split on its commas.'
    many: true
  source_gaps:
    type: string
    description: Stable source requirement or gap locators.
    many: true
  stories:
    type: rnd/user-stories
    description: Stories implementing the change.
    many: true
    mirror_of: change_requests
  issue:
    type: rnd/issues
    description: The defect that motivated this change, when one did.
  design_docs:
    type: rnd/design-docs
    many: true
    description: The designs this change rests on or amends. Each lists its change requests back.
  accepted_by:
    type: string
    examples: ['users/dana-oren', 'contacts/avi-cohen']
    description: Who accepted the change — the reviewer whose verdict set `accepted`, or the client who said yes. A plain string, because the person may live in another workspace. Set with `accepted_on`; the review record carries the findings.
  accepted_on:
    type: datetime
    description: When the change was accepted, by the person in `accepted_by`.
  tested_on:
    type: datetime
    description: When the test stage last ran every covering test and found each one passing — the stage's own mark, which the test review reads. Empty until then; the stage clears it when a run finds a test failing.
  verified_on:
    type: datetime
    description: When the test review approved the proof — stamped by that reviewer on `approve`, never by the stage it judged. The gate deploy reads. Empty until then; cleared by a change that lands after it.
  deployed_on:
    type: datetime
    description: 'When the change went live, set by the deploy stage after its live check. The live acceptance review reads it, and its `approve` sets `status: implemented`.'
  supersedes:
    type: rnd/change-requests
    description: The earlier request this replaces. The earlier record stays.
  superseded_by:
    type: rnd/change-requests
    many: true
    mirror_of: supersedes
    description: GENERATED — the later request that replaced this one. Set `supersedes` on the newer request.
  tests:
    type: rnd/tests
    many: true
    mirror_of: covers
    description: GENERATED — the tests that accept this change. Set `covers` on the test.
  implementation_plans:
    type: rnd/implementation-plans
    many: true
    mirror_of: change_request
    description: GENERATED — the plans that build this change. Set `change_request` on the plan.
  reviews:
    type: rnd/reviews
    many: true
    mirror_of: change_request
    description: GENERATED — every review in this request's lifecycle — of the request, its design doc, its plan, its code, its tests and the live check. Set `change_request` on the review, whatever its subject.
# THE STAGE MAP. `display.record.options.stages` declares the lifecycle as it is drawn on a request's page, in
# order; a surface that knows the option draws it above the properties, and any other ignores it (options are
# open). `stage_reviews` names the field holding the request's reviews, the set the stages' matchers pick from. Per stage: `fields` — this record's fields that hold the stage's records, drawn EMPTY when they are
# (no plan yet is the empty stage, not a missing one); `reviews` — which of the request's `reviews` belong to
# the stage, each matcher an OR of its siblings and an AND of its keys: `kind` (any of), `subject` (a field of
# this record whose references hold the review's subject, or `self`), `before` / `since` (a datetime field of
# this record, against the review's `created`); `gate` — the command bindings whose states ARE the stage's gate,
# in order, the work first and its review after. The stage is passed when every binding is done.
display:
  nav:
    icon: git-pull-request
    order: 28
  list:
    columns:
      - created
      - status
      - name
      - products
    sort: '-created'
  record:
    badge: status
    options:
      stage_reviews: reviews
      stages:
        - title: design
          fields: [design_docs]
          reviews:
            - subject: design_docs
            - subject: self
              kind: [acceptance]
              before: deployed_on
          gate: [rnd--design--change-requests, rnd--review--change-requests--design, rnd--review--change-requests]
        - title: plan
          fields: [implementation_plans]
          reviews:
            - subject: implementation_plans
              kind: [design, ux, security, compliance, other]
          gate: [rnd--plan--change-requests, rnd--review--change-requests--plan]
        - title: implement
          fields: [implementation_plans]
          reviews:
            - kind: [code]
          gate: [rnd--implement--change-requests, rnd--review--change-requests--code]
        - title: test
          fields: [tests, tested_on, verified_on]
          reviews:
            - kind: [test]
          gate: [rnd--test--change-requests, rnd--review--change-requests--test]
        - title: deploy
          fields: [deployed_on]
          reviews:
            - subject: self
              kind: [acceptance]
              since: deployed_on
          gate: [rnd--deploy--change-requests, rnd--review--change-requests--deploy]
