name: rnd/prototypes
description: >-
  A thin UI mockup that is the LIVING reference for intended design — maintained alongside the product, never graduating into it.
use_when: >-
  a UI or an interaction is being designed — the living mockup lives here beside the product and is what to update when the design changes; it never graduates into the product
# A prototype never graduates: it is maintained alongside the product, and the app built from it
# lives in its own repo. The later thing points at the earlier one, so there is no `implemented_by`.
storage: {path: data/rnd/prototypes, format: md}
ids:
  from: "{{ created | date }}--{{ name | slug }}"
  pattern: "^\\d{4}-\\d{2}-\\d{2}--[a-z0-9-]+$"
fields:
  name:
    type: string
    required: true
    description: What this prototype is called.
  description:
    type: string
    description: One line on what it shows.
  repo:
    type: repos
    description: The repo holding the prototype's files.
  status:
    type: string
    default: sketch
    enum: [sketch, living, superseded, parked]
    description: '`living` is the maintained reference for intended design — a prototype never graduates, it evolves alongside the product.'
  entry:
    type: string
    description: The repo-relative thing to open, e.g. "index.html".
  explores:
    type: reference
    many: true
    description: The records this prototype is exploring — a design doc, a story, a feature. Polymorphic, hence "*".
  product:
    type: rnd/products
    description: Which product this is a prototype of.
  design_doc:
    type: rnd/design-docs
    # No `x-inverse` here: this side owns the relation, and the mirror is declared on the design doc
    # as `prototypes` with `x-inverse-of`. Declaring both makes compile warn on every run.
    description: The design doc this prototype realises — the hop from PRD to something clickable. `explores` stays for the looser "what is this poking at".
  live_url:
    type: string
    description: Where the current iteration is deployed and clickable — the URL a reviewer opens. Rapid prototyping means this exists from iteration 1; a prototype nobody can open is a sketch.
  iteration:
    type: number
    description: Which build this is. Bumped by `/iterate-prototype` on every deployed change; the feedback that drove each is a dated section in the body.
  deploy:
    type: string
    description: "How `live_url` is refreshed, as the one command to run from `repo`/`entry`'s folder — e.g. `npx wrangler deploy`. The CI/CD of a prototype is one line, or it is not rapid."
  content:
    type: markdown
    body: true
    description: THE DESIGN BRIEF — what the prototype is trying to establish, and what it deliberately fakes.
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…> · migration:<id>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
  screens:
    type: rnd/screens
    many: true
    mirror_of: prototype
    description: GENERATED — the screens this prototype implements. Set `prototype` on the screen.
display:
  nav:
    icon: preview
    order: 12
  list:
    columns:
      - name
      - status
      - iteration
      - live_url
      - product
      - last_modified
