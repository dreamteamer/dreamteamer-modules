name: rnd/product-user-personas
description: A product user role and its goals, permissions and journeys; not a research panel or invented person.
use_when: when defining who uses a product, their jobs and permission boundaries, search these roles before creating one; research panels remain in personas
storage:
  path: data/rnd/product-user-personas
  format: md
ids:
  from: '{{ key }}'
  pattern: ^[a-z0-9][a-z0-9-]*$
fields:
  key:
    type: string
    description: Stable lowercase hyphenated handle.
    required: true
    pattern: ^[a-z0-9][a-z0-9-]*$
  name:
    type: string
    description: Human-readable name.
    required: true
  description:
    type: string
    description: One-line summary.
  source:
    type: string
    description: Source records and section locators; distinguish evidence from design.
  content:
    type: markdown
    description: Detailed contract, evidence, exceptions and acceptance.
    body: true
  products:
    type: rnd/products
    description: Products used by this role.
    many: true
    required: true
  goals:
    type: string
    description: Jobs this role needs to achieve.
    many: true
  permissions:
    type: string
    description: Proposed allowed operations; application enforcement is separate.
    many: true
  restrictions:
    type: string
    description: Explicit prohibited operations and boundaries.
    many: true
  evidence_status:
    type: string
    description: Whether a role is source-backed or a design hypothesis.
    enum:
      - source-backed
      - proposed
    default: proposed
display:
  nav:
    icon: person-add
    order: 26
  list:
    columns:
      - name
      - description
