name: rnd/user-journeys
description: A traceable end-to-end user journey across products, including entry, handoffs, failures and outcome.
use_when: when tracing a user outcome across screens or products, record entry, handoffs, failures and acceptance here and link its stories
storage:
  path: data/rnd/user-journeys
  format: md
ids:
  from: '{{ key }}'
  pattern: ^[a-z0-9][a-z0-9-]*$
fields:
  key:
    type: string
    description: Stable lowercase hyphenated handle.
    required: true
    pattern: ^[a-z0-9][a-z0-9-]*$
  name:
    type: string
    description: Human-readable name.
    required: true
  description:
    type: string
    description: One-line summary.
  source:
    type: string
    description: Source records and section locators; distinguish evidence from design.
  content:
    type: markdown
    description: Detailed contract, evidence, exceptions and acceptance.
    body: true
  products:
    type: rnd/products
    description: Participating product surfaces.
    many: true
    required: true
  personas:
    type: rnd/product-user-personas
    description: Roles participating in this journey.
    many: true
  entry:
    type: string
    description: Trigger and preconditions.
  outcome:
    type: string
    description: User-visible completion condition.
  acceptance:
    type: string
    description: Positive and negative acceptance scenarios.
    many: true
  stories:
    type: rnd/user-stories
    description: Generated story membership.
    many: true
    mirror_of: journeys
display:
  nav:
    icon: map
    order: 27
  list:
    columns:
      - name
      - description
