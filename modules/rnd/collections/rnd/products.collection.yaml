name: rnd/products
description: >-
  A product this workspace builds — the root every feature, issue, design doc and prototype hangs off.
use_when: >-
  a feature, issue, design doc or prototype needs its `product` — resolve it here first (`dt list rnd/products`), because the product is the root they all hang off; create one only when something this workspace BUILDS is named for the first time — an engine, an extension, a recipe, a client deliverable with a repo — and a version or a rewrite is the same product, never a new one
storage:
  path: data/rnd/products
  format: md
ids:
  from: "{{ name | slug }}"
  pattern: ^[a-z0-9-]+$
fields:
  name:
    type: string
    required: true
    description: What the product is called.
  description:
    type: string
    description: One line on what it is and who it is for.
  status:
    type: string
    enum:
      - idea
      - building
      - live
      - retired
    description: Where the product stands in its own life — not where any one piece of work on it stands.
  project:
    # Points at the plan module as a PEER, with no `x-inverse`. A PRODUCT is the effort; the plan
    # that delivers it is `projects`, with its tasks, deliverables and risks. A mirror here would
    # write a field into a module this one does not own, so `rnd` peers `projects` and stays
    # installable without it.
    type: projects
    description: The delivery plan this product is built under — empty for a product that is its own effort.
  company:
    # A product carries the effort, so it says whose effort it is. A plain reference and no
    # mirror — `companies` is a peer.
    type: companies
    description: The client organisation this product is built for — empty for an internal one.
  media_folder:
    type: string
    examples: ['${env:FILES_FOLDER}/rnd/products/northwind-portal/media']
    description: >-
      Where this record's media lives — explainer videos, audio overviews, decks, infographics, screen recordings — as a FULL `${env:FILES_FOLDER}/rnd/products/<this record's id>/media` template, never a machine path; `dt resolve` renders it. The bytes stay OUTSIDE the repo: an `assets` record is a small file the UI draws, this is megabytes for people to watch. What generated each piece, and against which corpus, goes in this record's body — a folder cannot say whether its media is still current.
  design_docs:
    type: rnd/design-docs
    many: true
    mirror_of: product
    description: GENERATED — the design docs of this product. Set `product` on the design doc.
  screens:
    type: rnd/screens
    many: true
    mirror_of: product
    description: The screens this product is made of — generated from `rnd/screens.product`.
  user_stories:
    type: rnd/user-stories
    many: true
    mirror_of: product
    description: What users can do with this product — generated from `rnd/user-stories.product`.
  design_system:
    type: rnd/design-systems
    description: The design system this product ships under. Several products may share one.
  prototypes:
    type: rnd/prototypes
    many: true
    mirror_of: product
    description: GENERATED — the living mockups of this product. Set `product` on the prototype.
  change_requests:
    type: rnd/change-requests
    many: true
    mirror_of: products
    description: GENERATED — what is wanted of this product. Set `products` on the change request.
  issues:
    type: rnd/issues
    many: true
    mirror_of: product
    description: GENERATED — the defects filed against this product. Set `product` on the issue.
  tests:
    type: rnd/tests
    many: true
    mirror_of: product
    description: GENERATED — the tests run against this product. Set `product` on the test.
  content:
    type: markdown
    body: true
    description: The product's page — what it does, why it exists, where it is going.
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    title: Information source
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…> · migration:<id>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
display:
  nav:
    icon: package
    order: 20
  list:
    columns:
      - name
      - last_modified
      - status
  form:
    sections:
      - title: Provenance
        fields: [author, creation_context, source, confidence]
        collapsed: true
