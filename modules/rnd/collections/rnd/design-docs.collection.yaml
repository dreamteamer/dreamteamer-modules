name: rnd/design-docs
description: >-
  How a thing should work, decided — the design that implementation follows.
use_when: >-
  how something should work is being decided — write the decision here before implementing, and read the existing doc before proposing a change to a product; a later recorded decision wins when they disagree. A brainstormed spec is a record here, not a file beside the code
storage: {path: data/rnd/design-docs, format: md}
ids:
  from: "{{ created | date }}--{{ name | slug }}"
  pattern: "^\\d{4}-\\d{2}-\\d{2}--[a-z0-9-]+$"
fields:
  name:
    type: string
    required: true
    description: What this design is called.
  description:
    type: string
    description: One line on what is being designed.
  product:
    type: rnd/products
    description: The product this design is of. Empty for a design of the workspace itself or of a process.
  # THE FACTORY CHAIN starts here: references → this doc's design → a prototype → a plan. Each hop is a field,
  # so `dt next rnd/design-docs/<id>` can say which hop is missing (the bindings on this collection).
  references:
    type: rnd/references
    many: true
    description: The references this design was modelled on — what was studied before deciding. `/rnd:draft-prd` reads their `prd` fields and this doc's `branding`, and writes the body.
  branding:
    type: markdown
    description: "The brand this design ships under — tokens (palette, type, radius), tone of voice, language and script direction, the logo as an `assets/…` reference. Short; what a prototype needs to look like ours rather than like the reference."
  plan:
    type: string
    description: "The project plan this design was materialised into, as a `<collection>/<id>` string — where the plan module is installed, `projects/<id>`. A plain string because the plan may live in another workspace; `/rnd:plan` sets it."
  prototypes:
    type: rnd/prototypes
    many: true
    mirror_of: design_doc
    description: GENERATED — the prototypes built from this design. Set `design_doc` on the prototype. A binding reads "non-empty" as "a prototype exists".
  screens:
    type: rnd/screens
    many: true
    mirror_of: design_doc
    description: GENERATED — the screens this design specifies. Set `design_doc` on the screen.
  user_stories:
    type: rnd/user-stories
    many: true
    mirror_of: design_doc
    description: GENERATED — the stories this design implements. Set `design_doc` on the story.
  design_system:
    type: rnd/design-systems
    description: The design system this design ships under — what makes a prototype look like ours rather than like the reference. By convention the product's.
  supersedes:
    type: rnd/design-docs
    description: 'The earlier design this one replaces. The earlier record stays, with `status: superseded`.'
  superseded_by:
    type: rnd/design-docs
    many: true
    mirror_of: supersedes
    description: GENERATED — the later design that replaced this one. Set `supersedes` on the newer doc.
  media_folder:
    type: string
    examples: ['${env:FILES_FOLDER}/rnd/design-docs/2026-09-10-grantee-portal/media']
    description: >-
      Where this record's media lives — explainer videos, audio overviews, decks, infographics, screen recordings — as a FULL `${env:FILES_FOLDER}/rnd/design-docs/<this record's id>/media` template, never a machine path; `dt resolve` renders it. The bytes stay OUTSIDE the repo: an `assets` record is a small file the UI draws, this is megabytes for people to watch. What generated each piece, and against which corpus, goes in this record's body — a folder cannot say whether its media is still current.
  content:
    type: markdown
    body: true
    description: The design itself — the intended shape of the thing, and why it is shaped that way. When written from references, the PRD.
  tags:
    type: string
    many: true
    examples: ['onboarding', 'pricing', 'portal']
    pattern: ^[a-z0-9]+(-[a-z0-9]+)*(:[a-z0-9]+(-[a-z0-9]+)*)?$
    description: Free labels, lowercase and hyphenated, optionally key:value with no space around the colon.
  status:
    type: string
    default: draft
    enum: [draft, active, superseded]
    description: '`active` is the design currently being built to. `superseded` means a later doc won.'
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    title: Information source
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…> · migration:<id>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
  implementation_plans:
    type: rnd/implementation-plans
    many: true
    mirror_of: spec
    description: GENERATED — the plans that build this design. Set `spec` on the plan.
  change_requests:
    type: rnd/change-requests
    many: true
    mirror_of: design_docs
    description: GENERATED — the change requests that rest on or amend this design. Set `design_docs` on the request.
  reviews:
    type: rnd/reviews
    many: true
    mirror_of: subject
    description: GENERATED — the reviews of this design — the draft review whose `approve` makes it active, and any later one. Set `subject` on the review.
display:
  nav:
    icon: symbol-structure
    order: 30
  list:
    columns:
      - name
      - product
      - status
      - last_modified
      - tags
  form:
    sections:
      - title: Provenance
        fields: [author, creation_context, source, confidence]
        collapsed: true
