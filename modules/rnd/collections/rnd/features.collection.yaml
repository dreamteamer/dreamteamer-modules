# Feature ideas and requests — the wanted-but-not-built, for the repos this workspace runs on.
#
# Sibling to `issues`: same repo routing, same evidence posture, opposite direction. An issue says
# something is broken; a feature says something is missing. They are separate collections because
# they are triaged on different questions — "is it real?" versus "is it worth it?" — and mixing them
# makes both queues useless.
#
# The bar is a problem, not an idea. `problem` is required so this never becomes a wishlist: a
# feature that cannot name who was blocked and by what is a `status: idea` at best.
#
# It is also the home for a capability removed from a repo that someone still wants: a record here is
# cheaper than an abstraction kept alive on the argument that it might be needed.
name: rnd/features
description: A wanted capability for one of this workspace's repos — the problem it solves, and who asked.
use_when: >-
  a capability is wanted in one of this workspace's repos — before proposing or building it, search here (it may be filed, with who asked); file it here rather than building straight from a conversation
storage: {path: data/rnd/features, format: md}
ids:
  from: "{{ created | date }}--{{ name | slug }}"
  pattern: "^\\d{4}-\\d{2}-\\d{2}--[a-z0-9-]+$"
fields:
  name:
    type: string
    required: true
    description: The capability in one line — what would exist that does not today.
  description:
    type: string
    description: One line for a list view, when the name alone is not enough.

  repo:
    type: repos
    required: true
    description: Which repo would grow this. Required — an unrouted request cannot be picked up.
  component:
    type: string
    description: The file, subsystem or CLI verb it would land in, when that is known.

  requested_by:
    type: string
    description: >-
      Who WANTS it, when that is not you — a `contacts/<id>` for a client ask, or `agents/<harness>` (e.g. `agents/claude-code`) for an agent. Absent means you wanted it, which is the common case.
  for_client:
    type: companies
    description: The customer organisation this came out of, when it came from outside. A feature with a real customer behind it is a different object from one someone thought of.

  status:
    type: string
    default: idea
    enum: [idea, requested, accepted, building, shipped, declined]
    description: '`idea` is unowned and unpromised — the default on purpose. `accepted` means someone intends to build it, and nothing should reach it without a `problem` that survived reading twice.'
  priority:
    type: string
    default: medium
    enum: [low, medium, high]
    description: How much it matters relative to the rest of this repo's queue.
  size:
    type: string
    enum: [xs, s, m, l, xl]
    description: Rough build cost — enough to sort by, not an estimate.

  problem:
    type: markdown
    required: true
    description: The field that earns the record. What was blocked, for whom, when — the concrete occasion, not the abstract benefit. "No way to see which step a record is on" is a problem; "better observability" is a wish.
  today:
    type: string
    description: What is done INSTEAD right now. If the workaround is fine, that is the most useful thing this record can say — and a reason to decline rather than a gap.

  acceptance:
    type: markdown
    description: What would have to be true to call it shipped. Vague here means unbuildable later.

  issue:
    type: rnd/issues
    description: The defect that motivated this request, when one did.
  supersedes:
    type: rnd/features
    description: The earlier request this replaces.
  resolution:
    type: string
    description: Why it was declined, or what it shipped as. A declined feature with no reason gets re-proposed.
  shipped_in:
    type: string
    description: Commit sha, tag or version, once it lands.

  body:
    type: markdown
    body: true
    description: The full write-up — design sketches, alternatives considered, discussion.
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    title: Information source
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…> · migration:<id>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
display:
  nav:
    icon: star-full
    order: 46
  list:
    columns:
      - name
      - status
      - priority
      - repo
      - requested_by
  form:
    sections:
      - title: Provenance
        fields: [author, creation_context, source, confidence]
        collapsed: true
