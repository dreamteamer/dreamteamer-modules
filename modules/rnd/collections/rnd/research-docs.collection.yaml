name: rnd/research-docs
description: >-
  A finding gathered from OUTSIDE sources — what was read, and what it settles.
use_when: >-
  before researching anything — search here first, it may be settled; after reading OUTSIDE sources, write what was read and what it settles here, and hand what it could not settle to `rnd/open-questions`
storage:
  path: data/rnd/research-docs
  format: md
ids:
  from: "{{ created | date }}--{{ name | slug }}"
  pattern: ^\d{4}-\d{2}-\d{2}--[a-z0-9-]+$
fields:
  name:
    type: string
    required: true
    description: What was researched.
  description:
    type: string
    description: One line on the question this went after.
  project:
    # A peer reference with no `x-inverse`, as on `rnd/products.project`: a mirror would generate a
    # field onto the plan module's `projects`, which this module does not own.
    type: projects
    description: The delivery plan this finding was gathered for — empty for research that answers no particular plan.
  media_folder:
    type: string
    examples: ['${env:FILES_FOLDER}/rnd/research-docs/2026-09-10-grantee-portals/media']
    description: >-
      Where this record's media lives — explainer videos, audio overviews, decks, infographics, screen recordings — as a FULL `${env:FILES_FOLDER}/rnd/research-docs/<this record's id>/media` template, never a machine path; `dt resolve` renders it. The bytes stay OUTSIDE the repo: an `assets` record is a small file the UI draws, this is megabytes for people to watch. What generated each piece, and against which corpus, goes in this record's body — a folder cannot say whether its media is still current.
  content:
    type: markdown
    body: true
    description: The findings, with the sources they rest on.
  tags:
    type: string
    many: true
    examples: ['pricing', 'harbor-mutual', 'onboarding']
    pattern: ^[a-z0-9]+(-[a-z0-9]+)*(:[a-z0-9]+(-[a-z0-9]+)*)?$
    description: Free labels, lowercase and hyphenated, optionally key:value with no space around the colon.
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…> · migration:<id>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
display:
  nav:
    icon: references
    order: 50
  list:
    columns:
      - name
      - last_modified
      - tags
