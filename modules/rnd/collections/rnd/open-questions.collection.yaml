# open-questions — the residue of research: what reading MORE cannot settle.
#
# Every one of these is closed by a CHOICE or by PRIMARY contact with a real person — never by
# another crawl. That is the whole distinction from a research QUESTION, which exists to be answered
# from evidence: this collection is the synthesis layer — what the evidence could not settle.
#
# Four things belong here and nothing else does:
#
#   - a **decision** only you can make (what to call it, what to charge, what to cut)
#   - an **assumption** that needs a real user to test, not a repo to read
#   - a **tension** between two findings that both look true
#   - a **risk** that is real, not yet realised, and worth naming before it is
#
# The failure mode this collection is guarding against is an agent answering an unanswerable
# question plausibly. A confident paragraph about what users will pay, produced from GitHub stars,
# is worse than an empty record — it launders a guess into the workspace where the next session reads it
# as a finding. When the evidence runs out, the correct move is a record HERE.
name: rnd/open-questions
description: >-
  The residue of research — what reading MORE cannot settle. Closed by a CHOICE or by primary contact with a real person, never by another crawl.
use_when: >-
  you are about to research something, or about to answer a hard question by guessing — search here first
storage:
  path: data/rnd/open-questions
  format: md
ids:
  from: "{{ name | slug }}"
  pattern: ^[a-z0-9][a-z0-9-]*$
fields:
  name:
    type: string
    required: true
    description: A short handle — the thing you would say out loud. Drives the id.
  question:
    type: string
    required: true
    description: The full question or the decision to be made, phrased so a person could answer it in one sitting.
  description:
    type: string
    description: One line on what is blocked while this stays open.
  kind:
    type: string
    required: true
    enum: [needs-decision, needs-primary-research, needs-data, unresolved-tension, assumption-to-test, risk]
    description: >-
      `needs-decision` = only you can settle it. `needs-primary-research` = requires talking to a human. `needs-data` = requires instrumenting something we do not yet run. `unresolved-tension` = two findings that both look true. `assumption-to-test` = something we are currently building on without evidence. `risk` = a named way this could go wrong.
  severity:
    type: string
    default: medium
    enum: [blocking, high, medium, low]
    description: '`blocking` = work is stopped until it is settled. Reserve it; most of these are not blocking.'
  status:
    type: string
    default: open
    enum: [open, in-progress, resolved, parked, obsolete]
    description: '`obsolete` = the question stopped mattering. Say why in `resolution` rather than deleting the record.'
  # No `owner`: an open question is yours to move unless its record says otherwise.
  blocks:
    type: string
    many: true
    description: >-
      Records that cannot be honestly answered while this stays open, as `<collection>/<id>` strings. A plain string, not a reference: the targets may live in another workspace or in a collection this module does not ship, so the value keeps its ref shape — greppable and re-linkable — without being validated. Anything else this blocks (a feature, a decision) goes in `description` and `content`. A screen or a journey whose shown behaviour waits on this question is blocked by it — the prototype's metadata layer marks it.
  from_question:
    type: string
    description: >-
      What produced this, when it came out of a research question, as `<collection>/<id>`. A plain string for the same reason as `blocks`.
  options:
    type: string
    many: true
    description: >-
      The live options, one per item, each stated as a choice someone could take. A `needs-decision` with no options listed is not ready to be decided.
  lean:
    type: string
    description: Our current lean and the reason for it, clearly marked as a lean rather than a finding.
  how_to_settle:
    type: string
    description: >-
      The concrete cheapest next action that would close this — "ask three of the built-own-tool cohort what made them stop", "ship it and count". Vague answers here are how these rot.
  resolution:
    type: string
    description: What was decided or found, once it closes. The record stays; it does not get deleted.
  resolved_on:
    type: date
    description: When it closed.
  product:
    type: rnd/products
    description: The product this concerns.
  tags:
    type: string
    many: true
    examples: ['developer-audience', 'second-brain', 'cautionary']
    pattern: ^[a-z0-9]+(-[a-z0-9]+)*(:[a-z0-9]+(-[a-z0-9]+)*)?$
    description: Free labels, lowercase and hyphenated, optionally key:value with no space around the colon.
  content:
    type: markdown
    body: true
    description: The full context — what we know, what we do not, and what each option would cost.
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…> · migration:<id>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
display:
  nav:
    icon: watch
    order: 54
  # What reading more cannot settle — the residue that closes only by a choice or by contact with a
  # real person. Sorted on `severity`, which groups the questions by it.
  list:
    columns: [name, kind, severity, status, from_question, resolved_on]
    sort: 'severity'
