# Defects found while using the tools this workspace runs on.
#
# Why a collection rather than GitHub issues: the bugs worth keeping are the ones found by USING the
# thing, and they are found mid-task, by an agent, with the evidence already on screen. A record
# written here costs one command and keeps the proof attached; a GitHub issue costs a context switch
# and usually gets a remembered paraphrase instead. What graduates to the tracker can be exported.
#
# `repo` is the point of the collection: an issue that does not name the repo it belongs to cannot be
# routed when the workspace runs several repos at once.
name: rnd/issues
description: A defect found while using one of this workspace's own repos — with the evidence that proves it.
use_when: >-
  you are about to diagnose a defect in one of this workspace's repos — search here first, filtered by repo. And the moment a defect is confirmed, file it here with the evidence: a fix without a record is a defect that will be re-derived
storage: {path: data/rnd/issues, format: md}
ids:
  from: "{{ created | date }}--{{ name | slug }}"
  pattern: "^\\d{4}-\\d{2}-\\d{2}--[a-z0-9-]+$"
fields:
  name:
    type: string
    required: true
    description: The defect in one line — what goes wrong, not what should happen.
  description:
    type: string
    description: One line for a list view, when the name alone is not enough.

  repo:
    type: repos
    required: true
    description: WHICH REPO. Required — an unrouted defect is a note, not an issue.
  component:
    type: string
    description: The file or subsystem, when it is known. Free text — a path, a module, a CLI verb.

  reported_by:
    type: string
    description: >-
      Who FOUND it — distinct from `author`, who wrote the record. A person hits a bug and an agent writes it up, so these genuinely differ. Name the agent when an agent found it (`agents/<harness>`, e.g. `agents/claude-code`); leave it absent when you did.

  status:
    type: string
    default: open
    enum: [open, confirmed, fixed, wont-fix, duplicate]
    description: '`confirmed` means reproduced deliberately, with the repro recorded in `evidence`. `open` is still a claim.'
  severity:
    type: string
    default: medium
    enum: [low, medium, high]
    description: How much damage it does when it hits.
  kind:
    type: string
    default: bug
    enum: [bug, silent-failure, papercut, docs-gap, design-flaw]
    description: What sort of wrong this is — which decides who should fix it and how urgently.

  evidence:
    type: markdown
    description: The field that earns the record. The command run and the output it produced — not a description of the bug, the proof of it. An empty `evidence` makes this a hypothesis the next person has to rediscover.
  workaround:
    type: string
    description: What to do until it is fixed. Often the most valuable field in the record.

  found_while:
    type: string
    description: What was being done when it surfaced — which says which real workflow the defect actually blocks.

  duplicate_of:
    type: rnd/issues
    description: The issue this repeats, when status is `duplicate`.
  fixed_in:
    type: string
    description: Commit sha, tag or version, once the fix lands.

  body:
    type: markdown
    body: true
    description: The full write-up — investigation, root cause, anything the fields cannot hold.
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    title: Information source
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…> · migration:<id>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
  product:
    type: rnd/products
    description: The product it is a defect of, when it is known at the product level. `repo` says where in the code; either routes it.
  change_requests:
    type: rnd/change-requests
    many: true
    mirror_of: issue
    description: GENERATED — the change requests this defect motivated. Set `issue` on the change request.
  tests:
    type: rnd/tests
    many: true
    mirror_of: covers
    description: GENERATED — the tests that regress this defect. Set `covers` on the test.
  implementation_plans:
    type: rnd/implementation-plans
    many: true
    mirror_of: issue
    description: GENERATED — the plans that fix this defect. Set `issue` on the plan.
display:
  nav:
    icon: bug
    order: 45
  list:
    columns:
      - name
      - status
      - severity
      - repo
      - kind
  form:
    sections:
      - title: Provenance
        fields: [author, creation_context, source, confidence]
        collapsed: true
