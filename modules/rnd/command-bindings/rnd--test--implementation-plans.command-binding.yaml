command: commands/rnd/test
collection: collections/rnd/implementation-plans
scope: record
available_when:
  status:
    _eq: done
  change_request:
    _empty: true
  code_approved_on:
    _nempty: true
  verified_on:
    _empty: true
done_when:
  tested_on:
    _nempty: true
description: "prove the reviewed plan that has no change request: every promised test from its run; all passing stamps tested_on. A plan with one is proved on the change request"
