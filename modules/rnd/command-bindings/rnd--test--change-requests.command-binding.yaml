command: commands/rnd/test
collection: collections/rnd/change-requests
scope: record
available_when:
  status:
    _eq: accepted
  verified_on:
    _empty: true
  implementation_plans:
    code_approved_on:
      _nempty: true
done_when:
  tested_on:
    _nempty: true
description: "prove the reviewed build: every covering test from its run; all passing stamps tested_on"
