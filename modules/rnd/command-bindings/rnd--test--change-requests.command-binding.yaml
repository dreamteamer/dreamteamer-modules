command: commands/rnd/test
collection: collections/rnd/change-requests
scope: record
available_when:
  status:
    _eq: accepted
  verified_on:
    _empty: true
  implementation_plans:
    status:
      _eq: done
done_when:
  verified_on:
    _nempty: true
description: "prove the built change: every covering test from its run, then the test review"
