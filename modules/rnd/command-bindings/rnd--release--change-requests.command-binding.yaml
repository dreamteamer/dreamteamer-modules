command: commands/rnd/release
collection: collections/rnd/change-requests
scope: record
available_when:
  status:
    _eq: accepted
  verified_on:
    _nempty: true
  deployed_on:
    _empty: true
  release:
    _nempty: true
done_when:
  deployed_on:
    _nempty: true
description: "the verified change ships in its release: run /rnd:release on the release this request names — its publication stamps deployed_on here"
