command: commands/rnd-deploy
collection: collections/rnd/change-requests
scope: record
available_when:
  status:
    _eq: accepted
  deployed_on:
    _empty: true
  implementation_plans:
    status:
      _eq: done
done_when:
  deployed_on:
    _nempty: true
description: "deploy the built, tested change and stamp deployed_on"
