command: commands/rnd/review
collection: collections/rnd/change-requests
scope: record
available_when:
  deployed_on:
    _nempty: true
  status:
    _eq: accepted
  # a change that ships in a release is live when the release is published — never before, even with
  # deployed_on written by hand on a release still planned or cut, or on one rolled back
  _or:
    - release:
        _empty: true
    - release:
        status:
          _eq: published
done_when:
  status:
    _eq: implemented
description: "after DEPLOY: the live check (kind acceptance, subject this request) — each acceptance line seen on the running thing; approve sets implemented"
