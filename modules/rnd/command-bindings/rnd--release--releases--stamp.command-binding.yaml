command: commands/rnd/release
collection: collections/rnd/releases
scope: record
# The publish step's resume: a release already published that carries a request with no deployed_on — the
# step stopped between publishing and stamping, or a request was scheduled into it afterwards. A hop through a
# many-valued reference matches ANY target, which is exactly "some carried request is unstamped"; there is no
# done_when because "every carried request is stamped" is the negation the grammar cannot say — the binding
# simply stops being available once the last one is stamped.
available_when:
  status:
    _eq: published
  change_requests:
    deployed_on:
      _empty: true
description: "STAMP — published, but a request it carries has no deployed_on: stamp each with this release's published_on (the publish step's last half, resumable on its own)"
