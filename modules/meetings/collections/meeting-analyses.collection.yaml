# meeting-analyses — the CRITIQUE layer over meeting-summaries.
#
# A summary answers "what happened". A meeting analysis answers "was it any good, and what should
# change" — it validates and scrutinises what was SAID (usually by the operator), separates what
# held up from what did not, and ends in suggestions. Deliberately opinionated where a summary is
# deliberately neutral.
#
# Spans MULTIPLE meetings on purpose (`meetings` is an array): a review usually covers an arc — two
# calls in a day, or a whole engagement to date — not one slot.
name: meeting-analyses
# inflection strips an s; the word people actually say is authored here (engine 0.28.0 `singular`)
singular: meeting-analysis
description: >-
  A critical judgement of a call — claims validated, performance scrutinised. Built on the raw transcript,
  never on the summary.
use_when: >-
  the operator asks how a call went, whether a claim held, why a deal was lost, or what the client
  actually asked for — the critique is here, built on the transcript. Also the first read before
  designing anything for that client
templates: [collection-templates/meetings-provenance]
storage: { path: data/meeting-analyses, codec: md, shape: file, suffix: analysis }
id:
  generate: "{{ created | date:YYYY/MM }}/{{ created | date }}--{{ name | slug }}"
  pattern: "^\\d{4}/\\d{2}/\\d{4}-\\d{2}-\\d{2}--[a-z0-9-]+$"
schema:
  type: object
  required: [name]
  properties:
    name:
      type: string
      description: What this review is called — usually the arc it covers, not one call.
    description:
      type: string
      description: One line on what was reviewed and why.
    date:
      type: string
      format: date
      description: When the REVIEW was written — not when the calls happened.
    meetings:
      type: array
      items: { type: string, x-reference: meetings }
      description: The calls under review. Plural by design — a review usually covers an arc, not one slot.
    summaries:
      type: array
      items: { type: string, x-reference: meeting-summaries }
      description: The summaries the review was written FROM, as opposed to the raw transcripts.
    about:
      type: string
      x-reference: "*"
      description: What the calls are ABOUT — a lead, client, company or product. Polymorphic, hence "*".
    reviewed:
      type: string
      x-reference: "*"
      description: >-
        WHOSE conduct and statements were scrutinised, when it is not the operator — a `contacts/<id>`
        whose claims the review weighed. ABSENT means the operator, which is the point of the exercise
        and was true of all 29 records, so it stopped being worth stating.
    lens:
      type: string
      description: The angle the review took ("objective validation of everything the operator said", "commercial posture"). States up front what was and was not being judged.
    verdict:
      type: string
      description: The bottom line in one line, so the list view is readable without opening anything.
    evidence_quality:
      type: string
      enum: [weak, mixed, strong]
      default: mixed
      description: How sound the evidence UNDER the critique is — separate from `confidence`, which is about the record. `weak` when ASR or attribution is bad enough that findings rest on inference.
    status:
      type: string
      enum: [draft, final, actioned, superseded]
      default: final
      description: Whether the operator has acted on it. A review nobody actioned is the failure mode this field exposes.
    follow_up:
      type: array
      items: { type: string, x-reference: tasks }
      description: Tasks carved out of the suggestions, once they exist.
    content:
      type: string
      format: markdown
      x-body: true
      description: The review itself — what held up, what did not, and what should change.
    # ---- merged in from the gk overlay, 2026-08-17 ------------------------------------------
    # These were an `extends:` overlay in the workspace module until `crm` was folded in. The
    # overlay existed because a MODULE may not carry one workspace's conventions; with one
    # module there is nothing to overlay onto, so the fields live here directly.
    prompt:
      type: string
      description: A self-contained prompt that would regenerate this analysis from the same sources.
order: 15   # immediately after meeting-summaries (14) — it is the layer above it
list_fields: [name, last-modified, date, about, status]
icon: report
group: crm
