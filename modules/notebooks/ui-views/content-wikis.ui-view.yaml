# the wikis list — the default a bare /content/wikis renders. No nav entry: the collection row IS the
# view.
#
# ⚠ `sources_incomplete` is the column this view exists for. It is a CACHE (the folder is the
# authority, `npx dt-extensions wiki verify` re-derives it), but it is the one number that says a
# corpus is not finished, and a corpus that looks finished and is not is the failure the whole
# collection was designed against. A table that showed only name and status would hide it.
path: /content/wikis
target: list
collection: collections/wikis
layout: table
options:
  columns:
    - name
    - adapter
    - sources_total
    - sources_incomplete
    - synced_at
    - status
  sort: '-sources_incomplete'
default: true
