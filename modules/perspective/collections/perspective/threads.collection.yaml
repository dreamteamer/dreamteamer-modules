# threads — ONE MAIL THREAD THE CONTRIBUTOR WROTE IN, mechanical. Counted, never judged, and
# deliberately thin: who wrote to whom, how often, when, under what subject. Nothing that was SAID.
#
# ⚠ WHY SO LITTLE. A mailbox is the most personal evidence store this module reads, and a workspace
# is cloned onto other machines. So the record carries exactly what the clustering and collaborator
# passes need — a subject to seed a label, handles to merge people on, dates and counts to place and
# weigh it — and refuses bodies, snippets, attachments and labels. A thread that a pass needs to
# READ is opened in the mail client by its `url`; it is never copied here.
name: perspective/threads
description: One mail thread the contributor wrote in — subject, participants as handles, counts and dates. Counted, never judged; no bodies.
use_when: >-
  the gmail reader runs (it writes here); an activity, decision or finding needs a thread as evidence —
  cite the record, never the URL; asked who a contributor corresponds with or what they were writing
  about in a period, filter here by first_on and read `participants` and `subject`. ⚠ The body of the
  mail is NOT here by design — open `url` in the mail client when a pass has to read one
storage: { path: data/perspective/threads, codec: md, shape: file, suffix: thread }
id:
  generate: "{{ contributor }}/{{ source | basename }}/{{ external_id }}"
  pattern: "^[a-z0-9-]+/[a-z-]+--[a-z0-9-]+/[A-Za-z0-9_-]+$"
schema:
  type: object
  required: [retrospective, contributor, source, external_id, subject]
  properties:
    retrospective: { type: string, x-reference: perspective/retrospective-sessions, description: The retrospective session that FIRST wrote this record. }
    last_seen_in: { type: string, x-reference: perspective/retrospective-sessions, description: 'The most recent session that confirmed or updated it. Absent means exactly one session has ever touched it, which is how "new since last time" is answered without a diff.' }
    contributor: { type: string, pattern: '^[a-z0-9-]+$', description: 'WHOSE this is, as a slug — and the FIRST SEGMENT OF THE ID. That is what makes a second retrospective UPDATE this record instead of writing one beside it. A plain slug rather than a reference, because an id segment cannot be one; the person''s own observed-world record is perspective/users/<contributor>/<their-name-slug>.' }
    source: { type: string, x-reference: perspective/sources, description: The gmail source this was read from. }
    external_id: { type: string, description: 'Gmail''s thread id. THE FORCING FIELD; the id is built from it.' }
    subject: { type: string, description: 'The first message''s subject with Re:/Fwd: prefixes stripped — what the thread is ABOUT. The one text field, kept for the label seed.' }
    participants: { type: array, items: { type: string }, description: 'Every address on the thread, lowercased, sorted — the contributor included. Joined to collaborators.handles, never to a name.' }
    message_count: { type: integer, description: Messages in the thread. }
    contributor_messages: { type: integer, description: 'Of those, how many the contributor sent. A thread with 0 is never written — it is not their work.' }
    first_on: { type: string, format: date, description: The first message's date. What the cluster pass places the thread on. }
    last_on: { type: string, format: date }
    url: { type: string, description: The thread in the mail client. Where a pass goes when it must read one. }
    read_with: { type: string, description: 'Which reader version wrote this — `read-gmail@1`.' }
    content:
      type: string
      format: markdown
      x-body: true
      description: One line of counts and dates, then the participants as handles. Never the mail.
    # ---- provenance: who made this record, from what, and how much to trust it. Inlined from the
    # perspective-provenance template on 2026-10-01; one shared template per module was a copy of the same quad twelve times.
    author:
      type: string
      description: >-
        Which AGENT or SCRIPT made this record — `agents/dreamteamer (claude-fable-5)` or
        `scripts/read-claude-transcripts@metrics/1`. Absent when the person wrote it themselves.
    creation_context:
      type: string
      description: How and why this record came to be, in one line — and the reason whenever confidence is low.
    confidence:
      type: string
      enum: [low, normal, high]
      default: normal
      description: How much to trust this record. When low, the reason goes in creation_context.
list_fields: [subject, first_on, message_count, contributor_messages, participants]
icon: mail
order: 60   # nav position — the evidence it condensed; the pipeline order, ten apart so one can be inserted without renumbering
