# perspective/activities — A BOUNDED PIECE OF WORK, RECONSTRUCTED. Sessions, commits and tickets clustered
# around topics into the thing a person would call 'that task'. Rendered as a gantt (x started, y
# group-by). Commits are SHAs as text — git holds the record, this holds the pointer.
#
# ⚠ THE OBSERVED HALF OF `activities`, IN THE SAME SHAPE AND IN A SEPARATE STORE — the argument is
# written out once, on `perspective/users.real`. Two shapes are deliberately NOT copied from the real
# collection and both are the same distinction: `kind: work|gate` (a gate is something a person
# DECIDES to judge — evidence never contains one) and `starts`/`ends` (a plan is written ahead; these
# are past tense). What IS copied is the relation spine — `project`, `lead` — and `real`.
name: perspective/activities
templates: [collection-templates/perspective-observation]
description: A bounded piece of a contributor's work reconstructed from sessions, commits and tickets around one or more topics.
use_when: >-
  the cluster stage writes them; a workflow cites them as its evidence; asked what a contributor was
  doing in a period and with whom — list here by started, group by topic or collaborator. A record
  with collaborators is collaborative work; a run of them is a collaborative workflow
storage: { path: data/perspective/activities, codec: md, shape: file, suffix: activity }
id:
  generate: "{{ contributor }}/{{ started | date }}--{{ name | slug }}"
  pattern: "^[a-z0-9-]+/\\d{4}-\\d{2}-\\d{2}--[a-z0-9-]+$"
schema:
  type: object
  required: [retrospective, contributor, name, started]
  properties:
    retrospective: { type: string, x-reference: perspective/retrospective-sessions, description: The retrospective session that FIRST wrote this record. }
    last_seen_in: { type: string, x-reference: perspective/retrospective-sessions, description: 'The most recent session that confirmed or updated it. Absent means exactly one session has ever touched it, which is how "new since last time" is answered without a diff.' }
    contributor: { type: string, pattern: '^[a-z0-9-]+$', description: 'WHOSE this is, as a slug — and the FIRST SEGMENT OF THE ID. That is what makes a second retrospective UPDATE this record instead of writing one beside it. A plain slug rather than a reference, because an id segment cannot be one; the person''s own observed-world record is perspective/users/<contributor>/<their-name-slug>.' }
    name: { type: string, description: What the work was, as a person would name the task. }
    # ── WHOSE ────────────────────────────────────────────────────────────────────────────────────
    # ⚠ THE ORG AXIS, AND IT IS ONE ID SEGMENT RATHER THAN A SECOND COPY OF THE MODEL. A run used to BE a
    # person: `retrospective` keyed every record, so three contributors meant three parallel models
    # in three workspaces, each one's collaborators strangers to the others, and no query that could
    # ask "who else worked on this". Operator, 2026-09-08: "support multiple collaborators, minimal
    # data structure, don't multiply".
    #
    # So the person is the FIRST SEGMENT OF THE ID, and `contributor` above carries it as a bare slug.
    # It WAS a `perspective/users` reference, for one day: an id segment cannot be one, and the
    # slug pattern on the field is what refuses it now rather than a comment. The person's own record
    # is `perspective/users/<contributor>/<their-name-slug>` — one hop, derived, never stored
    # twice. `retrospective` still says which RUN produced this, a different question that stays.
    #
    # Empty means the run never said, not "everyone" — and a record whose contributor cannot be
    # determined is not written, because there would be no id to write it under.
    # ⚠ `started`/`ended`, NOT `starts`/`ends` — see the same note on `perspective/projects`. A plan rung is
    # scheduled; this is the window evidence exists in.
    started: { type: string, format: date, description: 'The gantt''s x. First evidence date — past tense on purpose; `activities.starts` is a plan.' }
    ended: { type: string, format: date, description: Last evidence date. Absent while ongoing. }
    status: { type: string, enum: [done, ongoing, abandoned, unknown], default: unknown, description: OBSERVED from the evidence, never declared. }
    project:
      type: string
      x-reference: perspective/projects
      x-inverse: activities
      description: The logical project this work belongs to, assigned by the projects pass.
    # ── THE SHAPE `activities` HAS ─────────────────────────────────────────────────────────────────
    lead:
      type: string
      x-reference: perspective/users
      x-inverse: led_activities
      description: >-
        Who the evidence shows drove this — most of the commits, the ticket's assignee, the person in
        the session. OBSERVED, never appointed; the real collection's `lead` is who was made
        accountable. Empty is common and honest: most reconstructed work has no visible lead.
    real:
      type: string
      x-reference: activities
      x-reference-soft: true
      description: >-
        The `activities` record this observed work appears to BE — the one-way, soft join to the plan
        rung a person authored. A PROPOSAL, set only on a confirmed match. The argument for one-way and
        for soft is written out once, on `perspective/users.real`.
    topics:
      type: array
      items: { type: string, x-reference: perspective/topics }
      x-inverse: activities
    # ⚠ `collaborators`, NOT `seats` — the real collection's word for the same slot. A SEAT is
    # allocated by whoever wrote the plan; a collaborator is somebody the evidence put here. Same
    # target, same cardinality, different verb, and the verb is the fact.
    collaborators:
      type: array
      items: { type: string, x-reference: perspective/users }
      x-inverse: activities
    collaborative: { type: boolean, default: false, description: 'DERIVED: true iff collaborators is non-empty. check-records enforces the agreement.' }
    from_candidate:
      type: string
      description: >-
        The `key` of the cluster candidate this activity was named from — `<repo>--<YYYY-MM-DD>`, one
        short string. ⚠ THIS IS HOW EVIDENCE IS ATTACHED, and it exists because the alternative
        failed measurably: when the naming pass was asked to copy session refs by hand, 615 of 1,068
        conversations were silently dropped — one candidate held 257 sessions and no model copies 257
        refs onto a command line. So the model names and BOUNDS the work; `bin/attach-evidence.mjs`
        assigns the candidate's sessions, commits, branches and tickets deterministically, splitting
        by date window when one candidate produced several activities.
        Absent on a hand-written activity, which keeps whatever refs a person put on it.
    sessions:
      type: array
      items: { type: string, x-reference: perspective/conversations }
      description: 'ATTACHED, not typed — see `from_candidate`. A hand-written activity may carry its own.'
      x-inverse: activities
    commits: { type: array, items: { type: string }, description: 'Commit SHAs as text — pointers into git, which is the record. 7–40 hex each.' }
    branches: { type: array, items: { type: string }, description: Branch names the work landed on, as text. }
    tickets:
      type: array
      items: { type: string, x-reference: perspective/tickets }
      x-inverse: activities
    # A deliverable is the natural evidence for a document-shaped contributor's activity — the thing
    # that came OUT of the work. Added 2026-09-08 with the drive reader: without it, an activity
    # reconstructed from 53 specs could cite nothing at all and read as an unevidenced assertion.
    deliverables:
      type: array
      items: { type: string, x-reference: perspective/deliverables }
      x-inverse: activities
      description: The artefacts this work produced, where a pass could tell.
    threads:
      type: array
      items: { type: string, x-reference: perspective/threads }
      x-inverse: activities
      description: The mail threads this work ran through — the correspondence around it, cited as handles-and-counts records, never as mail.
    # The calendar half of a piece of work. ⚠ A REFERENCE INTO A PEER COLLECTION, and no `x-inverse`:
    # a peer excuses a reference, never a mirror — stamping `meetings.activities` onto another
    # module's collection is what makes an extraction uncompilable alone. So the edge is one-way and
    # the meeting record never learns about the activity, which is the correct trade: a workspace
    # without the meetings module has activities with no `meetings` field and nothing dangles.
    #
    # And no summary, prep or analysis text is ever copied onto the activity — the ref IS the pointer.
    meetings:
      type: array
      items: { type: string, x-reference: meetings }
      description: The calendar meetings this work ran through, attached by `bin/attach-evidence.mjs` from the candidate. Attendance, not participation.
    repos: { type: array, items: { type: string, x-reference: repos } }
    active_minutes: { type: number, description: Summed from the sessions. }
    turns_user: { type: integer, description: Summed from the sessions. }
    commit_count: { type: integer }
    meeting_count: { type: integer, description: 'ROLLED UP — how many meetings this activity rests on. Read beside `session_count` and `commit_count`: an activity with meetings and neither of those is work that happened in rooms, and its absent token figures are a fact about the evidence, not about the work.' }
    meeting_minutes: { type: integer, description: 'ROLLED UP — the scheduled minutes of this activity''s meetings, summed from the reader''s own parking lot. Absent when none of them carried an end time.' }
    session_count: { type: integer, description: 'ROLLED UP — how many conversations this activity rests on. Read beside `commit_count`: an activity with commits and no sessions was reconstructed from git alone, and its `active_minutes` being 0 is a fact about the evidence, not about the work.' }
    tokens_input: { type: integer, description: ROLLED UP from the sessions — input tokens this piece of work cost. }
    tokens_output: { type: integer, description: "ROLLED UP from the sessions — output tokens. ⚠ The operator's own ranking: this matters LESS than turns. It is fine if it burns a billion tokens once and out comes the code; the expensive failure is having to talk to it a thousand times." }
    tokens_cache_read: { type: integer, description: ROLLED UP — cached input tokens re-read across the sessions. Nearly the whole input bill on agentic work. }
    tokens_cache_write: { type: integer, description: ROLLED UP — tokens spent writing context into the cache. }
    tokens_total: { type: integer, description: "ROLLED UP — what this piece of work actually burned, all four components. The number to quote." }
    input_words: { type: integer, description: ROLLED UP — words the operator had to type across this activity's sessions. The denominator of the productivity ratio. }
    output_words: { type: integer, description: ROLLED UP — words of assistant output across the sessions. Meaningless without `correction_ratio` beside it, which is why that is rolled up too. }
    correction_ratio: { type: number, description: "ROLLED UP — this activity's corrected words over its produced words, computed from the SUMS rather than averaged across sessions (averaging a ratio weights a two-turn session like a two-hundred-turn one). ⚠ The direction is the point: it should FALL as the work matures." }
    tool_calls: { type: integer, description: ROLLED UP from the sessions. }
    files_edited: { type: integer, description: ROLLED UP from the sessions — summed, so a file touched in two sessions counts twice. A volume signal, not a distinct-file count. }
    corrections: { type: integer, description: ROLLED UP — `user_correction` turns summed across the sessions. The expensive class of turn, and the one that says a skill is missing or the work arrived broken from an earlier stage. }
    interruptions: { type: integer, description: ROLLED UP — times the operator stopped the agent mid-flight during this piece of work. }
    content: { type: string, format: markdown, x-body: true }
    author:
      type: string
      pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
      examples: ['agents/claude-code', 'scripts/read-git@2']
      description: >-
        Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a
        reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
    creation_context:
      type: string
      description: How and why this record came to be, in one line — and the reason whenever confidence is low.
    source:
      type: string
      description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…>.'
    confidence:
      type: string
      enum: [low, normal, high]
      default: normal
      description: How much to trust this record. When low, the reason goes in creation_context.
list_fields: [name, started, ended, status, lead, collaborative, real]
icon: pulse   # not `milestone` — an observed activity is a TRACE of work; `plan/activities` owns the plan rung
order: 80   # nav position — the model it reconstructed; the pipeline order, ten apart so one can be inserted without renumbering
