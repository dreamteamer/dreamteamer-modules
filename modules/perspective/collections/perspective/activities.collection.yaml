# perspective/activities — A BOUNDED PIECE OF WORK, RECONSTRUCTED. Sessions, commits and tickets clustered
# around topics into the thing a person would call 'that task'. Rendered as a gantt (x started, y
# group-by). Commits are SHAs as text — git holds the record, this holds the pointer.
#
# THE OBSERVED HALF OF `activities`, IN THE SAME SHAPE AND IN A SEPARATE STORE — the argument is
# written out once, on `perspective/users.real`. Two shapes are deliberately NOT copied from the real
# collection and both are the same distinction: `kind: work|gate` (a gate is something a person
# DECIDES to judge — evidence never contains one) and `starts`/`ends` (a plan is written ahead; these
# are past tense). What IS copied is the relation spine — `project`, `lead` — and `real`.
name: perspective/activities
description: A bounded piece of a contributor's work reconstructed from sessions, commits and tickets around one or more topics.
use_when: >-
  the cluster stage writes them; a workflow cites them as its evidence; asked what a contributor was doing in a period and with whom — list here by started, group by topic or collaborator. A record with collaborators is collaborative work; a run of them is a collaborative workflow
storage: {path: data/perspective/activities, format: md}
ids:
  from: "{{ contributor }}/{{ started | date }}--{{ name | slug }}"
  pattern: "^[a-z0-9-]+/\\d{4}-\\d{2}-\\d{2}--[a-z0-9-]+$"
mixins:
  - perspective-observation
fields:
  retrospective: {type: perspective/retrospective-sessions, required: true, description: The retrospective session that FIRST wrote this record.}
  last_seen_in: {type: perspective/retrospective-sessions, description: 'The most recent session that confirmed or updated it. Absent means exactly one session has ever touched it, which is how "new since last time" is answered without a diff.'}
  contributor: {type: string, required: true, pattern: '^[a-z0-9-]+$', description: 'WHOSE this is, as a slug — and the FIRST SEGMENT OF THE ID. That is what makes a second retrospective UPDATE this record instead of writing one beside it. A plain slug rather than a reference, because an id segment cannot be one; the person''s own observed-world record is perspective/users/<contributor>/<their-name-slug>.'}
  name: {type: string, required: true, description: What the work was}
  # ── WHOSE ────────────────────────────────────────────────────────────────────────────────────
  # THE ORG AXIS IS ONE ID SEGMENT, NOT A SECOND COPY OF THE MODEL. The person is the FIRST SEGMENT
  # OF THE ID, so several contributors share one model and "who else worked on this" is one query.
  # `contributor` carries it as a bare slug, because an id segment cannot be a reference; the
  # person's own record is `perspective/users/<contributor>/<their-name-slug>` — one hop, derived,
  # never stored twice. `retrospective` says which RUN produced this, a different question.
  #
  # A record whose contributor cannot be determined is not written: there is no id to write it under.
  # `started`/`ended`, NOT `starts`/`ends` — see the same note on `perspective/projects`. A plan rung is
  # scheduled; this is the window evidence exists in.
  started: {type: date, required: true, description: 'The gantt''s x. First evidence date — past tense on purpose; `activities.starts` is a plan.'}
  ended: {type: date, description: Last evidence date. Absent while ongoing.}
  status: {type: string, default: unknown, enum: [done, ongoing, abandoned, unknown], description: OBSERVED from the evidence}
  project:
    type: perspective/projects
    description: The logical project this work belongs to, assigned by the projects pass.
  # ── THE SHAPE `activities` HAS ─────────────────────────────────────────────────────────────────
  lead:
    type: perspective/users
    description: >-
      Who the evidence shows drove this — most of the commits, the ticket's assignee, the person in the session. OBSERVED, never appointed; the real collection's `lead` is who was made accountable. Empty is common and honest: most reconstructed work has no visible lead.
  real:
    type: activities
    soft: true
    description: >-
      The `activities` record this observed work appears to BE — the one-way, soft join to the plan rung a person authored. A PROPOSAL, set only on a confirmed match. The argument for one-way and for soft is written out once, on `perspective/users.real`.
  topics:
    type: perspective/topics
    many: true
  # `collaborators`, NOT `seats` — the real collection's word for the same slot. A SEAT is
  # allocated by whoever wrote the plan; a collaborator is somebody the evidence put here. Same
  # target, same cardinality, different verb, and the verb is the fact.
  collaborators:
    type: perspective/users
    many: true
  collaborative: {type: boolean, default: false, description: 'DERIVED: true iff collaborators is non-empty. check-records enforces the agreement.'}
  from_candidate:
    type: string
    description: >-
      The `key` of the cluster candidate this activity was named from — `<repo>--<YYYY-MM-DD>`, one short string. THIS IS HOW EVIDENCE IS ATTACHED: a candidate can hold hundreds of sessions, and no model reliably copies that many refs onto a command line. So the model names and BOUNDS the work; `bin/attach-evidence.mjs` assigns the candidate's sessions, commits, branches and tickets deterministically, splitting by date window when one candidate produced several activities. Absent on a hand-written activity, which keeps whatever refs a person put on it.
  sessions:
    type: perspective/conversations
    many: true
    description: 'ATTACHED, not typed — see `from_candidate`. A hand-written activity may carry its own.'
  commits: {type: string, many: true, description: 'Commit SHAs as text — pointers into git, which is the record. 7–40 hex each.'}
  branches: {type: string, many: true, description: Branch names the work landed on}
  tickets:
    type: perspective/tickets
    many: true
  # A deliverable is the natural evidence for a document-shaped contributor's activity — the thing
  # that came OUT of the work. Without it, an activity reconstructed from documents could cite
  # nothing at all and would read as an unevidenced assertion.
  deliverables:
    type: perspective/deliverables
    many: true
    description: The artefacts this work produced, where a pass could tell.
  threads:
    type: perspective/threads
    many: true
    description: The mail threads this work ran through — the correspondence around it, cited as handles-and-counts records, never as mail.
  # The calendar half of a piece of work. A REFERENCE INTO A PEER COLLECTION, and no `mirror_of`:
  # a peer excuses a reference, never a mirror — stamping `meetings.activities` onto another
  # module's collection is what makes an extraction uncompilable alone. So the edge is one-way and
  # the meeting record never learns about the activity, which is the correct trade: a workspace
  # without the meetings module has activities with no `meetings` field and nothing dangles.
  #
  # And no summary, prep or analysis text is ever copied onto the activity — the ref IS the pointer.
  meetings:
    type: meetings
    many: true
    description: The calendar meetings this work ran through, attached by `bin/attach-evidence.mjs` from the candidate. Attendance, not participation.
  repos: {type: repos, many: true}
  active_minutes: {type: number, description: Summed from the sessions.}
  turns_user: {type: integer, description: Summed from the sessions.}
  commit_count: {type: integer}
  meeting_count: {type: integer, description: 'ROLLED UP — how many meetings this activity rests on. Read beside `session_count` and `commit_count`: an activity with meetings and neither of those is work that happened in rooms, and its absent token figures are a fact about the evidence, not about the work.'}
  meeting_minutes: {type: integer, description: 'ROLLED UP — the scheduled minutes of this activity''s meetings, summed from the reader''s own parking lot. Absent when none of them carried an end time.'}
  session_count: {type: integer, description: 'ROLLED UP — how many conversations this activity rests on. Read beside `commit_count`: an activity with commits and no sessions was reconstructed from git alone, and its `active_minutes` being 0 is a fact about the evidence, not about the work.'}
  tokens_input: {type: integer, description: ROLLED UP from the sessions — input tokens this piece of work cost.}
  tokens_output: {type: integer, description: "ROLLED UP from the sessions — output tokens. This matters LESS than turns: burning a billion tokens once is fine if the code comes out; having to talk to the agent a thousand times is the expensive failure."}
  tokens_cache_read: {type: integer, description: ROLLED UP — cached input tokens re-read across the sessions. Nearly the whole input bill on agentic work.}
  tokens_cache_write: {type: integer, description: ROLLED UP — tokens spent writing context into the cache.}
  tokens_total: {type: integer, description: "ROLLED UP — what this piece of work actually burned, all four components. The number to quote."}
  input_words: {type: integer, description: ROLLED UP — words the person had to type across this activity's sessions. The denominator of the productivity ratio.}
  output_words: {type: integer, description: ROLLED UP — words of assistant output across the sessions. Meaningless without `correction_ratio` beside it}
  correction_ratio: {type: number, description: "ROLLED UP — this activity's corrected words over its produced words, computed from the SUMS rather than averaged across sessions (averaging a ratio weights a two-turn session like a two-hundred-turn one). The direction is the point: it should FALL as the work matures."}
  tool_calls: {type: integer, description: ROLLED UP from the sessions.}
  files_edited: {type: integer, description: ROLLED UP from the sessions — summed}
  corrections: {type: integer, description: ROLLED UP — `user_correction` turns summed across the sessions. The expensive class of turn}
  interruptions: {type: integer, description: ROLLED UP — times the person stopped the agent mid-flight during this piece of work.}
  concepts:
    type: perspective/concepts
    many: true
    mirror_of: classifies
  decisions:
    type: perspective/decisions
    many: true
    mirror_of: activity
  goals:
    type: perspective/goals
    many: true
    mirror_of: activities
  terms:
    type: perspective/terms
    many: true
    mirror_of: mentions
    description: The words this record cannot be read without — generated from `terms.mentions`.
  workflows:
    type: perspective/workflows
    many: true
    mirror_of: activities
  content: {type: markdown, body: true}
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context.
display:
  nav:
    icon: pulse
    order: 80
  list:
    columns:
      - name
      - started
      - ended
      - status
      - lead
      - collaborative
      - real
