# perspective/projects — A LOGICAL PROJECT, OBSERVED. Not `projects` (a delivery effort a person authored,
# with a plan under it) and not an Asana
# project (a board someone made): this is the bounded effort the EVIDENCE shows a contributor working
# on, inferred from the repos they commit to, the ticket boards their tickets sit in, and the topics
# their activities share. Activities point at it; the perspective lists them inline.
#
# ⚠ THE OBSERVED HALF OF `projects`, IN THE SAME SHAPE AND IN A SEPARATE STORE — see
# `perspective/users.real` for the whole argument, which holds identically here. `real` is the one-way,
# soft join to the authored record; everything from `session_count` down is what OBSERVING is and has
# no counterpart in the real collection, because nobody measures a plan they are still writing.
name: perspective/projects
templates: [collection-templates/perspective-observation]
description: A logical project a contributor's work clusters into — inferred from repos, ticket boards and topics, never declared. The observed half of `projects`.
use_when: >-
  the projects pass groups activities into the efforts they belong to; an activity needs its `project`;
  asked what a contributor's work IS, at the level above tasks — list here by how many activities point at them. Search
  before creating: an Asana board and a repo for the same effort are one project with two `sources`
storage: { path: data/perspective/projects, codec: md, shape: file, suffix: project }
id:
  generate: "{{ contributor }}/{{ name | slug }}"
  pattern: "^[a-z0-9-]+/[a-z0-9-]+$"
schema:
  type: object
  required: [retrospective, contributor, name, kind]
  properties:
    retrospective: { type: string, x-reference: perspective/retrospective-sessions, description: The retrospective session that FIRST wrote this record. }
    last_seen_in: { type: string, x-reference: perspective/retrospective-sessions, description: 'The most recent session that confirmed or updated it. Absent means exactly one session has ever touched it, which is how "new since last time" is answered without a diff.' }
    contributor: { type: string, pattern: '^[a-z0-9-]+$', description: 'WHOSE this is, as a slug — and the FIRST SEGMENT OF THE ID. That is what makes a second retrospective UPDATE this record instead of writing one beside it. A plain slug rather than a reference, because an id segment cannot be one; the person''s own observed-world record is perspective/users/<contributor>/<their-name-slug>.' }
    name: { type: string, description: What the person would call the project. }
    # ── THE SHAPE `projects` HAS ───────────────────────────────────────────────────────────────────
    # `code`, `company`, `lead` and `real` are the real collection's own words, so the two read as one
    # world. What is NOT copied: `starts`/`ends` (this collection spells them `started`/`ended`, past
    # tense, because a plan is written AHEAD and an observation is read BEHIND — see below), `teams`
    # (a staffing decision nobody makes in evidence) and `repo` (the observed answer is `repo_names`,
    # which needs no `repos` record to exist).
    code:
      type: string
      description: >-
        The short handle the evidence shows the effort being called — a ticket prefix, a repo name
        used as shorthand, a branch namespace. Free-form exactly as the real collection's is. Absent
        when the evidence only ever spells the project out.
    company:
      type: string
      x-reference: companies
      x-reference-soft: true
      description: >-
        Who the evidence shows the work is FOR. A PEER reference and SOFT — see `real` below; a
        workspace with no CRM leaves it empty and nothing dangles.
    lead:
      type: string
      x-reference: perspective/users
      x-inverse: led_projects
      description: >-
        Who the evidence shows accountable — the person with most of the commits, the ticket owner,
        the one who answers. OBSERVED, exactly as `status` is; the real collection's `lead` is
        appointed. Empty is honest and common: plenty of efforts have no visible lead.
    real:
      type: string
      x-reference: projects
      x-reference-soft: true
      description: >-
        The `projects` record this observed effort appears to BE — the one-way, soft join to the world
        a person authored. A PROPOSAL, set only on a confirmed match. The argument for one-way and for
        soft is written out once, on `perspective/users.real`.
    kind:
      type: string
      enum: [product, client, internal, venture, platform, unknown]
      default: unknown
      description: OBSERVED from what the work delivers — a product shipped, a client served, internal tooling, a side venture, shared platform.
    repo_names: { type: array, items: { type: string }, description: 'The repos this project lives in, as folder names — text, because a fresh workspace has no repos records yet.' }
    repos: { type: array, items: { type: string, x-reference: repos }, description: The registered repos records, where they exist. }
    ticket_projects: { type: array, items: { type: string }, description: The ticketing-system project or board names whose tickets belong here. }
    topics:
      type: array
      items: { type: string, x-reference: perspective/topics }
      x-inverse: projects
    collaborators:
      type: array
      items: { type: string, x-reference: perspective/users }
      x-inverse: projects
    # ⚠ `started`/`ended`, NOT `starts`/`ends`, and the tense is the whole distinction. The real
    # collection's `starts` is a PLAN — a date somebody chose, in the future when they wrote it. These
    # are the first and last dates evidence EXISTS for. Spelling them the same would assert the two
    # mean the same thing, in the one place the difference is visible for free.
    started: { type: string, format: date, description: 'First evidence date. Past tense on purpose — `projects.starts` is a plan, this is an observation.' }
    ended: { type: string, format: date, description: Last evidence date; absent while ongoing. }
    status: { type: string, enum: [active, dormant, done, unknown], default: unknown, description: OBSERVED — active if evidence within the last 30 days, dormant if none for 30–180, done if the evidence closes it. }
    commit_count: { type: integer }
    ticket_count: { type: integer }
    # ── THE LIFECYCLE NUMBERS ──────────────────────────────────────────────────────────────────
    # Rolled up from this project's activities by bin/rollup-metrics.mjs, never typed by a model.
    # They exist so the body above them can NARRATE the project's production lifecycle — what it
    # cost, how it moved, and whether it converged — instead of asserting a shape nobody measured.
    # ⚠ Absent, not zero, where the evidence does not exist: a project reconstructed from commits
    # alone has no session numbers at all, and a 0 there would read as "this was free".
    session_count: { type: integer, description: ROLLED UP — conversations across every activity in this project. }
    active_minutes: { type: number, description: "ROLLED UP — EFFORT, and the honest version of it: engaged minutes, not wall-clock between first and last commit." }
    turns_user: { type: integer, description: "ROLLED UP — operator turns. The north-star cost: it is fine to burn a billion tokens once, expensive to have to talk to it a thousand times." }
    corrections: { type: integer, description: ROLLED UP — correction turns. Against `turns_user` this is the curve that is supposed to fall as a project matures. }
    interruptions: { type: integer, description: ROLLED UP — times the operator stopped the agent mid-flight on this project. }
    tokens_total: { type: integer, description: ROLLED UP — input + output + cache read + cache write across every session. The number to quote when someone asks what this project burned. }
    input_words: { type: integer, description: ROLLED UP — words the operator had to type. The denominator. }
    output_words: { type: integer, description: ROLLED UP — words of assistant output. The numerator, worthless without `correction_ratio`. }
    correction_ratio: { type: number, description: "ROLLED UP from the SUMS, never averaged across activities. PERFORMANCE, in the one direction that means anything: it should FALL." }
    lines_new: { type: integer, description: "ROLLED UP from the weeks this project's repos were active — CURVE ONE, code that did not exist before." }
    lines_modified: { type: integer, description: "ROLLED UP — CURVE TWO, changes to code that already existed. The expected shape: produce a lot, produce little, edit a lot, edit little, stop." }
    commits_bug: { type: integer, description: ROLLED UP — commits whose subject says defect. }
    commits_change_request: { type: integer, description: "ROLLED UP — commits whose subject says requirement shift. Read as a SHARE against `commits_bug`: a converging project's remaining changes should be requirement-driven, and a rising bug share late is the alarm." }
    converging:
      type: boolean
      description: "JUDGED, over the whole project rather than week to week — did both code curves flatten? That is what done looks like, in the operator's words: you produce a lot, then little, then you edit a lot, then little, and then you stop. ⚠ Never judged from two adjacent weeks; a spike is an event, not a trend."
    lifecycle_stage:
      type: string
      enum: [exploring, building, hardening, maintaining, converged, abandoned]
      description: "JUDGED from the curves and the evidence, not declared. `exploring` — high sessions, few commits, no shape yet. `building` — lines_new dominates. `hardening` — lines_modified dominates and the bug share is rising. `maintaining` — both curves low and flat but evidence continues. `converged` — both flat and the work stopped because it was DONE. `abandoned` — both flat and it stopped because it was dropped. ⚠ The last two look identical in the numbers and are told apart only by what the evidence SAYS; if you cannot tell, the honest answer is `maintaining`."
    content:
      type: string
      format: markdown
      x-body: true
      description: >-
        THE NARRATIVE — this project's production lifecycle told as prose, which is the reason every
        field above it is counted. Four parts, in this order: what the project IS and how the pass
        decided its bounds; the ARC, phase by phase with dates, naming what changed at each turn and
        citing the numbers that show it; the work BY TOPIC, each topic with its own effort, tokens and
        lines so the reader can see where the time actually went; and what the numbers SAY about where
        it stands now — converging, hardening, or stalled — stated as a judgement with its evidence,
        never as a summary of the fields.
        ⚠ Every figure quoted here must be one of the fields above, unrounded and unembellished. A
        number in this body that is not in the frontmatter is a number nobody measured.
    # ---- provenance: who made this record, from what, and how much to trust it. Inlined from the
    # perspective-provenance template on 2026-10-01; one shared template per module was a copy of the same quad twelve times.
    author:
      type: string
      description: >-
        Which AGENT or SCRIPT made this record — `agents/dreamteamer (claude-fable-5)` or
        `scripts/read-claude-transcripts@metrics/1`. Absent when the person wrote it themselves.
    creation_context:
      type: string
      description: How and why this record came to be, in one line — and the reason whenever confidence is low.
    source:
      type: string
      description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…>.'
    confidence:
      type: string
      enum: [low, normal, high]
      default: normal
      description: How much to trust this record. When low, the reason goes in creation_context.
list_fields: [name, kind, lifecycle_stage, status, lead, real, active_minutes, tokens_total, started, ended]
icon: project
order: 90   # nav position — the model it reconstructed; the pipeline order, ten apart so one can be inserted without renumbering
