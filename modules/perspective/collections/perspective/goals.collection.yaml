# perspective/goals — WHAT THE CONTRIBUTOR WAS TRYING TO MAKE TRUE, INFERRED. Not `goals`, which a person
# DECLARES about their own future and whose `done_when` they wrote. This one is read backwards out of
# what they actually did: a goal here is the outcome that explains a run of decisions, a project's arc
# and a cluster of activities, and it is only ever as good as the evidence under it.
#
# THE OBSERVED HALF OF `goals`, IN THE SAME SHAPE AND IN A SEPARATE STORE — the argument is written
# out once, on `perspective/users.real`. It is the world object where the argument bites hardest: every
# other one is reconstructed from evidence that NAMES its constituents (a commit exists, a ticket
# exists, a handle exists), while a goal is read out of the SHAPE of what was done and nothing in the
# evidence ever says "the goal was X". That is why `standing`, `evidence_count` and
# `needs_confirmation` live here and on `findings` and NOWHERE ELSE among the observed-world collections — they are
# not "the finding apparatus every world object needs", they are the apparatus the one BACKWARD
# inference needs. That reading is the fork in this design most open to argument: `perspective/projects`
# is also called inferred, and the line between "inferred from records that name it" and "inferred
# from the shape of the work" is a judgement, not a measurement.
#
# THE FAILURE MODE THIS COLLECTION INVITES is writing down the obvious. "Ship the product" explains
# everything and predicts nothing; it is a category, not a goal. A goal earns its record when it
# EXCLUDES something — when knowing it would have let you predict which of two forks the person took.
# `evidence` is the forcing field, exactly as it is on `findings`, and `standing` may not reach
# `confirmed` until a person answers a question about it.
name: perspective/goals
description: An outcome a contributor was working toward, inferred from what they actually pursued — never declared by them. The observed half of `goals`.
use_when: >-
  asked what a contributor was TRYING to do, why a run of decisions hangs together, or what a project was for — read here, then follow the refs to the evidence. The infer pass writes them from decisions, activities and project arcs; search here before re-deriving a purpose from the same records. Never write one from what the person SAID about themselves — that is an answered question, and it belongs on the question
storage: {path: data/perspective/goals, format: md}
ids:
  from: "{{ contributor }}/{{ name | slug }}"
  pattern: "^[a-z0-9-]+/[a-z0-9-]+$"
mixins:
  - perspective-observation
fields:
  retrospective: {type: perspective/retrospective-sessions, required: true, description: The retrospective session that FIRST wrote this record.}
  last_seen_in: {type: perspective/retrospective-sessions, description: 'The most recent session that confirmed or updated it. Absent means exactly one session has ever touched it, which is how "new since last time" is answered without a diff.'}
  contributor: {type: string, required: true, pattern: '^[a-z0-9-]+$', description: 'WHOSE this is, as a slug — and the FIRST SEGMENT OF THE ID. That is what makes a second retrospective UPDATE this record instead of writing one beside it. A plain slug rather than a reference, because an id segment cannot be one; the person''s own observed-world record is perspective/users/<contributor>/<their-name-slug>.'}
  name: {type: string, required: true, description: 'The outcome in one line, as an OUTCOME and not a task — "the workspace runs on any machine", never "port the scripts".'}
  # ── WHOSE ────────────────────────────────────────────────────────────────────────────────────
  # THE ORG AXIS IS ONE ID SEGMENT, NOT A SECOND COPY OF THE MODEL. The person is the FIRST SEGMENT
  # OF THE ID, so several contributors share one model and "who else worked on this" is one query.
  # `contributor` carries it as a bare slug, because an id segment cannot be a reference; the
  # person's own record is `perspective/users/<contributor>/<their-name-slug>` — one hop, derived,
  # never stored twice. `retrospective` says which RUN produced this, a different question.
  #
  # A record whose contributor cannot be determined is not written: there is no id to write it under.
  # `done_when` — the real collection's own word for the same slot.
  done_when:
    type: string
    required: true
    description: >-
      What would be TRUE if this were met, in one or two sentences. The test the evidence is read against — and the reason a goal that excludes nothing is visible as such, because its test comes out empty of content. REQUIRED, exactly as it is on `goals`: the difference is only who wrote it, a person there and a run here.
  real:
    type: goals
    soft: true
    description: >-
      The `goals` record this observed outcome appears to BE — the one-way, soft join to the goal a person declared. A PROPOSAL, set only on a confirmed match, and the most valuable one in the module: an inferred goal that lines up with a declared one is corroboration, and one that does NOT is the most interesting thing a retrospective can find. The argument for one-way and for soft is written out once, on `perspective/users.real`.
  # ── how it was arrived at ────────────────────────────────────────────────────────────────────
  from_candidate:
    type: string
    description: >-
      The `key` of the goal candidate this goal was named from — the project slug, or `(unassigned)`. THIS IS HOW EVIDENCE IS ATTACHED, and it exists for the reason `activities.from_candidate` does: the model NAMES the arc and bounds it, and `bin/infer-goals.mjs --attach` copies the activity, decision, project and topic refs onto the record. A naming pass asked to copy refs by hand drops them silently.
  inferred_from:
    type: string
    many: true
    enum:
      - decisions
      - activities
      - project-arc
      - commit-messages
      - tickets
      - findings
      - paste-back
      - threads
    description: WHICH EVIDENCE SHAPED IT. Several is normal; a goal read out of one kind of record is usually a restatement of that record.
  # `status` — the real collection's word for the same slot. The VALUES differ: `met` is a person's
  # verdict against a test they wrote, `reached` is what the evidence shows. Same field, same question, different
  # authority — and spelling the field alike is what makes the difference in the values visible.
  status:
    type: string
    default: unclear
    enum: [reached, in-flight, stalled, abandoned, unclear]
    description: >-
      OBSERVED, from whether the work serving it continued and what it produced. `reached` needs evidence that the outcome HELD, not that the work stopped — those are the same silence, and `stalled` is the honest answer when you cannot tell them apart.
  # ── what serves it ───────────────────────────────────────────────────────────────────────────
  # One direction only, on purpose: a goal names the work that served it, and no project, activity
  # or decision carries a back-reference. A project serves several goals and a goal is re-read on
  # every run, so a back-ref would be the field that silently goes stale.
  projects:
    type: perspective/projects
    many: true
  activities:
    type: perspective/activities
    many: true
  decisions:
    type: perspective/decisions
    many: true
    description: The decisions this goal explains. THE STRONGEST EVIDENCE THERE IS — a goal that predicts which fork was taken is a real one.
  findings:
    type: perspective/findings
    many: true
  topics:
    type: perspective/topics
    many: true
  # ── the forcing fields, borrowed wholesale from findings ─────────────────────────────────────
  evidence_count:
    type: integer
    required: true
    description: 'DISTINCT records behind it — decisions, activities and projects, counted once each. THE FORCING FIELD: a goal under three is a hunch about one piece of work.'
  standing:
    type: string
    required: true
    enum: [inferred, corroborated, confirmed, refuted]
    description: >-
      `inferred` under 3 pieces of evidence, `corroborated` at 3 or more. `confirmed` and `refuted` are reserved for a goal the PERSON has answered a question about — an unattended run may not write either, and a run that does is claiming someone spoke who did not.
  needs_confirmation: {type: boolean, default: false, description: Generates a gap question. Set it on any goal the evidence suggests but cannot settle.}
  first_seen: {type: date, description: Earliest evidence date.}
  last_seen: {type: date, description: Latest evidence date — with `horizon`}
  concepts:
    type: perspective/concepts
    many: true
    mirror_of: classifies
  terms:
    type: perspective/terms
    many: true
    mirror_of: mentions
    description: The words this record cannot be read without — generated from `terms.mentions`.
  content:
    type: markdown
    body: true
    description: >-
      The argument. What the goal is, WHICH evidence made it visible and what it excludes — the fork it predicts. A body that only restates the statement is a goal nobody can argue with, which is the same as a goal nobody can use.
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context.
display:
  nav:
    icon: location
    order: 150
  list:
    columns:
      - name
      - status
      - standing
      - evidence_count
      - real
      - first_seen
      - last_seen
