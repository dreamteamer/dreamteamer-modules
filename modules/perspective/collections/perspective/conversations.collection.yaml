# perspective/conversations — ONE CONDENSED CODING-AGENT SESSION, trimmed to what the findings pass
# and a later report read.
#
# THREE TIERS OF FIELD, named in every description:
#   MECHANICAL — counted off the JSONL by lib/metrics.mjs. Never guessed. Always present.
#   HEURISTIC  — regex over turns (the dialogue-act counts). Cheap and knowingly approximate.
#   JUDGED     — written by a model over a bounded digest, never the full text. Absent on depth: minimal.
# When a judged field disagrees with a mechanical one, the mechanical one is right.
# Judged fields are written ONLY through bin/record-judgement.mjs, which rejects any other key.
name: perspective/conversations
description: One condensed coding-agent conversation — what was worked on, how many real user turns, where the person corrected the agent.
use_when: >-
  the findings pass asks what recurs across a person's sessions, a gap question needs its evidence,
  or a report needs turns and corrections over time — read here, never the transcript; written by
  read-claude-transcripts (mechanical) and record-judgement (judged)
storage: {path: data/perspective/conversations, codec: md, shape: file, suffix: conversation}
id:
  generate: "{{ contributor }}/{{ harness }}/{{ started_at | date:YYYY/MM }}/{{ session_id }}"
  pattern: "^[a-z0-9-]+/[a-z-]+/\\d{4}/\\d{2}/[0-9a-zA-Z_-]{8,64}$"
schema:
  type: object
  required: [retrospective, contributor, session_id, harness, title, transcript_path, depth, inspected_at, inspector_version, started_at, turns_user]
  properties:
    retrospective: { type: string, x-reference: perspective/retrospective-sessions, description: The retrospective session that FIRST wrote this record. }
    last_seen_in: { type: string, x-reference: perspective/retrospective-sessions, description: 'The most recent session that confirmed or updated it. Absent means exactly one session has ever touched it, which is how "new since last time" is answered without a diff.' }
    contributor: { type: string, pattern: '^[a-z0-9-]+$', description: 'WHOSE this is, as a slug — and the FIRST SEGMENT OF THE ID. That is what makes a second retrospective UPDATE this record instead of writing one beside it. A plain slug rather than a reference, because an id segment cannot be one; the person''s own observed-world record is perspective/users/<contributor>/<their-name-slug>.' }
    session_id: { type: string, description: MECHANICAL — the transcript's own id (the file basename). }
    harness:
      type: string
      enum: [claude-code, codex, cursor, gemini-cli]
      description: MECHANICAL — which agent wrote the transcript.
    account:
      type: string
      description: 'MECHANICAL — the tree the file was found in: `default` for ~/.claude, `<name>` for ~/.claude-<name>. Nothing inside a transcript records it.'
    title:
      type: string
      description: MECHANICAL — the harness's generated title when present, else the first user line, clipped to 140 chars.
    transcript_path:
      type: string
      description: 'MECHANICAL — where the file is, as a template: `${userHome}/.claude/projects/<dir>/<id>.jsonl`. Never a machine path.'
      examples: ['${userHome}/.claude/projects/-Users-me-work-acme/0f3c…jsonl']
    # A SESSION IS NOT ALWAYS ONE FILE. Continuing a codex thread writes a NEW rollout carrying the
    # same session_id, so one session's evidence can be spread across several files on disk.
    # `transcript_path` points at where the session
    # BEGAN; this says how many files a reader would have to open to see all of it. Absent when the
    # session is one file, which is every Claude session and most codex ones.
    sittings: { type: integer, description: 'MECHANICAL — how many transcript FILES this one session was written across. Absent when it is one.' }
    # MOST "USER" MESSAGES IN A CODEX ROLLOUT ARE NOT THE USER — the desktop app injects its own
    # context as `role: user` messages opening with a tag (`<realtime_delegation>`,
    # `<codex_delegation>`, `<recommended_plugins>`, `<environment_context>`, `<heartbeat>`), often
    # far outnumbering the typed lines, and most sessions open with one. They are excluded
    # from `turns_user` and counted here instead, because a hidden exclusion is how a number quietly
    # stops meaning what its name says.
    harness_envelopes: { type: integer, description: 'MECHANICAL — harness-injected messages wearing the user role, excluded from `turns_user`. Absent when there were none.' }
    # A realtime voice session has no typed user message at all: the human half is the spoken
    # transcript. A contiguous RUN of segments is one turn, since a segment is a fragment of an
    # utterance and counting each would turn a two-minute exchange into forty turns.
    spoken_turns: { type: integer, description: 'MECHANICAL — how many of `turns_user` the person SPOKE rather than typed. Absent when none.' }
    depth:
      type: string
      enum: [minimal, summarized]
      description: MECHANICAL — `minimal` failed the volume gate and has no judged fields; `summarized` was judged.
    gate_reason:
      type: string
      description: MECHANICAL — why the gate refused, when depth is minimal. A statement about VOLUME, never value.
    inspected_at: { type: string, format: date-time, description: MECHANICAL — when the reader last wrote this record. }
    inspector_version: { type: string, description: MECHANICAL — `metrics/N`; bumped when a number's MEANING changes. Re-runs skip records at the current version. }
    source:
      type: string
      x-reference: perspective/sources
      description: The `claude-transcripts` source this was read from.
    repo:
      type: string
      x-reference: repos
      description: MECHANICAL — the registered repo whose path contains the session's cwd, when one does.
    repo_name:
      type: string
      description: 'MECHANICAL — `owner/name` from the cwd''s git remote, else the folder name. Where the session RAN.'
    subject_repos:
      type: array
      items: { type: string }
      description: JUDGED — what the session was ABOUT, which is routinely not where it ran. Repo names as text.
    started_at: { type: string, format: date-time, description: MECHANICAL — first timestamp. }
    ended_at: { type: string, format: date-time, description: MECHANICAL — last timestamp. }
    active_minutes: { type: number, description: MECHANICAL — sum of inter-message gaps under ten minutes. The honest engagement number. }
    turns_user:
      type: integer
      description: >-
        MECHANICAL — real user turns ONLY. Tool results, system reminders, hook output, IDE notices,
        task notifications and compaction replay are all excluded. THE FORCING FIELD and the north star.
    turns_assistant: { type: integer, description: MECHANICAL — assistant turns folded on message.id (one turn spans several JSONL lines). }
    tool_calls: { type: integer, description: MECHANICAL. }
    tool_errors: { type: integer, description: MECHANICAL — tool results flagged is_error. }
    files_edited: { type: integer, description: MECHANICAL — distinct paths passed to Edit/Write/NotebookEdit. }
    skills_loaded: { type: array, items: { type: string }, description: MECHANICAL — skill and slash-command names invoked through tools. }
    commands_invoked: { type: array, items: { type: string }, description: MECHANICAL — slash commands the person typed. }
    tokens_input: { type: integer, description: MECHANICAL — summed once per message.id. }
    tokens_output: { type: integer, description: MECHANICAL — summed once per message.id. }
    tokens_cache_read:
      type: integer
      description: "MECHANICAL — `cache_read_input_tokens`, summed once per message.id. On a long agentic session this is nearly the ENTIRE input bill: the uncached remainder is routinely orders of magnitude smaller than the output, because every turn re-reads a cached prompt. Reading `tokens_input` as what a session cost under-reports by two orders of magnitude."
    tokens_cache_write:
      type: integer
      description: MECHANICAL — `cache_creation_input_tokens`, summed once per message.id. What it cost to put the context into the cache the reads above then hit.
    tokens_total:
      type: integer
      description: "MECHANICAL — input + output + cache read + cache write. THE number to quote when someone asks what a session burned; the other four are the breakdown."
    user_directive: { type: integer, description: HEURISTIC dialogue act — the person asked for work. The default class. }
    user_correction: { type: integer, description: HEURISTIC dialogue act — the person said the agent got it wrong. The expensive class. }
    user_rejection: { type: integer, description: HEURISTIC dialogue act — stop / no / revert. }
    user_approval: { type: integer, description: HEURISTIC dialogue act — yes / go ahead / lgtm. }
    user_question: { type: integer, description: HEURISTIC dialogue act — the person asked something. }
    user_context: { type: integer, description: HEURISTIC dialogue act — a long paste handing over material. }
    agent_plan: { type: integer, description: HEURISTIC dialogue act — the agent laid out a plan. }
    agent_question: { type: integer, description: HEURISTIC dialogue act — the agent asked the person. }
    agent_refusal: { type: integer, description: HEURISTIC dialogue act — the agent declined. }
    permission_denials: { type: integer, description: MECHANICAL — tool results saying the person refused an action. }
    interruptions:
      type: integer
      description: "MECHANICAL — times the person hit the stop key mid-flight (`[Request interrupted by user`). Read this BEFORE `permission_denials`: interruptions are typically more frequent than denials, which makes this — not the permission prompt — the real stop button. An interruption still counts as a turn in `turns_user`, because the person did speak; it is simply the cheapest thing they can say."
    divergences: { type: integer, description: JUDGED — times the agent went somewhere the person had not asked. }
    plan_changes: { type: integer, description: JUDGED — times the stated plan changed mid-session. }
    summary: { type: string, description: JUDGED — one paragraph, what was attempted and what came of it. }
    goals: { type: array, items: { type: string }, description: JUDGED — what the PERSON was trying to achieve, in their terms. }
    key_topics: { type: array, items: { type: string }, description: JUDGED. }
    outcome:
      type: string
      enum: [completed, partial, abandoned, exploratory, failed, unknown]
      description: JUDGED.
    knowledge_kinds:
      type: array
      items: { type: string }
      description: 'JUDGED — which of knowhow · facts · person-bias · decisions · experience · technique · pitfall are actually present. Open, not an enum.'
    interest_score: { type: integer, minimum: 0, maximum: 100, description: JUDGED — extractable value that exists nowhere else, per references/interest-score.md. Never derived from volume. }
    interest_reason: { type: string, description: JUDGED — one line naming the specific thing. }
    dated_from_mtime:
      type: boolean
      description: "MECHANICAL — true when the transcript carried no timestamp on any line and started_at fell back to the file's mtime. A file of pure /compact checkpoints, with no conversation in it, is the case. Absent means the dates came from the transcript."
    turns_added_information:
      type: integer
      minimum: 0
      description: "JUDGED — layer 2 of the four-layer structure: turns where the person ADDED information the agent did not have. The converging kind — `okay more, and okay more`. Counted per turn from the digest, never inferred from the heuristic act counts, which is what `user_directive` already is."
    turns_corrected:
      type: integer
      minimum: 0
      description: "JUDGED — layer 2's other half: turns where the person CORRECTED the agent or overrode its steering — `not like that, not like that`. The expensive kind, and the signal that a skill is missing, mis-tuned, or that the work arrived broken from an earlier stage. Read against `turns_added_information`, never alone: the RATIO is the metric."
    skill_tokens_active:
      type: integer
      description: "MECHANICAL where the transcript allows, else JUDGED — tokens spent by skills that were ACTIVELY USED, not merely loaded. The hypothesis: you start with no skills, you write skills, and you repeat yourself less and less as recurring knowledge distils into them, so this should RISE while turns fall."
    input_words:
      type: integer
      description: "MECHANICAL — words the HUMAN had to type: the denominator. Everything normalises to words (skill `references/metrics.md`) — a PRD is words, code is obviously words — so productivity is output words over input words."
    output_words:
      type: integer
      description: "MECHANICAL — words of deliverable the session produced: the numerator of the productivity ratio. Guard, named in the same breath as the ratio: words can be gibberish, so this number means nothing without `correction_ratio` beside it."
    oneshot_prompt_words:
      type: integer
      description: "JUDGED — LAYER 3: given the artifact this session produced, how SHORT a prompt would reproduce it blind, in one shot. It normalises the skill and all the turns, folding skills, turns and harness into one number that answers what the artifact would have cost under lab conditions. Absent unless someone actually ran the one-shot reproduction; it is a measurement, not an estimate, and most runs leave it empty."
    deliverable_kind:
      type: string
      description: "The kind of thing this session produced — prd · code · design-doc · analysis · report · spec · none. LAYER 4 needs it because quality scoring is CONTEXTUAL: a scoring skill that has seen many PRDs knows a good one, and knows nothing about a good migration script. Free text on purpose; the vocabulary is discovered before it is closed."
    quality_score:
      type: integer
      minimum: 0
      maximum: 100
      description: "JUDGED, 0-100 — LAYER 4, contextual quality of the deliverable, scored per `deliverable_kind` by a skill calibrated to the reader's taste. This layer is irreducibly subjective: quality can get close to objective, never reach it. Never averaged with the other layers into one score — the layers sit on a subjectivity gradient and mixing them destroys the gradient."
    skills_used:
      type: array
      items:
        type: string
      description: MECHANICAL — the skills whose content was actually exercised, a subset of `skills_loaded`. Loading a skill costs tokens and proves nothing; using one is the measurement, and the skills hypothesis is stated on `skill_tokens_active`.
    mcp_servers:
      type: array
      items:
        type: string
      description: MECHANICAL — the MCP servers whose tools were called. Plotted over time beside `tools_used`.
    tools_used:
      type: array
      items:
        type: string
      description: MECHANICAL — distinct tool names called, so the tool mix can be plotted over time beside the MCP servers.
    correction_ratio:
      type: number
      description: "MECHANICAL where derivable — corrected words over produced words: the guard on the words ratio, because words can be gibberish. THE DIRECTION IS THE POINT — you want this to FALL over time; a rising number means the output is getting cheaper to produce and worse."
    content:
      type: string
      format: markdown
      x-body: true
      description: >-
        JUDGED — the write-up, in a fixed shape so it can be read, quoted and exported without a
        redaction pass. Empty on depth minimal. Two required sections, in this order:

        `# <title>` — the same string as the `title` field, so the body stands alone when the
        frontmatter is stripped.

        `## recap (no PII)` — three to six sentences on what the conversation was about and what
        came of it, carrying NO personally identifying information: no person's name, no company or
        client, no repo or branch name, no path, no URL, no ticket key, no figure that identifies an
        account. Write "the client", "the person", "a service", "a repo". This is the paragraph
        that may be shown outside the org, put in a report, or pasted into a deck.

        Anything identifying — who was on the call, which client, which repo, which number — goes
        under a third `## detail` section or in `summary`, and is NEVER safe to export.
        `bin/check-records.mjs` fails a summarized conversation whose body lacks either required
        heading.
    author:
      type: string
      pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
      examples: ['agents/claude-code', 'scripts/read-git@2']
      description: >-
        Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a
        reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
    creation_context:
      type: string
      description: How and why this record came to be, in one line — and the reason whenever confidence is low.
    confidence:
      type: string
      enum: [low, normal, high]
      default: normal
      description: How much to trust this record. When low, the reason goes in creation_context.
list_fields: [title, started_at, turns_user, user_correction, depth, interest_score]
icon: comment-discussion
order: 30   # nav position — the evidence it condensed; the pipeline order, ten apart so one can be inserted without renumbering
sensitive: true
