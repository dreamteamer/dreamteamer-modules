# perspective/users — A PERSON WHO APPEARS IN THE EVIDENCE. Not contacts (whom the person deals with)
# and not `users` (whom work is assigned to): this is who shows up in THIS contributor's commits,
# tickets and sessions. Identity is the hard part and the data proves it: one person commits under
# four handles across two machines and a GitHub noreply address. `handles` is the merge key; both
# `contact` and `real` are PROPOSALS a person confirms.
#
# THE OBSERVED HALF OF `users`, IN THE SAME SHAPE AND IN A SEPARATE STORE. It is not an `extends:`
# overlay, and the reason is the module's own loudest rule: nothing here is authored truth. Merged
# into `users`, a record a run FOUND would be indistinguishable from one a person WROTE, and the two
# cannot even share an id shape — the real world keys on the name slug, the observed world on
# `<contributor>/<name-slug>`, because that first segment is what makes a second retrospective UPDATE
# a person's model instead of copying it. `real` is the one-way, soft join between them.
name: perspective/users
# The face, then the name — everywhere. A `record_title` is what a relation CELL, a group header,
# a tooltip and a card all render for this record, so one line here puts a person's picture on every
# surface that mentions them. `{{ avatar }}` holds `assets/avatars/<slug>`, which `DisplayTemplate`
# draws as a thumbnail rather than spelling out; a collaborator with no matched
# avatar renders the name alone, because an empty token renders to nothing.
record_title: "{{ avatar }} {{ name }}"
description: A person observed in a contributor's evidence — commits, tickets, sessions — with every handle they appear under. The observed half of `users`, keyed by the contributor whose evidence found them.
use_when: >-
  a reader meets an author or assignee (find the record whose handles carry it, else create one); an activity, decision or workflow names who was involved; asked who a contributor works with — list here by evidence_count. Never merge two records without a person confirming the match, and never write one into `users` — set `real` instead and let a person promote it
storage: {path: data/perspective/users, format: md}
ids:
  from: "{{ contributor }}/{{ name | slug }}"
  pattern: "^[a-z0-9-]+/[a-z0-9-]+$"
mixins:
  - perspective-observation
fields:
  retrospective: {type: perspective/retrospective-sessions, required: true, description: The retrospective session that FIRST wrote this record.}
  last_seen_in: {type: perspective/retrospective-sessions, description: 'The most recent session that confirmed or updated it. Absent means exactly one session has ever touched it, which is how "new since last time" is answered without a diff.'}
  contributor: {type: string, required: true, pattern: '^[a-z0-9-]+$', description: 'WHOSE this is, as a slug — and the FIRST SEGMENT OF THE ID. That is what makes a second retrospective UPDATE this record instead of writing one beside it. A plain slug rather than a reference, because an id segment cannot be one; the person''s own observed-world record is perspective/users/<contributor>/<their-name-slug>.'}
  name: {type: string, required: true, description: The display name}
  handles: {type: string, required: true, many: true, description: 'THE MERGE KEY. Every identity this person appears under: git author emails, Asana gids, display-name variants. A reader adds to it; a person may merge two records by moving handles.'}
  # ── THE SHAPE `users` HAS ──────────────────────────────────────────────────────────────────────
  # Two fields the real collection carries that a reader can honestly fill from evidence. NOT
  # `role` and NOT `status`: `roles_observed` below is the observed spelling of the first (a list,
  # from behaviour, never a title), and nothing in evidence says whether a person is still active
  # anywhere but in THIS contributor's window — an absence here is about the window, not the person.
  email:
    type: string
    description: >-
      Their working address — the one handle that is an address, promoted so it can be read without scanning `handles`. Never invented: absent when the evidence carries only a gid or a display name.
  company:
    type: companies
    soft: true
    description: >-
      Which organisation the evidence shows them at — a commit domain, a ticket workspace. A PEER reference and SOFT (see `real`): a workspace with no CRM leaves it empty and nothing dangles.
  contact:
    type: contacts
    description: >-
      This person's record in the workspace's own CRM, where one exists and a person confirmed the match. `contacts` is a declared PEER, so the module compiles where no contacts collection exists without giving up the type. No `mirror_of`: a peer excuses a reference, not a mirror.
  # ── OUT INTO THE REAL WORLD ────────────────────────────────────────────────────────────────────
  # THE CANONICAL `real`, spelled identically on all four world collections so a guard, a view and a
  # reader have ONE field name to find. The other three point back here for the argument.
  #
  # ONE-WAY. There is no `mirror_of` and there must never be one: the real world is what a person
  # AUTHORED, and stamping `observed_as[]` onto their `users` record would be a finding writing into
  # somebody else's schema — the same rule that keeps `contact` above one-way.
  #
  # SOFT, and the word covers TWO different absences the engine already handles with TWO existing
  # mechanisms. Neither is new here and no new keyword was invented for this.
  #   1. THE COLLECTION IS NOT INSTALLED — the normal state, because a workspace running a
  #      retrospective need not own a plan at all. `users` is declared in
  #      `dreamteamer.peerDependencies`; compile stamps `unresolved_peers` onto this descriptor and
  #      `check` reports `peer collection "users" is declared but not installed — N references
  #      unresolvable` rather than failing.
  #   2. THE RECORD IS GONE — `soft: true` (src/ref.js: "resolve it if the target is
  #      present, ignore it if it is absent"), the same keyword the engine's own
  #      `modules.peer_dependencies` carries, for the same reason: the value is a DECLARATION rather
  #      than a link this module maintains. A correspondence is a judgement a run made on a date; if
  #      the real record is later deleted, that judgement is still a true statement about the run,
  #      and turning a whole workspace's `check` red over it would let a finding dictate to the real
  #      world. `bin/check-records.mjs` reports the dangle as a WARNING instead — visible, never
  #      blocking.
  real:
    type: users
    soft: true
    description: >-
      The `users` record this observed person appears to BE — the one-way, soft join between the world a run reconstructed and the world a person authored. A PROPOSAL, set only where a person confirmed the match, exactly as `contact` is, and never off a name that merely agrees. Empty is the normal state, and it is what a workspace with no `users` collection always reads.
  # A FACE, so a board of thirty collaborators is scannable. Same plain-string reasoning as
  # `contact` above and for the same reason: a recipe must compile in a workspace with no `assets`
  # collection at all, and a typed reference at one that may not exist is a compile failure rather
  # than a missing picture. `bin/link-collaborator-avatars.mjs` sets it, matching on an EXACT slug
  # of the name or of any handle — never a fuzzy match, because a wrong face on a real person is
  # the most visible error this module can make.
  avatar: {type: string, description: 'An asset reference — `assets/avatars/<slug>` — for the person''s picture. A plain string, not a typed reference: this module must compile where no `assets` collection exists.'}
  first_seen: {type: date}
  last_seen: {type: date}
  evidence_count: {type: integer, description: Distinct commits}
  roles_observed: {type: string, many: true, description: 'From behaviour, never self-report: reviewer · author · assignee · reporter · attendee.'}
  sources:
    type: perspective/sources
    many: true
  led_activities:
    type: perspective/activities
    many: true
    mirror_of: lead
  activities:
    type: perspective/activities
    many: true
    mirror_of: collaborators
  concepts:
    type: perspective/concepts
    many: true
    mirror_of: classifies
  decided:
    type: perspective/decisions
    many: true
    mirror_of: decider
    description: The calls the evidence shows this person making — generated from `perspective/decisions.decider`.
  decisions:
    type: perspective/decisions
    many: true
    mirror_of: collaborators
  led_projects:
    type: perspective/projects
    many: true
    mirror_of: lead
  projects:
    type: perspective/projects
    many: true
    mirror_of: collaborators
  terms:
    type: perspective/terms
    many: true
    mirror_of: mentions
    description: The words this record cannot be read without — generated from `terms.mentions`.
  tickets:
    type: perspective/tickets
    many: true
    mirror_of: assignee
  workflows:
    type: perspective/workflows
    many: true
    mirror_of: collaborators
  content: {type: markdown, body: true}
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context.
display:
  nav:
    icon: person-voice
    order: 110
  list:
    columns:
      - name
      - evidence_count
      - first_seen
      - last_seen
      - contact
      - real
