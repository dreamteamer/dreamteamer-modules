# perspective/users — A PERSON WHO APPEARS IN THE EVIDENCE. Not contacts (whom the operator deals with)
# and not `users` (whom work is assigned to): this is who shows up in THIS contributor's commits,
# tickets and sessions. Identity is the hard part and the data proves it: one person commits under
# four handles across two machines and a GitHub noreply address. `handles` is the merge key; both
# `contact` and `real` are PROPOSALS a person confirms.
#
# ⚠ THE OBSERVED HALF OF `users`, IN THE SAME SHAPE AND IN A SEPARATE STORE. It is not an `extends:`
# overlay, and the reason is the module's own loudest rule: nothing here is authored truth. Merged
# into `users`, a record a run FOUND would be indistinguishable from one a person WROTE, and the two
# cannot even share an id shape — the real world keys on the name slug, the observed world on
# `<contributor>/<name-slug>`, because that first segment is what makes a second retrospective UPDATE
# a person's model instead of copying it. `real` is the one-way, soft join between them.
name: perspective/users
templates: [collection-templates/perspective-observation]
description: A person observed in a contributor's evidence — commits, tickets, sessions — with every handle they appear under. The observed half of `users`, keyed by the contributor whose evidence found them.
use_when: >-
  a reader meets an author or assignee (find the record whose handles carry it, else create one); an
  activity, decision or workflow names who was involved; asked who a contributor works with — list here
  by evidence_count. Never merge two records without a person confirming the match, and never write one
  into `users` — set `real` instead and let a person promote it
storage: { path: data/perspective/users, codec: md, shape: file, suffix: user }
id:
  generate: "{{ contributor }}/{{ name | slug }}"
  pattern: "^[a-z0-9-]+/[a-z0-9-]+$"
schema:
  type: object
  required: [retrospective, contributor, name, handles]
  properties:
    retrospective: { type: string, x-reference: perspective/retrospective-sessions, description: The retrospective session that FIRST wrote this record. }
    last_seen_in: { type: string, x-reference: perspective/retrospective-sessions, description: 'The most recent session that confirmed or updated it. Absent means exactly one session has ever touched it, which is how "new since last time" is answered without a diff.' }
    contributor: { type: string, pattern: '^[a-z0-9-]+$', description: 'WHOSE this is, as a slug — and the FIRST SEGMENT OF THE ID. That is what makes a second retrospective UPDATE this record instead of writing one beside it. A plain slug rather than a reference, because an id segment cannot be one; the person''s own observed-world record is perspective/users/<contributor>/<their-name-slug>.' }
    name: { type: string, description: The display name, as best the evidence gives it. }
    handles: { type: array, items: { type: string }, description: 'THE MERGE KEY. Every identity this person appears under: git author emails, Asana gids, display-name variants. A reader adds to it; a person may merge two records by moving handles.' }
    # ── THE SHAPE `users` HAS ──────────────────────────────────────────────────────────────────────
    # Two fields the real collection carries that a reader can honestly fill from evidence. NOT
    # `role` and NOT `status`: `roles_observed` below is the observed spelling of the first (a list,
    # from behaviour, never a title), and nothing in evidence says whether a person is still active
    # anywhere but in THIS contributor's window — an absence here is about the window, not the person.
    email:
      type: string
      description: >-
        Their working address — the one handle that is an address, promoted so it can be read without
        scanning `handles`. Never invented: absent when the evidence carries only a gid or a display name.
    company:
      type: string
      x-reference: companies
      x-reference-soft: true
      description: >-
        Which organisation the evidence shows them at — a commit domain, a ticket workspace. A PEER
        reference and SOFT (see `real`): a workspace with no CRM leaves it empty and nothing dangles.
    contact:
      type: string
      x-reference: contacts
      description: >-
        This person's record in the workspace's own CRM, where one exists and a person confirmed the
        match. ⚠ It was a PLAIN STRING until 2026-09-09, with the comment "a recipe must compile where
        no contacts collection exists" — true, and solved by declaring `contacts` a PEER rather than by
        giving up the type. No `x-inverse`: a peer excuses a reference, not a mirror.
    # ── OUT INTO THE REAL WORLD ────────────────────────────────────────────────────────────────────
    # THE CANONICAL `real`, spelled identically on all four world collections so a guard, a view and a
    # reader have ONE field name to find. The other three point back here for the argument.
    #
    # ⚠ ONE-WAY. There is no `x-inverse` and there must never be one: the real world is what a person
    # AUTHORED, and stamping `observed_as[]` onto their `users` record would be a finding writing into
    # somebody else's schema — the same rule that keeps `contact` above one-way.
    #
    # ⚠ SOFT, and the word covers TWO different absences the engine already handles with TWO existing
    # mechanisms. Neither is new here and no new keyword was invented for this.
    #   1. THE COLLECTION IS NOT INSTALLED — the normal state, because a workspace running a
    #      retrospective need not own a plan at all. `users` is declared in
    #      `dreamteamer.peerDependencies`; compile stamps `unresolved_peers` onto this descriptor and
    #      `check` reports `⚠ peer collection "users" is declared but not installed — N references
    #      unresolvable` rather than failing.
    #   2. THE RECORD IS GONE — `x-reference-soft: true` (src/ref.js: "resolve it if the target is
    #      present, ignore it if it is absent"), the same keyword the engine's own
    #      `modules.peer_dependencies` carries, for the same reason: the value is a DECLARATION rather
    #      than a link this module maintains. A correspondence is a judgement a run made on a date; if
    #      the real record is later deleted, that judgement is still a true statement about the run,
    #      and turning a whole workspace's `check` red over it would let a finding dictate to the real
    #      world. `bin/check-records.mjs` reports the dangle as a WARNING instead — visible, never
    #      blocking.
    real:
      type: string
      x-reference: users
      x-reference-soft: true
      description: >-
        The `users` record this observed person appears to BE — the one-way, soft join between the
        world a run reconstructed and the world a person authored. A PROPOSAL, set only where a person
        confirmed the match, exactly as `contact` is, and never off a name that merely agrees. Empty is
        the normal state, and it is what a workspace with no `users` collection always reads.
    # A FACE, so a board of thirty collaborators is scannable. Same plain-string reasoning as
    # `contact` above and for the same reason: a recipe must compile in a workspace with no `assets`
    # collection at all, and an x-reference at one that may not exist is a compile failure rather
    # than a missing picture. `bin/link-collaborator-avatars.mjs` sets it, matching on an EXACT slug
    # of the name or of any handle — never a fuzzy match, because a wrong face on a real person is
    # the most visible error this module can make.
    avatar: { type: string, description: 'An asset reference — `assets/avatars/<slug>` — for the person''s picture. A plain string, not an x-reference: this module must compile where no `assets` collection exists.' }
    first_seen: { type: string, format: date }
    last_seen: { type: string, format: date }
    evidence_count: { type: integer, description: Distinct commits, tickets and sessions this person appears in. }
    roles_observed: { type: array, items: { type: string }, description: 'From behaviour, never self-report: reviewer · author · assignee · reporter · attendee.' }
    sources:
      type: array
      items: { type: string, x-reference: perspective/sources }
      # The mirror keeps the word `collaborators` on purpose: the collection is `perspective/users` because
      # that is the noun the real world uses, but what a SOURCE holds is the people observed in it,
      # and `sources.users` would read as the source's own accounts.
      x-inverse: collaborators
    content: { type: string, format: markdown, x-body: true }
    # ---- provenance: who made this record, from what, and how much to trust it. Inlined from the
    # perspective-provenance template on 2026-10-01; one shared template per module was a copy of the same quad twelve times.
    author:
      type: string
      description: >-
        Which AGENT or SCRIPT made this record — `agents/dreamteamer (claude-fable-5)` or
        `scripts/read-claude-transcripts@metrics/1`. Absent when the person wrote it themselves.
    creation_context:
      type: string
      description: How and why this record came to be, in one line — and the reason whenever confidence is low.
    source:
      type: string
      description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…>.'
    confidence:
      type: string
      enum: [low, normal, high]
      default: normal
      description: How much to trust this record. When low, the reason goes in creation_context.
list_fields: [name, evidence_count, first_seen, last_seen, contact, real]
icon: person-voice   # frees `organization` for `teams`; an observed person is the one the evidence quotes
order: 110   # nav position — the model it reconstructed; the pipeline order, ten apart so one can be inserted without renumbering
# The face, then the name — everywhere. A `title_template` is what a relation CELL, a group header,
# a tooltip and a card all render for this record, so one line here puts a person's picture on every
# surface that mentions them. `{{ avatar }}` holds `assets/avatars/<slug>`, which `DisplayTemplate`
# draws as a thumbnail rather than spelling out (extension 0.14.5); a collaborator with no matched
# avatar renders the name alone, because an empty token renders to nothing.
title_template: '{{ avatar }} {{ name }}'
