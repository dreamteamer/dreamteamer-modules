# tickets — ONE EXTERNAL TASK, mechanical. Asana today, Jira when a Jira user walks. Tickets become
# records because they live outside git; commits do not, because git already holds them.
name: perspective/tickets
description: One task from a ticketing system — Asana or Jira — as the reader found it. Counted, never judged.
use_when: >-
  the asana or jira reader runs (it writes here), or an activity or finding needs a ticket as evidence — cite the record, never the URL; asked what a contributor was assigned in a period, filter here by assignee_handle and created_on
storage: {path: data/perspective/tickets, format: md}
ids:
  from: "{{ contributor }}/{{ source | basename }}/{{ external_id }}"
  pattern: "^[a-z0-9-]+/[a-z-]+--[a-z0-9-]+/[A-Za-z0-9_-]+$"
fields:
  retrospective: {type: perspective/retrospective-sessions, required: true, description: The retrospective session that FIRST wrote this record.}
  last_seen_in: {type: perspective/retrospective-sessions, description: 'The most recent session that confirmed or updated it. Absent means exactly one session has ever touched it, which is how "new since last time" is answered without a diff.'}
  contributor: {type: string, required: true, pattern: '^[a-z0-9-]+$', description: 'WHOSE this is, as a slug — and the FIRST SEGMENT OF THE ID. That is what makes a second retrospective UPDATE this record instead of writing one beside it. A plain slug rather than a reference, because an id segment cannot be one; the person''s own observed-world record is perspective/users/<contributor>/<their-name-slug>.'}
  source: {type: perspective/sources, required: true, description: The asana/jira source this was read from.}
  external_id: {type: string, required: true, description: 'The system''s own id — an Asana gid, a Jira key. THE FORCING FIELD; the id is built from it.'}
  title: {type: string, required: true}
  project: {type: string, description: The project or board name}
  section: {type: string, description: The column or section it sat in when read.}
  assignee_handle: {type: string, description: 'The assignee''s handle as the system reports it — an Asana gid or email. Joined to perspective/users.handles, never to a name.'}
  assignee:
    type: perspective/users
    description: The collaborator record, once the handle is matched.
  created_on: {type: date}
  completed_on: {type: date}
  due_on: {type: date}
  status: {type: string, default: open, enum: [open, completed]}
  tags: {type: string, many: true, description: The system's own tags}
  url: {type: string}
  parent_external_id: {type: string, description: For a subtask — its parent's external id.}
  # ── WHAT THE TASK ACTUALLY HOLDS ───────────────────────────────────────────────────────────
  # Many tasks have an EMPTY description — people do not write them. What those same tasks DO carry is a story trail (3–7 events each: assigned, moved between sections,
  # completed) and sometimes a comment, and that is where the reasoning actually lives. A ticket
  # whose body is only its description is a ticket that says nothing about how the work went.
  last_activity_on: {type: date, description: "Asana `modified_at`. Read this, not `created_on`, when asking whether a ticket is live: a two-year-old open ticket nobody has touched is not current work."}
  comment_count: {type: integer, description: Human comments on the task. The count is here so a ticket with discussion can be found without reading every body.}
  story_count: {type: integer, description: "Every event on the task, comments included — assignments, section moves, completions. A high count on a short task is churn."}
  subtask_count: {type: integer}
  followers: {type: string, many: true, description: Everyone watching the task}
  custom_fields: {type: map, description: "The board's own fields by display value — story points, priority, sprint, whatever this team keeps. Free-shaped on purpose: every board has different ones, and closing the vocabulary here would mean re-editing the descriptor per client."}
  activities:
    type: perspective/activities
    many: true
    mirror_of: tickets
  content:
    type: markdown
    body: true
    description: >-
      The ticket as a person would read it: the description first (or a line saying there is none — never a blank), then `## comments` with each comment attributed and dated, then `## trail`, the system events in order. The trail is what makes a ticket useful to a workflow pass: it is the only place that says the task went to Failed QA twice before it closed.
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context.
display:
  nav:
    icon: issues
    order: 50
  list:
    columns:
      - title
      - project
      - assignee_handle
      - status
      - created_on
      - last_activity_on
      - comment_count
  form:
    sections:
      - title: Provenance
        fields: [author, creation_context, confidence]
        collapsed: true
