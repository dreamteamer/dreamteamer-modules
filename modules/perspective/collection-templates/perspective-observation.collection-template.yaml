# perspective-observation: WHEN THIS WAS SEEN, WHAT ELSE WAS TRUE AT THE TIME, WHAT WOULD PROVE IT
# WRONG, AND WHAT IT TOUCHES. The four fields every MODEL-tier record in this module carries.
#
# WHY IT IS SEPARATE FROM THE PROVENANCE FIELDS every record carries (author · creation_context ·
# source · confidence), which say who wrote the RECORD and how much to trust it. This one is about
# the OBSERVING: a model record is a claim a run made about a person's world at a moment, and the
# moment, the surrounding circumstance, the falsifier and the blast radius are four different facts,
# too many for one free-text `creation_context` line — and `observed` is what lets the whole tier
# sort on when it was seen.
#
# NAMED `perspective-observation` because compile treats a collection-template id as an IDENTITY
# entity, so two modules shipping the same unscoped id is a hard collision rather than a merge.
# Module-scoped ids are the price of a module that can be installed beside any other.
#
# IT GOES ON THE MODEL TIER ONLY — `users`, `projects`, `activities`, `goals`, `decisions`,
# `deliverables`, `concepts`, `terms`, `topics`, `findings`, `insights` and `workflows`. NOT on the
# EVIDENCE tier (`conversations`, `activity-weeks`, `tickets`, `threads`, `sources`): those are counted and
# never judged, they carry the source's own dates already, and a `wrong_if` on a row somebody else's
# system emitted would be this module inventing a claim to falsify. NOT on `assumptions` either —
# that collection IS this idea made first-class, with its own REQUIRED `wrong_if` and its own
# `affects`; stamping a second one on would give it two.
#
# ── HOW TO FILL IT, AND WHEN ──────────────────────────────────────────────────────────────────────
# ON CREATE, all four, in this order — and `observed` is not optional in practice even though the
# schema cannot require a template field:
#   1. `observed` — the instant the evidence puts this at, NOT the instant you wrote the record. For
#      a record read out of a dated artefact, that artefact's date. For one concluded across a span,
#      the LAST evidence in the span, so a timeline reads as "known by then".
#   2. `context` — what else was true when it was seen, in one line. The circumstance a later reader
#      needs to judge the claim: the period being read, the sources that were reachable, the thing
#      that had just happened. Not a restatement of the record.
#   3. `wrong_if` — one observation IN THIS WORLD that would show the claim is wrong.
#   4. `related` — what this observation touches that is not already a typed field on the record.
# ON UPDATE, when a later run confirms or changes the record: move `observed` forward to the NEW
# evidence's instant, append to `context` rather than overwrite it, and re-read `wrong_if` — a
# falsifier that has silently become true is the single most valuable thing in the namespace and
# nothing else in the module will notice it for you.
name: perspective-observation
description: observed / context / wrong_if / related — when a model record was seen, what surrounded it, what would refute it, and what it touches
template:
  schema:
    type: object
    properties:
      observed:
        type: string
        format: date-time
        description: >-
          WHEN THIS WAS OBSERVED — the instant the EVIDENCE puts it at, with its local offset, never the
          instant the record was written (that is `created`, which the engine keeps). A DATE-TIME rather
          than a date so the whole model tier sorts on one axis: several observations land in a day and the
          order they landed in is usually the argument. For a record concluded over a span, the LAST
          evidence in it — a timeline then reads as "this was known by then", which is the only reading that
          is true. Absent means nobody dated the observation, and the record drops out of every timeline
          silently; fill it on create.
      context:
        type: string
        description: >-
          WHAT ELSE WAS TRUE WHEN IT WAS SEEN, in one line — the circumstance a later reader needs before
          the claim can be judged: which period was being read, which sources were reachable, what had just
          happened. NOT a restatement of the record and not the reason it was written (`creation_context`
          holds that). The test: could somebody re-reading this in six months tell whether the observation
          still holds? If not, the missing sentence goes here.
      wrong_if:
        type: string
        description: >-
          ONE LINE: the observation, IN THIS WORLD, that would show this record is wrong — an event somebody
          could actually notice. "the person says they never worked on that", "a repo turns up with the
          commits this period is missing". NOT a counterfactual: the run that just concluded X is the
          worst available narrator of the world where it concluded Y, and the road not taken leaves no trace
          to contradict the story. A prediction about this world is checkable. AND RE-READ IT ON UPDATE —
          a falsifier that has quietly come true is the most valuable thing in this namespace, and nothing
          else here will notice it for you. Leave it empty rather than invent one: an observation with no
          observable tell is a real category.
      related:
        type: array
        items:
          type: string
          x-reference:
            - perspective/users
            - perspective/projects
            - perspective/activities
            - perspective/goals
            - perspective/decisions
            - perspective/deliverables
            - perspective/concepts
            - perspective/terms
            - perspective/topics
            - perspective/findings
            - contacts
            - companies
            - meetings
            - users
            - teams
            - projects
            - phases
            - activity-lanes
            - activities
            - tasks
            - goals
            - deliverables
            - decisions
            - repos
          x-reference-soft: true
        description: >-
          WHAT ELSE THIS OBSERVATION TOUCHES — anything either world holds that is not already a typed field
          on this record. The place for the edge the schema did not anticipate: a term that only makes sense
          beside a meeting, a finding that is really about a repo.
          ONE-WAY, ALWAYS. No `x-inverse` anywhere in this list, and that is the rule rather than an
          omission: an observation may point at anything, and NOTHING gains a field pointing back at an
          observation — least of all a record a person authored, which must never grow a mirror generated
          from what a run happened to find.
          AND SOFT. `x-reference-soft` covers the record somebody has since deleted; the module's
          `peerDependencies` covers the collection nobody installed. A thing observed does not stop having
          been observed because its record was later removed.
          A NAMED UNION AND NOT `'*'`, deliberately. The engine accepts a wildcard, but compile then
          WARNS on every consumer — "uses x-reference: '*' outside the workspace module — an unverifiable
          cross-module surface; name the collections it may target" — and a module that prints a warning on
          every install has made every real warning invisible. A workspace that needs a target this list
          lacks widens the field itself: `dt set-field <collection> --name related …`.
          Reach for it AFTER the typed fields, never instead of them: a `project` that belongs in
          `project` and is put here instead is invisible to every view.
