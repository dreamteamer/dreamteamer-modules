route: /timeline/deliverables
scope: collection
collection: collections/perspective/deliverables
display:
  nav:
    title: Deliverables
    icon: file
    order: 8
  list:
    layout: gantt
    # WHAT WAS PRODUCED, over time — one bar per artefact from the day it was created to the day the
    # contributor last touched it, banded by kind. A long bar is a document revised across months, which
    # for a document-shaped contributor is the shape of the work itself.
    # `last_touched_on` is the LAST modifier's day, never proof of authorship — the collection says so.
    options:
      start: created_on
      end: last_touched_on
      group_by: kind
      bar_title: '{{ name }}'
      color_by: kind
      page_size: 100000
