route: /timeline/weeks
scope: collection
collection: collections/perspective/activity-weeks
display:
  nav:
    title: Weekly log
    icon: calendar
    order: 5
  list:
    layout: table
    columns:
      - period
      - summary
      - commits
      - lines_new
      - lines_modified
      - sessions
      - turns_user
      - threads_touched
      - files_touched
    sort: '-period'
    # The weekly log as a TABLE — the counted timeline, read as numbers rather than as a picture.
    # Its gantt twin is `weeks` ("Weeks (gantt)"), which draws the same records on the date axis.
    options:
      page_size: 200
