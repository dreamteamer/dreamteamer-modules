route: /projects
scope: collection
collection: collections/perspective/projects
display:
  nav:
    title: Projects
    icon: project
    order: 10
  list:
    layout: table
    columns:
      - name
      - kind
      - lifecycle_stage
      - status
      - activities
      - active_minutes
      - turns_user
      - corrections
      - correction_ratio
      - tokens_total
      - lines_new
      - lines_modified
      - commits_bug
      - commits_change_request
      - started
      - ended
    sort: '-active_minutes'
