# The same activities, banded by SUBJECT rather than by effort. `topics` is a list, so an activity
# about two things is drawn in both bands — the multi mode, which is what a tags-shaped axis means.
options:
  start_field: started
  end_field: ended
  group_rows_by_field: topics
  group_template: '{{ name }}'
  # A topic has no status and no rollups — what it has is how much evidence carries it and how long
  # it ran, which is exactly what a collapsed lane needs to be worth opening.
  group_summary_template: '{{ evidence_count }} pieces of evidence · {{ first_seen }} → {{ last_seen }}'
  template: '{{ name }}'
  color_by_field: status
  page_size: 100000
  # No date floor: a shared view with a hard `filter` hides older work from every timeline that
  # uses it. A personal narrowing belongs in your own workspace's view.
  columns:
    - name
    - started
    - ended
    - status
    - collaborative
  sort: -started
nav:
  label: Timeline by topic
  icon: tag
  order: 2
path: /timeline/by-topic
target: list
collection: collections/perspective/activities
layout: gantt
