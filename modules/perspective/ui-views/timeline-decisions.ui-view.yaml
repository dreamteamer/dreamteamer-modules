route: /timeline/decisions
scope: collection
collection: collections/perspective/decisions
display:
  nav:
    title: Decisions
    icon: law
    order: 9
  list:
    layout: gantt
    # EVERY DECISION ON THE DATE AXIS, banded by the effort it belongs to. Decisions are POINTS, not
    # spans — a decision happens on a day — so `end_field` is deliberately blank: the gantt's own
    # placeholder for that is "a point, not a bar", and inventing a duration nobody authored would be
    # worse than a dot. Read it as milestones per lane: when each effort was actually being decided.
    #
    # `project` is DERIVED (`bin/derive-decision-projects.mjs`), by joining the decision to the
    # activity that cites the same evidence. A decision whose evidence no activity cites has none and
    # lands in the ungrouped band, which is turned ON here on purpose: a curated decision-log row that
    # no reconstructed work touches is a fact about the model's reach, and hiding it would make the
    # picture look more complete than it is.
    options:
      start: decided_on
      group_by: project
      group_title: '{{ name }}'
      # The same project record as the activity timeline, so a lane means the same thing in both. The
      # commit count is dropped: this chart is about decisions, and a commit count beside them invites
      # a correlation neither view supports.
      group_summary: '{{ lifecycle_stage }} · {{ lead }}'
      bar_title: '{{ name }}'
      color_by: source_kind
      show_ungrouped_rows: true
      page_size: 100000
