name: perspective-observation
description: observed / context / wrong_if / related — when a model record was seen, what surrounded it, what would refute it, and what it touches
fields:
  observed:
    type: datetime
    description: 'WHEN THIS WAS OBSERVED — the instant the EVIDENCE puts it at, with its local offset, never the instant the record was written (that is `created`, which the engine keeps). A DATE-TIME rather than a date so the whole model tier sorts on one axis: several observations land in a day and the order they landed in is usually the argument. For a record concluded over a span, the LAST evidence in it — a timeline then reads as "this was known by then", which is the only reading that is true. Absent means nobody dated the observation, and the record drops out of every timeline silently; fill it on create.'
  context:
    type: string
    description: "WHAT ELSE WAS TRUE WHEN IT WAS SEEN, in one line — the circumstance a later reader needs before the claim can be judged: which period was being read, which sources were reachable, what had just happened. NOT a restatement of the record and not the reason it was written (`creation_context` holds that). The test: could somebody re-reading this in six months tell whether the observation still holds? If not, the missing sentence goes here."
  wrong_if:
    type: string
    description: 'ONE LINE: the observation, IN THIS WORLD, that would show this record is wrong — an event somebody could actually notice. "the person says they never worked on that", "a repo turns up with the commits this period is missing". NOT a counterfactual: the run that just concluded X is the worst available narrator of the world where it concluded Y, and the road not taken leaves no trace to contradict the story. A prediction about this world is checkable. AND RE-READ IT ON UPDATE — a falsifier that has quietly come true is the most valuable thing in this namespace, and nothing else here will notice it for you. Leave it empty rather than invent one: an observation with no observable tell is a real category.'
  related:
    type: [perspective/users, perspective/projects, perspective/activities, perspective/goals, perspective/decisions, perspective/deliverables, perspective/concepts, perspective/terms, perspective/topics, perspective/findings, contacts, companies, meetings, users, teams, projects, tasks, deliverables, decisions, repos]
    soft: true
    many: true
    description: "WHAT ELSE THIS OBSERVATION TOUCHES — anything either world holds that is not already a typed field on this record. The place for the edge the schema did not anticipate: a term that only makes sense beside a meeting, a finding that is really about a repo. ONE-WAY, ALWAYS. No `mirror_of` anywhere in this list, and that is the rule rather than an omission: an observation may point at anything, and NOTHING gains a field pointing back at an observation — least of all a record a person authored, which must never grow a mirror generated from what a run happened to find. AND SOFT. `soft` covers the record somebody has since deleted; the module's `peerDependencies` covers the collection nobody installed. A thing observed does not stop having been observed because its record was later removed. A NAMED UNION AND NOT `'*'`, deliberately. The engine accepts a wildcard, but compile then WARNS on every consumer — \"uses typed reference: '*' outside the workspace module — an unverifiable cross-module surface; name the collections it may target\" — and a module that prints a warning on every install has made every real warning invisible. A workspace that needs a target this list lacks widens the field itself: `dt set-field <collection> --name related …`. Reach for it AFTER the typed fields, never instead of them: a `project` that belongs in `project` and is put here instead is invisible to every view."
