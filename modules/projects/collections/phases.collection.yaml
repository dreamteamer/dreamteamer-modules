# phases — WHEN IN THE PLAN. The span a run of activities falls in: Discovery, Build, Pilot, Launch.
#
# ⚠ THIS WAS A FREE-TEXT FIELD UNTIL 2026-09-11 (`activities.phase`), and the same test that made
# `activity-lanes` a collection makes this one. Run it again and a different thing comes back, which
# is why these are two collections and not one:
#
#   A LANE has an ORDER and no dates — a string cannot carry the order, so `activity-lanes.order` is
#   REQUIRED. A PHASE has DATES and needs no order — `starts` IS the order, and a phase that has to be
#   hand-numbered is a lane wearing the wrong name. That is the whole distinction, and it is why
#   `order` is deliberately ABSENT below: adding it would let a plan say "Build runs before Discovery"
#   in one field while the dates say the opposite, and nothing could adjudicate.
#
# Two more follow from being a record, and neither would have been worth a collection alone:
#   · A TYPO IS REFUSED rather than drawn. `Phase 1`, `phase-1` and `Discovery` were three phases on
#     every board and one in somebody's head.
#   · THE SPAN IS STATED ONCE. A free-text phase repeated on forty activities carries its dates
#     nowhere, so "when does Build end" could only be answered by taking the max of its rungs — which
#     silently changes the moment somebody re-scopes one of them.
#
# ⚠ A PHASE BELONGS TO EXACTLY ONE PROJECT and says so: `project` is REQUIRED, where `activity-lanes.project`
# is optional. A band of work legitimately runs across two plans; a span of one plan's calendar does
# not — it is that plan's own time, and a phase shared between two projects is two phases.
# That is also what lets the id be project-scoped, so two plans may each have a "Discovery".
name: phases
description: >-
  One span of a plan — the stretch of calendar a run of activities falls in. `phases` is WHEN; `activity-lanes`
  is WHICH TRACK. A phase carries its own dates, so the span is stated once rather than inferred from
  whatever rungs happen to point at it.
use_when: >-
  a plan is long enough to read in stretches — Discovery, Build, Pilot, Launch — and somebody wants to know when
  a stretch starts and ends without taking the max of its rungs. Create the phases BEFORE setting
  `activities.phase`, and read here before inventing a new one. ⚠ A band of WORK that runs across the whole plan
  (a workstream, a surface, a team's track) is an `activity-lanes` record, not a phase: the test is whether it has
  dates of its own. A stretch that belongs to two projects is two phases — `project` is required
templates: [collection-templates/projects-provenance]
storage: { path: data/phases, codec: md, shape: file, suffix: phase }
# ⚠ A NON-LATIN NAME YIELDS A HASH ID, NOT A REFUSAL — the same warning that sits on `projects`,
# `goals`, `teams` and `activity-lanes`, for the same reason (the engine's `slug` filter is `slugOrHash`).
# A workspace whose phase names are not Latin passes `--id` explicitly.
# ⚠ PROJECT-SCOPED, unlike `activity-lanes`, and that is a consequence of `project` being REQUIRED:
# an id generator throws on a missing field, so only a required field can be an id segment. Two plans
# may each name a phase "Discovery" and they file apart, which is the correct answer for a span of
# one plan's own calendar.
id:
  generate: '{{ project | basename }}/{{ name | slug }}'
  pattern: ^[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$
schema:
  type: object
  required: [name, project, starts]
  properties:
    name:
      type: string
      description: What the stretch is called, as it should read in a band header — "Discovery", "Pilot", "Hardening".
    project:
      type: string
      x-reference: projects
      x-inverse:
        field: phases
        description: The stretches this plan is read in, earliest first — generated from `phases.project`.
      description: >-
        The plan this span belongs to. REQUIRED, and the FIRST SEGMENT OF THE ID — a phase is one project's
        own calendar, so a stretch shared between two plans is two records. (`activity-lanes.project` is
        optional for the opposite reason: a band of work genuinely can cross plans.)
    description:
      type: string
      description: One line on what this stretch is for — what the plan is trying to have true by the end of it.
    # ── THE FORCING FIELD, AND THE REASON THIS IS NOT `activity-lanes` ─────────────────────────────
    # REQUIRED. A phase without a start is a lane with a date-shaped name; `starts` is also what ORDERS
    # the phases, which is why there is no `order` field to contradict it.
    starts:
      type: string
      format: date
      description: >-
        REQUIRED. The first day of the stretch — and the ORDER, which is why this collection ships no `order`
        field. Two phases starting the same day is not refused by anything and means the reader picks between
        them arbitrarily; that is the signal to merge them or to move one.
    ends:
      type: string
      format: date
      description: >-
        The last day — the target, not a promise. ABSENT IS A MEANING and it is usually the honest one on the
        phase currently running: nobody has decided where it stops. It is never "until the next phase starts" —
        phases may overlap, and a plan whose Build and Hardening run together for three weeks should say so.
    status:
      type: string
      enum: [planned, active, done, dropped]
      default: planned
      description: >-
        Where the stretch stands, as a person says it — not derived from its activities. `planned` is the default
        because a plan is written AHEAD. ⚠ A phase whose `ends` has passed and whose status is still `active` is
        the most useful disagreement on the board; nothing here quietly fixes it.
    tags:
      type: array
      items: { type: string }
      description: Free strings, lowercase and hyphenated; the colon convention with no space.
    content:
      type: string
      format: markdown
      x-body: true
      description: >-
        What this stretch covers, what has to be true to leave it, and — the half that earns the body — what is
        deliberately NOT in it, so the phase does not become the stretch everything unscheduled slides into.
order: 12
list_fields: [name, project, starts, ends, status]
icon: clockface   # a span of the plan's own clock; `history` is the era a run measured
