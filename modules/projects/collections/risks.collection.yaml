# risks — WHAT COULD GO WRONG, CARRIED WITH AN OWNER AND AN INDICATOR rather than as prose worry.
# Born 2026-09-12 in the workspace that dogfooded this module: 29 risks lived as table rows in a
# dated note — unqueryable, unlinkable to the gates that retire them, invisible on any member's
# page. A risk that cannot be listed by owner is a risk nobody is carrying.
#
# ⚠ "UNASSESSED" IS A VALUE, NOT A GAP. The founding register's rule — likelihood and impact are
# assessed only where the sources support it — is why `likelihood` and `impact` carry an `unassessed` value
# instead of being optional: an absent field reads as "nobody looked", the value reads as "we looked
# and the sources do not support a number". Those are different facts and the second is the honest one.
#
# ⚠ A RISK IS RETIRED BY A GATE, NOT BY OPTIMISM. Where the plan already carries a gate whose
# `passes_when` tests exactly this exposure (the register's RK-14 → its gate g-06), `gate` names it — and `status` may only
# reach `closed` when that gate passed or the exposure is gone in the world. `mitigation` records
# what is DOCUMENTED as the treatment, never what someone hopes.
name: risks
description: >-
  A named thing that could go wrong on a project — with an owner, the evidence it is real, how likely and how
  bad the sources say it is, what is documented as the treatment, and the gate whose pass retires it.
use_when: >-
  an exposure is named — in a meeting, a review, an estimate that rests on an unverified claim — write it here
  with `owner` and `evidence`, never as a table row in a note; asked "what threatens this plan" or "what does
  <person> carry", list here by `project` or `owner`. ⚠ Search here before re-deriving an exposure a review
  already named, and before calling anything de-risked: `status` only reaches `closed` through its `gate` or a
  change in the world, both quotable
storage: { path: data/risks, codec: md, shape: file, suffix: risk }
# The code IS the id, exactly as on decisions/goals/deliverables: this workspace names things in
# Hebrew, where `slug` is `slugOrHash` and returns `x000w6xq` without failing. A register that already
# speaks in RK-xx keeps its codes — they are load-bearing vocabulary, not an invention.
id:
  generate: '{{ code }}'
  pattern: ^[a-z0-9][a-z0-9-]*$
schema:
  type: object
  required: [code, name, project, category, likelihood, impact, owner, evidence, status]
  properties:
    code:
      type: string
      pattern: '^rk-[0-9]{2,3}$'
      description: 'The register code — `rk-01`. IS the id; the room says "RK-14" out loud, so the code is how a risk is named.'
    name:
      type: string
      description: The risk in one line — what goes wrong, not what should be done about it. Any script is welcome; the code carries the id.
    project:
      type: string
      x-reference: projects
      x-inverse:
        field: risks
        description: What threatens this effort — generated from `risks.project`.
      description: The effort this exposure threatens. Required — a risk that belongs to nothing threatens nothing.
    category:
      type: string
      enum: [commercial, scope-execution, client-environment, technical, regulatory]
      description: >-
        Which register section it files under — the three every delivery register grows (commercial · scope
        and execution · client and environment), plus `technical` and `regulatory` for exposures that are about
        the build or the law rather than the deal.
    likelihood:
      type: string
      enum: [certain, high, medium, low, unassessed]
      description: >-
        How likely, ONLY where the sources support a level — `certain` is reserved for what has already been
        observed. `unassessed` means the sources were read and do not support a number; it is a finding,
        not a blank.
    impact:
      type: string
      enum: [catastrophic, high, medium-high, medium, low, unassessed]
      description: >-
        How bad if it lands, on the same honesty rule as `likelihood`. `catastrophic` is reserved for exposures
        that end a channel or the engagement, not for emphasis.
    owner:
      type: string
      x-reference: users
      x-inverse:
        field: risks
        description: The exposures this person carries — generated from `risks.owner`.
      description: >-
        WHO CARRIES IT — accountable for the mitigation moving, not necessarily the person who created the
        exposure. Required: the founding register's worst finding was ownerless risks, and this field is
        what makes that state impossible to write.
    evidence:
      type: string
      description: >-
        REQUIRED. Where this was seen — the meeting, the quote, the record, dated. A risk without evidence is
        an anxiety; a register cites a source for every row and so does this.
    indicator:
      type: string
      description: >-
        The OBSERVABLE that says it is materialising — an event somebody could actually notice, in this world.
        The workspace's own concept demands an indicator, and a risk without one can only be argued about,
        never watched. Optional because inventing one is worse than leaving it empty.
    mitigation:
      type: string
      description: What is DOCUMENTED as the treatment and where that stands — never what someone hopes. Empty means none is documented, which is itself worth reading.
    gate:
      type: string
      x-reference: activities
      x-inverse:
        field: retires_risks
        description: The exposures this gate's pass retires — generated from `risks.gate`.
      description: >-
        The plan gate whose PASS retires this risk (an `activities` record with `kind: gate`). The strongest
        state a risk can be in — a dated, owned condition instead of an intention. Empty for exposures no gate
        yet tests, which is a plan gap worth seeing.
    status:
      type: string
      enum: [open, mitigating, accepted, materialised, closed]
      description: >-
        Where it stands. `open` — named, nothing moving. `mitigating` — the documented treatment is in motion.
        `accepted` — someone with the authority decided to live with it, and `mitigation` says who. `materialised`
        — it happened; the record stays as the register's memory. `closed` — retired through `gate` or gone in
        the world, both quotable.
    affects:
      type: array
      items: { type: string }
      description: >-
        What it lands on, as `<collection>/<id>` strings — plain strings, not references, for the same reason
        `decisions.affects` is: the risk outlives what it threatens, and a record that dangles on delete gets
        deleted with it.
    tags:
      type: array
      items: { type: string }
      description: Free strings, lowercase and hyphenated; the colon convention with no space.
    content:
      type: string
      format: markdown
      x-body: true
      description: The fuller story where one line cannot hold it — the numbers, the history, and later what actually happened.
    # ---- provenance: who made this record, from what, and how much to trust it. Inlined from the
    # projects-provenance template on 2026-10-01; one shared template per module was a copy of the same quad twelve times.
    # free-text string, not x-reference: the target is polymorphic (users | agents) and
    # x-reference cannot express that.
    author:
      type: string
      description: >-
        Which AGENT made this record — `agents/dreamteamer (claude-opus-5)`. Leave it ABSENT when the
        operator wrote it themselves: there is no `users` collection to point at since engine 0.8.0, and
        absent is the honest encoding of the default rather than a constant repeated on every record.
    creation_context:
      type: string
      description: How and why this record came to be, in one line — and the reason whenever confidence is low.
    source:
      type: string
      description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…> · migration:<id>.'
    confidence:
      type: string
      enum: [low, normal, high]
      default: normal
      description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
order: 15
list_fields: [name, category, likelihood, impact, owner, status, gate]
icon: flame
