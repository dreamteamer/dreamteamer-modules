# The plan as a gantt, banded by phase. A gate has starts == ends, so it draws as a point among the bars.
route: /plan/gantt
scope: collection
collection: collections/activities
display:
  nav:
    title: Plan (gantt)
    icon: graph-line
    order: 3
  list:
    layout: gantt
    sort: starts
    options:
      start: starts
      end: ends
      group_by: phase
      color_by: status
