# THE PLAN — every rung of every project in code order, work and gates together. That they share one
# table is the fold: a reader sees what happens and what blocks in one list rather than in two tabs.
path: /content/activities
target: list
collection: collections/activities
layout: table
options:
  columns: [code, name, kind, lane, phase, starts, ends, lead, status]
  sort: code
default: true
