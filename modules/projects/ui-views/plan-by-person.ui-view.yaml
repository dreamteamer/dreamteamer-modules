# "What is mine": the plan banded by `seats`, everyone on a rung, not by `lead`. A person usually sits
# on far more rungs than they lead, so banding by lead would hide most of their work; `lead` stays a
# column. A person's assigned tasks are the tasks module's by-assignee view, and both resolve to the
# same `users` record.
path: /plan/by-person
target: list
collection: collections/activities
layout: table
nav: { label: Plan by person, icon: person, order: 4 }
options:
  group_rows_by_field: seats
  show_ungrouped_rows: true
  columns: [code, name, kind, lane, phase, starts, ends, lead, status]
  sort: starts
