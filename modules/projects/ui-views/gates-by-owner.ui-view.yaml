# Gates by owner — what blocks the plan, banded by who actually holds it. Banded on `external_owner`,
# not `lead`: the question is "who are we waiting on", and that is often someone outside. Gates with no
# outside owner stay visible as their own band. A saved filter over `activities`, like /plan/gates.
path: /plan/gates/by-owner
target: list
collection: collections/activities
layout: table
nav: { label: Gates by owner, icon: law, order: 6 }
filter:
  kind: { _eq: gate }
options:
  group_rows_by_field: external_owner
  show_ungrouped_rows: true
  columns: [code, name, gate_kind, starts, lead, blocking, status, evidence]
  sort: starts
