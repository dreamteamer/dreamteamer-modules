# GATES BY OWNER — what blocks the plan, banded by who actually holds it.
#
# ⚠ Banded on `external_owner`, not on `lead`. A gate's lead is one of OURS — the person accountable for
# checking it — but the question this view answers is "who are we waiting on", and for 12 of the 21 gates
# on the plan this was folded from, that is somebody outside: the client approving, the partner supplying
# an environment, the regulator. `show_ungrouped_rows` keeps the gates that depend on us alone visible as
# their own band rather than hiding the half we CAN move.
#
# A saved filter over `plan/activities`, like /plan/gates — gates did not become a second collection.
path: /plan/gates/by-owner
target: list
collection: collections/activities
layout: table
nav: { label: Gates by owner, icon: law, order: 6 }
filter:
  kind: { _eq: gate }
options:
  group_rows_by_field: external_owner
  show_ungrouped_rows: true
  columns: [code, name, gate_kind, starts, lead, blocking, status, evidence]
  sort: starts
