name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Structure, compiles-alone (every module in a virgin workspace on the pinned engine), the
      # leak gate and the resolver rule — plus every module's own suite.
      - name: tests
        run: npm test

      # DISTRIBUTION, which no test in the tree can cover: install the PACKED TARBALL exactly as a
      # consumer would, and drive the two things the package exists to do — deliver six modules
      # through one install, and let a workspace keep only some of them. A missing entry in
      # `files[]` fails here rather than failing a stranger.
      - name: first-run smoke — the npm channel, then the cherry-pick
        run: |
          set -euo pipefail
          PKG=$(npm pack --silent | tail -1)
          PKG_PATH="$PWD/$PKG"
          D=$(mktemp -d)
          cd "$D"
          git init -q
          git config user.email ci@example.com
          git config user.name CI
          npm init -y >/dev/null
          # The PUBLISHED engine, not a checkout: the bundle discovery this package depends on
          # arrived in 0.24.0, and a consumer installs it from the registry.
          npm install --silent dreamteamer@^0.25.0
          npx dreamteamer init --name smoke
          npm install --silent "$PKG_PATH"
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.dreamteamer.vars = ["FILES_FOLDER", "INBOX_FOLDERS", "REPOS_FOLDER"];
            fs.writeFileSync("package.json", JSON.stringify(p, null, "\t") + "\n");
          '
          printf 'FILES_FOLDER=%s/files\nINBOX_FOLDERS=%s/inbox\nREPOS_FOLDER=%s\n' "$D" "$D" "$D" > .env
          npx dreamteamer compile
          npx dreamteamer check
          # every module arrived, on the npm channel
          for m in assets contacts projects meetings recordings perspective search; do
            npx dreamteamer status | grep -qE "^\s+$m\s+node_modules" || { echo "::error::module $m was not discovered from the package"; exit 1; }
          done
          # Two record writes through the shipped descriptors, because `slug` is OPTIONAL again and
          # BOTH arms of the ordered id template have to be exercised: with a slug the id uses it,
          # without one it falls back to the name. A smoke that only ever passes a slug would not
          # notice the fallback arm going missing.
          npx dreamteamer add tasks --slug smoke-the-package --name "Smoke the package"
          npx dreamteamer add tasks --name "Smoke the fallback"
          npx dreamteamer list tasks --json | node -e '
            const rows = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const ids = rows.map((r) => r.id);
            const hit = (re) => ids.some((id) => re.test(id));
            if (!hit(/--smoke-the-package$/)) { console.error("::error::the slug arm did not drive the id: " + ids); process.exit(1); }
            if (!hit(/--smoke-the-fallback$/)) { console.error("::error::the name fallback arm did not drive the id: " + ids); process.exit(1); }
            console.log("✔ both arms of the ordered id template drive an id");
          '
          npx dreamteamer check
          # the cherry-pick: two modules dropped, the rest still compiles and checks
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.dreamteamer.disable = ["recordings", "perspective"];
            fs.writeFileSync("package.json", JSON.stringify(p, null, "\t") + "\n");
          '
          npx dreamteamer compile
          npx dreamteamer check
          npx dreamteamer status | grep -qE "^\s+recordings\s" && { echo "::error::a disabled module was still discovered"; exit 1; }
          echo "✔ six modules through one install, and the cherry-pick holds"

      # The dependency graph is not decoration: dropping a module another one needs must FAIL,
      # naming it. A refusal that stopped refusing would be invisible otherwise.
      - name: a broken cherry-pick is refused
        run: |
          set -euo pipefail
          PKG=$(npm pack --silent | tail -1)
          PKG_PATH="$PWD/$PKG"
          D=$(mktemp -d)
          cd "$D"
          git init -q && git config user.email ci@example.com && git config user.name CI
          npm init -y >/dev/null
          npm install --silent dreamteamer@^0.25.0
          npx dreamteamer init --name refusal
          npm install --silent "$PKG_PATH"
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.dreamteamer.vars = ["FILES_FOLDER", "INBOX_FOLDERS", "REPOS_FOLDER"];
            p.dreamteamer.disable = ["contacts"];
            fs.writeFileSync("package.json", JSON.stringify(p, null, "\t") + "\n");
          '
          if npx dreamteamer compile > /tmp/out.txt 2>&1; then
            echo "::error::compiled with meetings kept and contacts disabled — the dependency graph is not being enforced"
            exit 1
          fi
          grep -q 'depends on "contacts", which is not installed' /tmp/out.txt || {
            echo "::error::refused, but not for the declared-dependency reason:"; cat /tmp/out.txt; exit 1; }
          echo "✔ the refusal names the missing module"
