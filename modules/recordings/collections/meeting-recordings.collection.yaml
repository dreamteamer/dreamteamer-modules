# A meeting-recording is a CAPTURE of a meeting — audio, or pasted text. It owns the transcript,
# because the transcript belongs next to the artifact that produced it: N captures of one meeting
# are N records with N transcripts.
name: meeting-recordings
description: >-
  One captured audio file and its transcript — the evidence a meeting record hangs off.
use_when: >-
  an audio file or a pasted transcript arrives — it becomes a record here first (/fetch-new-recordings), is matched to its meeting, then transcribed; a meeting with no transcribed recording cannot be summarised or analysed
sensitive: true
# codec md, not yaml: the record needs a body to hold the transcript.
storage: {path: data/meeting-recordings, format: md}
ids:
  # Derived from `date`, not `created`: `created` is the moment the record is WRITTEN, so a June
  # recording imported in July would otherwise be filed under July.
  from: "{{ date | date:YYYY/MM }}/{{ date | date }}--{{ name | slug }}"
  pattern: "^\\d{4}/\\d{2}/\\d{4}-\\d{2}-\\d{2}--[a-z0-9-]+$"
fields:
  name:
    type: string
    required: true
    description: What this capture is called — usually "[date] [who]", as the file was named.
  description:
    type: string
    description: One line on what was captured, when the name is not enough.
  # The ORDERING key, and half of what the id derives from. A date-time, so the several captures
  # that share one day still sort. It is the SLOT this capture belongs to, not the moment the
  # microphone started — that is `recorded_at`, which is why the two fields are not redundant.
  # With no meeting linked, fall back to a time in the filename (detect.mjs reports it as
  # `time_hint`), then to the day at 00:00 local, and say which in creation_context. Midnight is
  # the honest encoding of "the time is unknown".
  date:
    type: datetime
    required: true
    description: >-
      The meeting instant this capture belongs to — the linked meeting's `starts`, so the list sorts and the id generates without a join. Everything sorts on this. NOT when recording began — that is `recorded_at`, which is usually empty and never inferred. With no meeting linked, use the filename's time, else the day at 00:00.
  # The one pointer to the bytes. Named `recording_file` because `file:` is already a `source:`
  # prefix and `codec: file` a storage codec. The path below the folder is the record id, so the
  # archive is self-indexing: `${env:FILES_FOLDER}/meeting-recordings/<this record's id>.m4a`.
  recording_file:
    type: string
    examples: ['${env:FILES_FOLDER}/meeting-recordings/2026/08/2026-08-30--acme-weekly.m4a']
    description: >-
      The archived copy of the recording's bytes: ${env:FILES_FOLDER}/meeting-recordings/<this record's id> plus the original extension. Set by the importer when it files the original out of the inbox, and what keeps every file under FILES_FOLDER pointed at by a record. Empty is legitimate — a pasted transcript (`origin: pasted`) is a recording with no file. Never an inbox path: an inbox item has no record yet, so ${env:INBOX_FOLDERS} never appears in a record template, only in the scripts and skills that scan it.
  duration:
    type: string
    description: How long the capture runs, as h:mm:ss.
  # The absolute wall-clock instant the recording STARTED — t=0 for every timestamp in the
  # transcript, and the only thing that turns a `[16:22]` turn into a real time. Optional, and
  # usually empty. There is no automatic source for it: an m4a's `creation_time` is when that COPY
  # was written, and nothing in the file tells an original from a later copy. Fill it only from a
  # time in the filename or one a person states. Only a set `recorded_at` licenses anchoring a
  # transcript timestamp to a wall clock; `date` never does, however precise it looks.
  recorded_at:
    type: datetime
    description: "The absolute instant recording STARTED — t=0 for every transcript timestamp. Usually EMPTY, and never inferred from the file: nothing in an m4a distinguishes an original from a later copy. Fill it only from the filename or something a person states."
  notes:
    type: string
    description: Anything worth knowing about the capture itself — bad audio, a missing first minute, who was off-mic.
  origin:
    type: string
    enum: [audio, pasted]
    description: How this capture was made. A lost-file capture stays `audio` with no `recording_file`, confidence low and the reason in creation_context.
  fingerprint:
    type: string
    description: sha256 of the binary — the idempotency key for /fetch-new-recordings. Survives a file being renamed, which a filename does not.
  # The OWNING side of the link. `meetings.recordings` is generated from this field
  # (`mirror_of: meeting`, declared in this module's meetings overlay): a write here updates it,
  # and a direct write there is refused. Filters resolve OUTBOUND refs only, so each side still
  # buys a predicate the other cannot express.
  meeting:
    type: meetings
    on_delete: restrict
    description: The meeting this capture records. Empty means unmatched — /match-recording-to-meeting's queue.
  # The block is the transcriber's OUTPUT, so its caveats live inside it: `notes` here is what the
  # transcriber could not settle (a corrected speaker count, an unmapped label), and the record's
  # top-level `notes` stays a person's note about the capture. Two hands, two fields.
  transcription:
    type: map
    description: >-
      The provenance block the transcribe skill writes — `engine`/`diarization`/`duration` or `source`/`method`, `language`, `speaker_count`, `speakers` (label → person), `generated`, and `notes`: the transcriber's own caveats. THIS is the "is it transcribed?" signal, never the body — a body pasted by hand with no block is exactly the case worth flagging.
  transcript:
    type: markdown
    body: true
    description: The diarized transcript of this capture, timestamped and speaker-labelled.
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: calendar:<id> · <collection>/<id> · file:<path> · url:<…> · linkedin:<slug> · migration:<id>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
display:
  nav:
    icon: mic
    order: 13
    section: crm
  list:
    columns:
      - name
      - last_modified
      - date
      - meeting
      - duration
