command: commands/update-contacts-from-meetings
collection: collections/meetings
scope: record
# a meeting can stamp its attendees once it HAS them as contacts — an empty invite, or one the sync
# never resolved, stamps nobody, and the fix for that is fetching-meetings correcting the record,
# not this command.
available_when:
  attendees_contacts:
    _nempty: true
# can-exit is omitted: "every attendee's recent_meeting_date >= this meeting's starts" is a
# condition on other records, which a binding cannot express. The script is idempotent and
# forward-only, so re-running on a meeting that already stamped everyone is a no-op.
description: stamp each attendee's contact with this meeting as their latest, if it is
