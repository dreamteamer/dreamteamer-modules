# roles — the positions people hold, as one list the whole workspace shares.
name: roles
description: >-
  A position a person holds — team leader, backend developer, product manager, QA engineer. One record per role; a person lists the roles they hold on `users.roles`.
use_when: >-
  a person's position is named — find or create the role here, then list it on the person's `roles`; asked "who are the backend developers", list users filtered by role
storage:
  path: data/roles
  format: md
  suffix: role
ids:
  from: '{{ name | slug }}'
  pattern: ^[a-z0-9][a-z0-9-]*$
fields:
  name:
    type: string
    required: true
    description: The role as the workspace says it — "team leader", "backend developer".
  description:
    type: string
    description: What the role covers, in one line.
  users:
    type: users
    many: true
    mirror_of: roles
    description: GENERATED — who holds this role. Set `roles` on the user.
  notes:
    type: markdown
    body: true
    description: Expectations, scope, how the role is filled.
  tags:
    type: string
    many: true
    examples: ['onboarding', 'client:northwind']
    pattern: ^[a-z0-9]+(-[a-z0-9]+)*(:[a-z0-9]+(-[a-z0-9]+)*)?$
    description: Free labels, lowercase and hyphenated, optionally key:value with no space around the colon.
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…> · migration:<id>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
display:
  nav:
    icon: symbol-class
    order: 11
  list:
    columns: [name, description, users]
