# responsibilities — the areas someone owns, as one list the whole workspace shares.
name: responsibilities
singular: responsibility
description: >-
  An area of ownership — release sign-off, the relationship with a client, the CI pipeline, onboarding. One record per area; a person lists the responsibilities they carry on `users.responsibilities`. Not a task (a commitment with an end), not a role (a position), and never project-bound.
use_when: >-
  someone is said to "own" or "be responsible for" an area — find or create it here, then list it on the person's `responsibilities`; asked "who owns X", read here
storage:
  path: data/responsibilities
  format: md
  suffix: responsibility
ids:
  from: '{{ name | slug }}'
  pattern: ^[a-z0-9][a-z0-9-]*$
fields:
  name:
    type: string
    required: true
    description: The area, as a noun phrase — "release sign-off", "client onboarding".
  description:
    type: string
    description: What owning it means, in one line.
  users:
    type: users
    many: true
    mirror_of: responsibilities
    description: GENERATED — who carries it. Set `responsibilities` on the user.
  notes:
    type: markdown
    body: true
    description: The boundaries — what is in, what is out, who to ask.
  tags:
    type: string
    many: true
    examples: ['onboarding', 'client:northwind']
    pattern: ^[a-z0-9]+(-[a-z0-9]+)*(:[a-z0-9]+(-[a-z0-9]+)*)?$
    description: Free labels, lowercase and hyphenated, optionally key:value with no space around the colon.
  author:
    type: string
    examples: ['agents/claude-code', 'scripts/read-git@2']
    pattern: '^(agents|scripts)/[a-z0-9][a-z0-9-]*(@[a-z0-9][a-z0-9./-]*)?$'
    description: >-
      Which agent or script wrote this record: `agents/<harness>`, or `scripts/<name>@<version>` for a reader. Absent when a person wrote it. The model, when it matters, goes in `creation_context`.
  creation_context:
    type: string
    description: How and why this record came to be, in one line — and the reason whenever confidence is low.
  source:
    title: Information source
    type: string
    description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: <collection>/<id> · file:<path> · url:<…> · migration:<id>.'
  confidence:
    type: string
    default: normal
    enum: [low, normal, high]
    description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
display:
  nav:
    icon: key
    order: 12
  list:
    columns: [name, description, users]
  form:
    sections:
      - title: Provenance
        fields: [author, creation_context, source, confidence]
        collapsed: true
