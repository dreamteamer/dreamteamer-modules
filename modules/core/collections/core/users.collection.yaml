# OVERLAY of users — the roles and responsibilities a person holds (the shared lists core ships), so
# "who are the backend developers" and "who owns onboarding" are filters. `manager` and `reports` are
# users' own from users 0.3.0, and reach core through its composed copy of users.
name: users
overlay: true
fields:
  roles:
    type: roles
    many: true
    description: The positions they hold — `roles` records, one list the whole workspace shares.
  responsibilities:
    type: responsibilities
    many: true
    description: The areas they own — `responsibilities` records, one list the whole workspace shares.
