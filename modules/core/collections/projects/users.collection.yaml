name: users
overlay: true
fields:
  decisions:
    type: decisions
    many: true
    mirror_of: decider
    description: The calls this person made — generated from `decisions.decider`.
  deliverables:
    type: deliverables
    many: true
    mirror_of: owner
    description: The artefacts this person is accountable for handing over — generated from `deliverables.owner`.
  led_projects:
    type: projects
    many: true
    mirror_of: lead
    description: The projects this person leads — generated from `projects.lead`.
  risks:
    type: risks
    many: true
    mirror_of: owner
    description: The exposures this person carries — generated from `risks.owner`.
  teams:
    type: teams
    many: true
    mirror_of: members
    description: The teams this person belongs to — generated from `teams.members`, so somebody joins a team by editing the TEAM.
  led_teams:
    type: teams
    many: true
    mirror_of: lead
    description: The teams this person runs — generated from `teams.lead`.
