# The inbox: every `todo` task, soonest due first, with who owes it.
# `columns` replaces the descriptor's `list_fields`, and a column the schema lacks is dropped silently,
# so check every column against the descriptor when editing this.
# It filters on `status` only, never on `assignee`: an empty assignee means the workspace's own person.
# One person's inbox is the by-assignee view, or `npx dt list tasks --filter assignee=users/<id> --filter status=todo`.
route: /inbox
scope: collection
collection: collections/tasks
filter:
  status:
    _eq: todo
display:
  nav:
    title: Inbox
    icon: inbox
    order: 1
  list:
    layout: table
    columns:
      - name
      - assignee
      - status
      - urgent
      - due
      - assistant_recommended_next_step
    sort: due
