# Scheduled start to deadline; terminal status does not imply an actual completion date.
route: /tasks/retro/gantt
scope: collection
collection: collections/tasks
filter:
  status:
    _in: [done, closed]
display:
  nav:
    title: Retro (gantt)
    icon: graph-line
    order: 6
  list:
    layout: gantt
    sort: start
    options:
      start: start
      end: due
      group_by: assignee
      color_by: status
