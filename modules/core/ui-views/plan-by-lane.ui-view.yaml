# The swimlane board: the plan banded by `lane`, stacked in each lane's `order`. Rungs with no lane
# stay visible as their own band, so an unbanded plan does not look finished. /plan/gantt bands by
# `phase`, the time axis.
route: /plan/by-lane
scope: collection
collection: collections/activities
display:
  nav:
    title: Plan by lane
    icon: three-bars
    order: 7
  list:
    layout: table
    columns: [code, name, kind, phase, starts, ends, lead, status]
    sort: code
    options:
      group_by: lane
      show_ungrouped_rows: true
