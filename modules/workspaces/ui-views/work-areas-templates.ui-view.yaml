# Presentation filter only; authorization belongs to the host.
route: /workspaces/work-areas/templates
scope: collection
collection: collections/workspaces/work-areas
filter:
  is_template:
    _eq: true
display:
  list:
    layout: table
    columns:
      - name
      - organization
    sort: name
  nav:
    title: Templates
    icon: symbol-structure
    order: 2
