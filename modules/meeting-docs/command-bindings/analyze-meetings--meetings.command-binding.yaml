command: commands/analyze-meetings
collection: collections/meetings
scope: record
# same one-hop-through-the-recordings-array gate as summarize-meeting and extract-tasks-from-meetings:
# the review is built on the RAW transcript, so a meeting with no transcribed recording cannot be
# reviewed at all — reviewing from the summary is the one thing `analyzing-meetings` forbids outright.
available_when:
  recordings:
    transcription:
      _nempty: true
# can-exit is omitted, so the command never shows "done"; a later review of the same meeting is normal.
#
# Not gated on the call having anything at stake: running it on one meeting is a deliberate choice. The
# gate that skips internal calls lives in /process-new-meetings step 8, where the pipeline picks targets.
description: review this meeting critically — validate what was said, into a `meeting-analyses` record
