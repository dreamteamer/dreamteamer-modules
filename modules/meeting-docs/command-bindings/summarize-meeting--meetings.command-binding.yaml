command: commands/summarize-meeting
collection: collections/meetings
target: record
# one-hop through the recordings ARRAY (_some semantics): at least one recording must be transcribed.
can-enter:
  recordings:
    transcription:
      _nempty: true
# can-exit is omitted, so the command never shows "done"; a re-summary replaces the existing one.
description: summarize this meeting's transcript into a meeting-summary record
