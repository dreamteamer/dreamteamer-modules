command: commands/extract-tasks-from-meetings
collection: collections/meetings
target: record
# one-hop through the recordings array (_some semantics): at least one recording must be transcribed.
# `transcription` (the provenance object), never `transcript` (the body) — a body pasted by hand
# with no provenance block is exactly the case worth flagging as not yet transcribed.
can-enter:
  recordings:
    transcription:
      _nempty: true
# can-exit is omitted: a task points at its meeting, but no field on the meeting points back, so the
# command never shows "done".
description: extract action items from this meeting into tasks
