command: commands/extract-tasks-from-meetings
collection: collections/meetings
scope: record
# privacy: a `restricted` meeting's pipeline ends at the transcript, so no tasks are extracted from
# it. An empty `privacy` is `open`, matched explicitly because `_neq` rejects an empty
# value.
# recordings: one hop through the recordings array (_some semantics): at least one recording must be
# transcribed. `transcription` (the provenance object), never `transcript` (the body) — a body pasted
# by hand with no provenance block is exactly the case worth flagging as not yet transcribed.
available_when:
  _or:
    - privacy:
        _null: true
    - privacy:
        _neq: restricted
  recordings:
    transcription:
      _nempty: true
# done_when is omitted: a task points at its meeting, but no field on the meeting points back, so the
# command never shows "done".
description: extract action items from this meeting into tasks
