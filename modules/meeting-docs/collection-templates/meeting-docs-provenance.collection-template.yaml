# crm-provenance: the four fields every CRM data entity carries, so any record can say who made
# it, from what, and how much to trust it.
#
# ⚠ NAMED `crm-provenance`, not `provenance`, ON PURPOSE — and this is the recipe self-containment
# rule, not a naming quirk. Compile treats a collection-template id as an IDENTITY entity: two
# modules shipping `collection-templates/provenance` is a hard name collision, not a merge. So a
# module that wants a shared field set must own it under a module-scoped id, or it can only ever be
# installed alongside whichever module happens to ship the unscoped one. That is exactly the trap
# the 2026-07-25 contact-management extraction fell into: every descriptor opened
# `templates: [collection-templates/provenance]` while the template lived in a DIFFERENT module, so
# the extracted repo could not compile into a bare workspace at all.
#
# The cost is a near-duplicate of ~20 lines in each module. The benefit is that the CRM half can be
# copied into any workspace on its own and compile. Duplication you can cherry-pick beats a
# dependency you must import — which is the whole reason recipes are recipes.
#
# NOT for system records (collections, commands, skills, agents, ui-views) — they comply with a
# standardized schema, and their provenance is the module that shipped them.
#
# What each field MEANS now lives in its `description:`, not in a comment — that is the text the
# UI shows on hover, and one home for the explanation is the only way it stays true.
name: meeting-docs-provenance
description: author / creation_context / source / confidence — the traceability quad on every meeting-docs record (`meeting-preps`, `meeting-summaries`, `meeting-analyses`)
template:
  schema:
    type: object
    properties:
      # free-text, not x-reference: the target is polymorphic (users | agents) and x-reference
      # cannot express that — so `check` cannot catch a typo'd `agents/dreamtemer`. Accepted.
      author:
        type: string
        description: >-
          Which AGENT made this record — `agents/dreamteamer (claude-opus-5)`. Leave it ABSENT when the
          operator wrote it himself: there is no `users` collection to point at since engine 0.8.0, and
          absent is the honest encoding of the default rather than a constant repeated on every record.
      creation_context:
        type: string
        description: How and why this record came to be, in one line — and the reason whenever confidence is low.
      source:
        type: string
        description: 'Where the INFORMATION came from, prefixed so it stays machine-readable: calendar:<id> · <collection>/<id> · file:<path> · url:<…> · linkedin:<slug> · migration:<id>.'
      confidence:
        type: string
        enum: [low, normal, high]
        default: normal
        description: How much to trust this record. When low, the reason goes in creation_context — there is no separate note field.
