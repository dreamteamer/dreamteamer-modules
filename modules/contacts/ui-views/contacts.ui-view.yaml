# The default contacts view: the person met most recently on top, contacts with no past meeting at
# the bottom. `recent_meeting_date` is kept by /update-contacts-from-meetings (the meetings module).
path: /contacts
target: list
collection: collections/contacts
layout: table
default: true
options:
  columns:
    - avatar
    - name
    - role
    - company
    - recent_meeting_date
    - recent_meeting
    - linkedin_degree
    - status
  sort: -recent_meeting_date
nav:
  label: contacts
  icon: person
