# The pipeline: every engagement that is not closed, one column per stage, warmest first.
path: /engagements/pipeline
target: list
collection: collections/engagements
layout: kanban
options:
  group_by: stage
  fields:
    - name
    - company
    - temperature
    - phase
    - champion
  sort: '-updated'
filter:
  stage:
    _neq: closed
nav:
  label: Pipeline
