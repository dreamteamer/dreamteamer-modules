# "What is mine", the task half. Banded by `assignee`, with the unassigned pile shown because an empty
# assignee means the workspace's own person.
# With the projects module installed, its /plan/by-person is the plan half; both resolve to one `users` record.
path: /tasks/by-assignee
target: list
collection: collections/tasks
layout: table
nav: { label: Tasks by person, icon: person, order: 3 }
options:
  group_rows_by_field: assignee
  show_ungrouped_rows: true
  columns: [name, lane, status, urgent, due]
  sort: due
