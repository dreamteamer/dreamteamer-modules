route: /tasks/board
scope: collection
collection: collections/tasks
filter:
  status:
    _in:
      - suggested
      - todo
      - doing
      - blocked
display:
  nav:
    title: Board
    icon: project
    order: 0
  list:
    layout: kanban
    columns:
      - name
      - status
      - assignee
      - created
      - due
      - project
      - tags
    sort: due
    options:
      lanes_by: status
      show_empty_columns: false
      page_size: 100000
      card_title: |-
        **{{ name }}**

        Created: {{ created }} · Due: {{ due }}
        {{ assignee }} · {{ project }}
