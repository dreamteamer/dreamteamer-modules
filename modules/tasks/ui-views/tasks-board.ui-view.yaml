# Columns by `status`, bands by `project`: where each piece of work stands, inside the effort it serves.
# Most tasks name no project, so `show_ungrouped_rows` is on: without it the surface hides them.
route: /tasks/board
scope: collection
collection: collections/tasks
display:
  nav:
    title: Board
    icon: project
    order: 2
  list:
    layout: kanban
    options:
      # The enum order on each field is the order its columns and bands appear in.
      lanes_by: status
      group_by: project
      show_ungrouped_rows: true
      # Every task on one page, so no band is cut off.
      page_size: 100000
      card_title: |-
        **{{ name }}**
        {{ status }} · {{ due }}
