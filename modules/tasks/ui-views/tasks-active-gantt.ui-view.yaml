# Scheduled start to deadline; terminal status does not imply an actual completion date.
route: /tasks/active/gantt
scope: collection
collection: collections/tasks
filter:
  status:
    _in: [doing, blocked]
display:
  nav:
    title: Active (gantt)
    icon: graph-line
    order: 5
  list:
    layout: gantt
    sort: start
    options:
      start: start
      end: due
      group_by: assignee
      color_by: status
