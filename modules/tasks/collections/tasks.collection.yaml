name: tasks
description: A concrete commitment, starting with a verb — what would be done, not the topic it is about.
use_when: a concrete commitment surfaces — in a meeting, a chat, a plan — capture it here with a verb and, whenever a date was actually said, the absolute `due`; pass `--lane` when the domain is clear (the workspace's own lane vocabulary) and leave it empty when it is not — the field is optional and the board has an "unassigned" pile for the residue; asked "what do I owe", list here by due date
templates: [collection-templates/projects-provenance]
storage:
  path: data/tasks
  codec: md
  shape: file
  suffix: task
id:
  # ⚠ AN ORDERED LIST (engine >=0.25.0): the first template whose fields are all
  # present wins. `slug` when the record carries one, the name otherwise — which is
  # what lets `slug` be OPTIONAL instead of forcing a handle onto every record.
  # `{{ slug }}` is the FIELD; `{{ name | slug }}` is the name through the slug FILTER.
  # Same word, two things, and the pipe is what tells them apart.
  generate:
    - '{{ created | date }}--{{ slug }}'
    - '{{ created | date }}--{{ name | slug }}'
  pattern: ^\d{4}-\d{2}-\d{2}--[a-z0-9-]+$
schema:
  type: object
  required:
    - name
  properties:
    slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$', title: Slug, description: 'The latin handle that becomes the id. ⚠ A SLUG, NOT A CODE, and the pack keeps the two apart deliberately: `activities.code` (`a-01`) and `risks.code` (`rk-01`) are identifiers a room says out loud and reads in order, so they stay required and stay called codes. This one exists ONLY so a value in any script can have a readable, typeable id — it is never shown to a reader and never replaces the name. OPTIONAL since engine 0.25.0: `id.generate` takes an ordered list, so the id falls back to the name when this is empty, and a name with no latin characters still produces a hash id but now says so on the write.' }
    name:
      type: string
      description: The commitment in one line, starting with a verb — what would be done, not the topic.
    lane:
      type: string
      description: >-
        Which lane this task sits in on the board — the DOMAIN it is about, not who surfaced it. OPTIONAL: a task with
        no lane still lands on the board, under an "unassigned" pile. The VOCABULARY is the workspace's own — this
        module ships no enum, because every workspace splits its work differently (one by client, one by department,
        one by area of life). Pick a short set of display-ready values (`CRM`, `Finance`, `R&D`) and use them
        consistently: the board groups its rows by the raw value, so `finance` and `Finance` are two lanes. Infer from
        the task's ACTUAL WORK, not where it was surfaced. To close the set, add an `enum` (and optionally an
        `x-choices` block with a codicon and a theme colour per value) with `dt set-field tasks --name lane …`.
    description:
      type: string
      format: markdown
      x-body: true
      description: The detail — what was actually said, what "done" looks like, and a backlink to the record this came out of.
    status:
      type: string
      enum:
        - todo
        - doing
        - blocked
        - done
        - closed
      default: todo
      description: >-
        Where this stands. `todo` is what the session greeting's inbox lists. `doing` is in flight. `blocked` means the
        next move belongs to someone else and the operator is waiting on a named party — it stays on the board because
        it needs chasing, but it is not work he can pick up. `done` means the commitment was met; `closed` means it left
        the board WITHOUT being met — superseded, split into others, overtaken by events, or decided against. `done` and
        `closed` are terminal; the distinction is what makes "what did I actually deliver" answerable later.
    # THE ADDRESSBOOK EDGE. Until 2026-09-10 this collection modelled "the operator's own commitments"
    # and had no assignee at all, which is why a person could not be asked what was theirs. It points at
    # `users`, never at `contacts`: a task is assigned TO someone who does work, and the generated mirror
    # is what makes the person's own record answer the question instead of a saved search.
    project:
      type: string
      x-reference: projects
      x-inverse:
        field: tasks
        description: The tasks raised under this project — generated from `tasks.project`.
      description: The project this task belongs to, when it came out of one. Empty is normal — most tasks are not plan rungs.
    activity:
      type: string
      x-reference: activities
      x-inverse:
        field: tasks
        description: The tasks raised under this plan rung — generated from `tasks.activity`.
      description: The plan rung this task came out of, when it did. A task is the small thing you do; an activity is the bounded piece of work it serves.
    assignee:
      type: string
      x-reference: users
      x-inverse:
        field: tasks
        description: The tasks assigned to this person — generated from `tasks.assignee`.
      description: >-
        Who owes this. Empty means the operator themselves, which is the honest default for a personal
        task list — a workspace with one person never has to fill it in.
    due:
      type: string
      format: date
      description: The date this is owed by, resolved to an absolute date — never "next week".
    urgent:
      type: boolean
      default: false
      description: Whether this jumps the queue regardless of its due date.
    item:
      type: string
      x-reference: '*'
      description: The record this task came out of — a meeting, a summary, a client. Polymorphic, hence "*".
    confidence:
      type: string
      enum:
        - low
        - normal
        - high
      default: normal
      description: How sure the extractor was that this really is a task the operator owns.
    tags:
      examples: ['finance', 'tax', 'docs-missing']
      type: array
      items:
        type: string
      description: >-
        What DOMAIN this task belongs to, in English, so the board can be split by kind rather than read end to end. The
        vocabulary that earned its place: `finance` on everything money-touching, plus one of `tax` · `vat` ·
        `insurance` · `pension` · `property` · `banking` · `credit-card` · `accountant` · `docs-missing` · `decision`. A
        task with no tag reads as dev/ops work, which is the useful default. Free strings, lowercase and hyphenated;
        `key:value` with NO space around the colon — a space makes YAML parse the entry as a map. Nothing validates a
        tag: `python3 <extensions>/modules/contacts/skills/working-with-tags/bin/tags.py`.
    assistant_recommended_next_step:
      type: string
      format: markdown
      description: >-
        The single next move the assistant recommends, written in the operator's language and refreshed whenever the record is
        analysed. Opens with the CURRENT STATE in one line — what is true now, who holds the ball, how long it has sat —
        because a recommendation without its context reads as an order. Then the move itself, and why that one rather
        than the obvious alternative. This field is ANALYSIS, not a UI hint: it is written when the record is examined,
        so the board can be read rather than re-derived. Absent means nobody has analysed this record yet, which is
        itself worth seeing.
order: 3
list_fields:
  - name
  - assignee
  - lane
  - last-modified
  - status
  - due
  - tags
icon: checklist
