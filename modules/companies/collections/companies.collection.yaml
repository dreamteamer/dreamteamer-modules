name: companies
description: >-
  An organisation — the thing contacts, clients and leads all point at.
use_when: >-
  an organisation is named — in a meeting, a lead, a contact's employer, an invoice — find or create
  it here BEFORE the record that points at it; every funnel record joins through this one
templates: [collection-templates/companies-provenance]
storage: { path: data/companies, codec: md, shape: file, suffix: company }
id: { generate: "{{ name | slug }}" }
schema:
  type: object
  required: [name]
  properties:
    name:
      type: string
      description: The company's name as it is actually written — the record's id is its slug.
    description:
      type: string
      description: One line on what this company does, for someone who has never heard of it.
    relation:
      type: string
      description: 'How this company relates to us: client, network, employer, vendor, prospect…'
    website:
      type: string
      format: uri
      description: Their marketing site, with the scheme.
    domain:
      type: string
      description: Primary email/web domain, bare — no scheme, no www. What an attendee address is matched against.
    # Lives here rather than in a workspace overlay because it is generic CRM data, and because
    # /scrape-contact's get_company_employees takes exactly this slug — which makes it the field
    # that turns a company into a way of finding people.
    linkedin:
      type: string
      format: uri
      description: The company's LinkedIn PAGE (linkedin.com/company/<slug>) — the org-level twin of contacts.linkedin.
    # An ordinary reference, not a new kind of field: `assets` is a `codec: file` collection, so the
    # UI draws the file it points at wherever this company is named (decision 268). Usually
    # `assets/logos/<simple-icons-slug>` — the slug is nearly always the bare `domain` above.
    logo:
      type: string
      x-reference: assets
      description: The company's mark, as an asset record — usually `assets/logos/<simple-icons-slug>`. Drawn wherever this company is shown.
    parent:
      type: string
      x-reference: companies
      description: The parent org, when this one is a subsidiary, brand or business unit.
    # `subsidiaries` is GENERATED — the far side of `parent`, which lives on the subsidiary
    # (spelling B: `x-inverse-of` names the field that owns it). Declared here so that "what does a
    # company have?" is answerable by reading this file, and READ-ONLY: set `parent` on the
    # subsidiary and the engine maintains this in the same write. SELF-REFERENTIAL: a company's
    # parent is a company, so both ends of the relation are this collection. `logo` above stays
    # one-way on purpose — `assets` is a `codec: file` collection and cannot hold a mirror.
    #
    # `contacts` is NOT declared here. The contacts module owns that relation — `contacts.company`
    # carries `x-inverse: contacts` — and the engine stamps the mirror onto this collection only when
    # that module is installed. A workspace with companies and no contacts has companies with no
    # people field, which is the truth of that workspace rather than a dangling reference.
    subsidiaries:
      type: array
      items: { type: string, x-reference: companies }
      x-inverse-of: companies.parent
      description: The orgs that name this one as their parent — brands, business units, companies acquired.
    notes:
      type: string
      format: markdown
      x-body: true
      description: The company's page — history with us, org shape, anything worth knowing before a call.
order: 11
list_fields: [logo, name, last-modified, relation, website]
icon: briefcase
group: crm
