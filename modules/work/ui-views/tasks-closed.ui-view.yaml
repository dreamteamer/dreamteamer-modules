route: /tasks/closed
scope: collection
collection: collections/tasks
filter:
  status:
    _eq: closed
display:
  nav:
    title: Closed
    icon: list-unordered
    order: 60
  list:
    layout: table
    columns:
      - last_modified
      - name
      - status
      - latest_update
      - assignee
      - due
      - project
      - tags
      - goals
    sort: -last_modified
