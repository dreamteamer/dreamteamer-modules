route: /tasks/doing
scope: collection
collection: collections/tasks
filter:
  status:
    _eq: doing
display:
  nav:
    title: Doing
    icon: list-unordered
    order: 30
  list:
    layout: table
    columns:
      - last_modified
      - task_code
      - latest_update_at
      - name
      - status
      - goals
      - sessions
      - latest_update
      - assistant_recommended_next_step
      - assignee
    sort: -last_modified
    options:
      show_ungrouped_rows: true
      show_empty_rows: false
