route: /work/tasks/graph
scope: collection
collection: collections/tasks
description: Tasks in Doing or Blocked. Edges are real Task Item or prerequisite references; incoming Session links are not drawn by this renderer.
filter:
  status:
    _in:
      - doing
      - blocked
display:
  nav:
    title: Graph
    icon: type-hierarchy
    order: 130
  list:
    layout: diagram
    sort: -last_modified
    columns:
      - name
      - status
      - item
      - depends_on
    options:
      link_by: references
      ref_fields:
        - item
        - depends_on
      node: dot
      hide_leaves: false
      label_template: "{{ name }} · {{ status }}"
      page_size: 100000
