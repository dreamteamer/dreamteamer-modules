route: /tasks/done
scope: collection
collection: collections/tasks
filter:
  status:
    _eq: done
display:
  nav:
    title: Done
    icon: list-unordered
    order: 50
  list:
    layout: table
    columns:
      - last_modified
      - name
      - status
      - latest_update
      - assignee
      - due
      - project
      - tags
      - goals
    sort: -last_modified
