route: /work/decisions
scope: collection
collection: collections/decisions
description: The decision log, newest first — each decision with its status, who decided, its project, and the tasks, goals, Sessions and records it names.
display:
  nav:
    title: Decision Log
    icon: list-unordered
  list:
    layout: table
    columns:
      - decided_on
      - name
      - status
      - decided_by
      - project
      - tasks
      - goals
      - sessions
      - affects
    sort: -decided_on
