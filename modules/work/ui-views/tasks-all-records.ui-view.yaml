route: /work/tasks/all
scope: collection
collection: collections/tasks
description: Unfiltered Tasks, including Done, Closed and Suggested.
display:
  nav:
    title: All Tasks
    icon: list-unordered
    order: 0
  list:
    layout: table
    columns:
      - last_modified
      - task_code
      - name
      - status
      - assignee
      - latest_update
      - goals
      - sessions
      - item
    sort: -last_modified
    options:
      show_ungrouped_rows: true
      show_empty_rows: false
