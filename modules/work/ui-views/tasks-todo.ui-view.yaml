route: /tasks/todo
scope: collection
collection: collections/tasks
filter:
  status:
    _eq: todo
display:
  nav:
    title: To Do
    icon: list-unordered
    order: 20
  list:
    layout: table
    columns:
      - last_modified
      - name
      - status
      - latest_update
      - assignee
      - due
      - project
      - tags
      - goals
    sort: -last_modified
