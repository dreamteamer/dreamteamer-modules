route: /tasks/personal-board
scope: collection
collection: collections/tasks
filter:
  status:
    _in:
      - todo
      - doing
      - blocked
display:
  nav:
    title: Active Board
    icon: project
    order: -2
  list:
    layout: kanban
    options:
      lanes_by: status
      page_size: 1000
      card_title: |-
        **{{ name }}**
        {{ status }} · {{ due }}
