# Builds images/hq and pushes it to GitHub's container registry on an `hq-v*` tag — the same shape as
# the engine's release: the tag is the publish, and nothing else triggers it. The image is what
# `dt-host start container <name> --template hq` pulls, so it is built by CI from a tagged commit rather
# than from whichever developer machine happened to run `docker build`.
name: image-hq
on:
  push:
    tags: ['hq-v*']
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the image version is the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#hq-v}" >> "$GITHUB_OUTPUT"
      - name: leak gate — the image sources about to be published
        run: |
          set -e
          ! grep -RInE '/Users/|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.(com|io|net|org|co\.il)\b|sk-ant-|ghp_[A-Za-z0-9]{20,}|-----BEGIN' images/hq
          ! perl -CSD -ne 'exit 1 if /\p{Hebrew}/' images/hq/Dockerfile images/hq/entrypoint.sh || { echo "hebrew in image sources"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/hq
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dreamteamer/hq:${{ steps.v.outputs.version }}
            ghcr.io/dreamteamer/hq:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
