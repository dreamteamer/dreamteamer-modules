name: release

# Tag-only, ONE MODULE PER TAG: `<id>-v<version>` (e.g. `contacts-v0.1.0`) publishes modules/<id> as
# @dreamteamer/<id>. A merge to main can never publish; pushing a tag is the permission gate, the same
# one the engine uses. Each module has its own version, so a breaking change in one never forces a
# release of the others — the reason this repo exists instead of one package of ten modules.
on:
  push:
    tags: ['*-v*']

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The ancestry gate below needs main's history; the default shallow tip cannot answer it.
          fetch-depth: 0

      - name: which module, and the tag must match its version
        id: mod
        run: |
          set -euo pipefail
          ID="${GITHUB_REF_NAME%-v*}"; VERSION="${GITHUB_REF_NAME##*-v}"
          [ -f "modules/$ID/package.json" ] || { echo "::error::tag $GITHUB_REF_NAME names no modules/$ID"; exit 1; }
          PKG=$(node -p "require('./modules/$ID/package.json').version")
          NAME=$(node -p "require('./modules/$ID/package.json').name")
          echo "module=$ID name=$NAME tag=$VERSION package.json=$PKG"
          [ "$PKG" = "$VERSION" ] || { echo "::error::tag version $VERSION does not match modules/$ID/package.json $PKG"; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      # 🔴 THE LEAK GATE, ON THE PUBLISH PATH — added 2026-09-10.
      #
      # `leak-scan.yml` triggers on a push to any branch and on `pull_request`. A TAG matches
      # NEITHER, so until 2026-09-10 the release path scanned nothing at all — and the branch scan only
      # ever sees the lines and messages its commits ADD. This is the gate against the incident that
      # already shipped a private vault name in three npm tarballs (immutable, provenance-attested,
      # fixed only by a git-history rewrite), and the publish skipped it. This one scans the WHOLE
      # TREE about to be published, because that is what a stranger downloads.
      #
      # ⚠ IT FAILS CLOSED, like the branch scan since cr-modules-001: on a release, silence is
      # indistinguishable from a pass — and both layers were once off on a second machine during a
      # public-repo push prep. The pattern reaches grep through `-f`, never as an argument: written once
      # to a file in the runner's temp folder (removed on exit) — a `-f <(…)` pipe would be drained by
      # the first `xargs` batch and every later batch would scan for nothing (cr-modules-001 plan
      # review p1-01) — and read by grep, not `git grep -E`, whose platform regex may not know `\b`.
      # Measured 2026-09-10: all three repos DO carry the secret and the check really runs, so this
      # costs nothing today and is the only thing between an unset secret and an immutable publish.
      #
      # ⚠ PATHS are printed; CONTENT never is. This log is readable by anyone with repo access.
      - name: leak gate — the whole tree about to be published
        env:
          LEAK_NAMES: ${{ secrets.LEAK_NAMES }}
        run: |
          set -uo pipefail
          if [ -z "${LEAK_NAMES:-}" ]; then
            echo "::error::secrets.LEAK_NAMES is not set, so the private-name check cannot run — and a skipped gate is not a passed gate. Set it on this repo before releasing."
            exit 1
          fi
          fail=0

          # Text files only. A binary blob's bytes can decode to anything, and a PNG that happens
          # to carry a valid two-byte sequence would fail the Hebrew rule for no reason.
          TEXT=$(git grep -I -l -e '.' -- . || true)
          [ -n "$TEXT" ] || { echo "::error::no text files found to scan — the gate would pass vacuously"; exit 1; }

          # A MALFORMED pattern must fail, not pass (finding r1-09, 2026-10-31): grep exits 2 on an invalid
          # regex, and the `|| true` below would read that as "no hits" — the gate silently off. Probe once.
          rc=0; printf 'leak-names-probe\n' | grep -iE -f <(printf '%s' "$LEAK_NAMES") >/dev/null 2>&1 || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::secrets.LEAK_NAMES is not a valid extended regex (grep exit $rc), so the private-name check cannot run. Re-set it from the hook's \`names\` mode."
            exit 1
          fi
          pat="$RUNNER_TEMP/leak-names.pat"; trap 'rm -f "$pat"' EXIT
          printf '%s' "$LEAK_NAMES" > "$pat"
          hits=$(printf '%s\n' "$TEXT" | xargs -r grep -lIiE -f "$pat" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::$(printf '%s\n' "$hits" | wc -l | tr -d ' ') tracked file(s) match a private name"
            printf '%s\n' "$hits" | sed 's/^/  /'
            fail=1
          fi

          SECRET_SHAPES='sk-ant-[A-Za-z0-9_-]{20}|sk-[A-Za-z0-9]{32}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[0-9A-Za-z-]{10,}|glpat-[0-9A-Za-z_-]{20}|npm_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          hits=$(printf '%s\n' "$TEXT" | xargs -r grep -lIE "$SECRET_SHAPES" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::$(printf '%s\n' "$hits" | wc -l | tr -d ' ') tracked file(s) match a credential shape"
            printf '%s\n' "$hits" | sed 's/^/  /'
            fail=1
          fi

          # Hebrew — a strong proxy for "vault content escaped into this repo" — honouring
          # `.leak-scan-allow` per FILE and per RULE, the same file the pre-commit scanner reads.
          # ⚠ perl with -CSD, never `grep -P`: `S` fixes the standard handles and `D` sets the
          # default layer for files opened from @ARGV, so the pattern matches CODEPOINTS. Without
          # -CSD it matches bytes and silently never fires, which is the worst failure a gate has.
          heb=$(printf '%s\n' "$TEXT" | xargs -r perl -CSD -ne 'print "$ARGV\n" if /[\x{0590}-\x{05FF}]/' 2>/dev/null | sort -u || true)
          if [ -f .leak-scan-allow ] && [ -n "$heb" ]; then
            allowed=$(awk -F'\t' '$0 !~ /^[[:space:]]*(#|$)/ && $2 == "hebrew" { print $1 }' .leak-scan-allow)
            [ -n "$allowed" ] && heb=$(printf '%s\n' "$heb" | grep -vxF "$allowed" || true)
          fi
          if [ -n "$heb" ]; then
            echo "::error::$(printf '%s\n' "$heb" | wc -l | tr -d ' ') file(s) carry Hebrew codepoints outside .leak-scan-allow"
            printf '%s\n' "$heb" | sed 's/^/  /'
            echo "Exempt a REVIEWED file: <path><TAB>hebrew<TAB><why>"
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "✔ the published tree is clean — no private name, no credential shape, no Hebrew outside the allow-list"

      # ⚠ A TAG ON AN ARBITRARY COMMIT PUBLISHES A TREE CI HAS NEVER SEEN. main is protected (`ci` and
      # `leak-scan` required on its head, admins included), but there is no tag ruleset, so a tag can
      # still name any commit. The release runbook (README.md) pushes a branch, waits for green,
      # fast-forwards main, then tags — so this assertion is free on the happy path and refuses the
      # accident.
      - name: the tag must point at a commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "✔ $(git rev-parse --short HEAD) is on origin/main"
          else
            echo "::error::this tag points at a commit that is NOT on origin/main, so CI has never seen this tree. Merge to main and let ci.yml pass before tagging."
            exit 1
          fi


      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: the access decision must be recorded
        env:
          NPM_ACCESS: ${{ vars.NPM_ACCESS }}
        run: |
          set -euo pipefail
          case "${NPM_ACCESS:-}" in
            public|restricted) echo "publishing --access $NPM_ACCESS" ;;
            "") echo "::error::vars.NPM_ACCESS is not set. These modules come out of a private vault, so nothing here guesses between a public registry entry and an org-restricted one. Set it on the repo."; exit 1 ;;
            *) echo "::error::vars.NPM_ACCESS is \"$NPM_ACCESS\" — expected public or restricted"; exit 1 ;;
          esac

      - name: does this module's suite drive a browser
        id: browser
        run: echo "needed=$(node scripts/test.mjs --module=${{ steps.mod.outputs.id }} --needs-browser)" >> "$GITHUB_OUTPUT"

      # rnd's prototype harness drives a real browser, and its held-out tests fail honestly rather than
      # skip when none resolves (play-fails-honestly), so the runner installs it — through npx, because
      # `play` runs in a temp workspace outside this tree and resolves playwright-core from the npx cache.
      - name: chromium for the prototype harness
        if: steps.browser.outputs.needed == 'true'
        run: npx -y playwright-core install --with-deps chromium

      # The repo-wide checks under tests/ plus THIS module's own suite — not every other module's.
      # tests/ still holds compiles-alone, which installs EVERY module from its PACKED tarball, so a
      # folder missing from `files` fails here rather than in a stranger's install; the other modules'
      # own suites ran in ci.yml on this commit before it could be tagged, and none of them is what
      # this tag publishes. A wave of 16 tags used to run the whole ~10-minute suite 16 times.
      - name: tests
        run: node scripts/test.mjs --module=${{ steps.mod.outputs.id }}

      - name: publish
        working-directory: modules/${{ steps.mod.outputs.id }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_ACCESS: ${{ vars.NPM_ACCESS }}
          GH_TOKEN: ${{ github.token }}
        # The visibility NOW, from the API (cr-modules-001, design D-d) — never the push event's
        # `repository.private`, which a re-run replays from the time of the tag: rnd-v0.5.1 was re-run
        # after the repo went public and still published without provenance. npm refuses provenance for
        # a private repo (E422), so the branch stays; any answer but exactly true or false stops here.
        run: |
          set -euo pipefail
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private) || { echo "::error::could not read this repo's visibility from the API — not publishing"; exit 1; }
          if [ "$private" = "false" ]; then
            echo "public source repo — publishing with provenance"
            npm publish --provenance --access "$NPM_ACCESS"
          elif [ "$private" = "true" ]; then
            echo "private source repo — npm refuses provenance for private repos (E422); publishing without"
            npm publish --access "$NPM_ACCESS"
          else
            echo "::error::the API answered \"$private\" for this repo's visibility — expected true or false; not publishing"
            exit 1
          fi
