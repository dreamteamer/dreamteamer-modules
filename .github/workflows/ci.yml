name: ci

# Every pushed branch, not only main (cr-modules-001): on a public repo a pushed ref is published the
# moment it lands, and branch protection on main requires the `ci` context below on a branch's head
# before main can be fast-forwarded to it.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # ⚠ WHY SHARDS. When this repo was private its runner had 2 vCPUs, so `node --test` ran one file at a
  # time and one job was ~11 minutes, almost all of it inside `npm test` (run 41100010853: 674 s of
  # top-level tests in a 725 s run). The public runner has 4 vCPUs; the shard count is unchanged. The suite is split into balanced shards (scripts/test-files.ts), and
  # tests/test-shards.test.ts fails if any file would fall outside every shard. Node 22 only: the suites and
  # scripts are TypeScript run through Node's type stripping, which Node 20 does not have (what npm ships is
  # the build, plain JavaScript). The longest single file (proofs' prove.test.js, ~170 s on a runner)
  # is the floor; more shards than this cannot go below it.
  verify:
    runs-on: ubuntu-latest
    env:
      # the engine branch the suites run on (the candidate step below)
      ENGINE_REF: typescript
    strategy:
      fail-fast: false
      matrix:
        node: [22]
        shard: [1, 2, 3, 4]
    name: node ${{ matrix.node }} · shard ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # THE ENGINE THIS BRANCH NEEDS, NOT YET PUBLISHED. The modules here floor the engine at the release that
      # stages skills from dist/skills and runs `dt run`, so on the published engine their install tests would
      # skip. The engine repository's branch is packed (its prepack builds dist/) and installed over
      # node_modules/dreamteamer by scripts/use-candidate.ts, the verified step; DT_CANDIDATES lets
      # tests/candidate-engine.test.ts check the engine in place is the one packed. Drop this step, or point
      # ENGINE_REF at a tag, once that engine is published.
      - name: the candidate engine — dreamteamer@${{ env.ENGINE_REF }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$ENGINE_REF" https://github.com/dreamteamer/dreamteamer.git "$RUNNER_TEMP/engine"
          echo "engine $ENGINE_REF @ $(git -C "$RUNNER_TEMP/engine" rev-parse --short HEAD)"
          (cd "$RUNNER_TEMP/engine" && npm ci --no-audit --no-fund)
          mkdir -p "$RUNNER_TEMP/candidates"
          (cd "$RUNNER_TEMP/engine" && npm pack --silent --pack-destination "$RUNNER_TEMP/candidates")
          (cd "$RUNNER_TEMP/candidates" && sha256sum dreamteamer-*.tgz > SHA256SUMS)
          node scripts/use-candidate.ts "$RUNNER_TEMP/candidates"
          echo "DT_CANDIDATES=$RUNNER_TEMP/candidates" >> "$GITHUB_ENV"

      # The pane's held-out tests (tests/heldout/cr-modules-017-*) serve @dreamteamer/ui's browser page, which is
      # built and gitignored. Without this step only the shard whose ui tarball test happened to build it first
      # could run them; every other shard died at import with "no built app".
      # Every module's dist/ (scripts/build.ts) before the ui: the ui's bundle imports @dreamteamer/protocol, whose
      # exports name its build. The test runner builds again before the suites; this one is for the ui.
      - name: the modules built
        run: npm run build

      - name: the app dt web serves — @dreamteamer/ui built
        run: npm run build -w modules/ui

      - name: does this shard drive a browser
        id: browser
        run: echo "needed=$(node scripts/test.ts --shard=${{ matrix.shard }}/4 --needs-browser)" >> "$GITHUB_OUTPUT"

      # rnd's prototype harness drives a real browser, and its held-out tests fail honestly rather than
      # skip when none resolves (play-fails-honestly), so the runner installs it — through npx, because
      # `play` runs in a temp workspace outside this tree and resolves playwright-core from the npx cache.
      # The browser files are packed into ONE shard, so only that job pays for the install.
      - name: chromium for the prototype harness
        if: steps.browser.outputs.needed == 'true'
        run: npx -y playwright-core install --with-deps chromium

      # Structure, compiles-alone (every module, from its packed tarball and as a copy, in a virgin
      # workspace on the engine in devDependencies), the interplay on real records, the leak gate and
      # the resolver rule — plus every module's own suite, split across the shards. The packed-tarball
      # install IS the distribution smoke the old single package needed a separate step for.
      - name: tests
        run: node scripts/test.ts --shard=${{ matrix.shard }}/4

  # THE ONE CONTEXT BRANCH PROTECTION REQUIRES. Protection on main names `ci`, never the eight shard
  # names above: a change to the shard count would otherwise leave a required context that never
  # reports, and every push to main would wait on it. `if: always()` makes this job report even when a
  # shard failed or was cancelled — and then it fails, so a red shard can never read as a green `ci`.
  # tests/workflow-contexts.test.ts pins the name.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: verify
    if: always()
    steps:
      - name: every shard passed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "${VERIFY_RESULT:-}" != "success" ]; then
            echo "::error::the test shards did not all pass (verify: ${VERIFY_RESULT:-none})"
            exit 1
          fi
          echo "✔ every shard passed"
