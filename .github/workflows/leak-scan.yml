name: leak-scan

# THE GATE THAT ACTUALLY COVERS EVERY COMMIT. Same shape as the engine's and the extension's copies.
#
# There is also a local pre-commit hook, but `.git/hooks/` is untracked and per-clone, so it only
# runs where it was installed. A web session, a fresh clone, or another machine bypasses it
# entirely — which is exactly how content this scan is meant to stop reached main and shipped to
# npm once already. A gate that is not in CI is not a gate.
#
# ⚠ WHY THE PATTERNS ARE SPLIT. The private-names list is itself sensitive — it is the client and
# employer names being grepped for, so hard-coding it here would carry the very strings it exists to
# catch. It comes from a secret. The other rules are NOT sensitive (a unicode range, and public
# credential prefixes) and live here in the open where they can be reviewed.
#
# ⚠ AND WHY HITS ARE COUNTED, NOT PRINTED. Echoing a matched line would leak the thing that was
# caught. The job prints the FILE and a count; read the content locally.
#
# ⚠ THE HEBREW RULE HONOURS `.leak-scan-allow` HERE, per file and per rule, because this package
# legitimately contains Hebrew in four places where it is the SUBJECT — a filename parser, a mail
# prefix regex, a title example, a paste-back fixture. The engine's copy names that file in its
# error message without reading it, which it can afford because it has no such files. `npm test`
# runs `tests/leak-gate.test.mjs`, which enforces the same allow-list over the WHOLE tree rather
# than only the added lines; this step is the per-commit half.

# Every pushed branch, not only main (cr-modules-001, design D-a): on a public repo a feature branch is
# published the moment it is pushed, and branch protection on main requires the `leak-scan` context on
# a branch's head before main can be fast-forwarded to it. Tags are release.yml's.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    # the context branch protection requires by this exact name — tests/workflow-contexts.test.mjs
    name: leak-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # a PR needs the merge base to diff against

      # EVERY COMMIT THIS PUSH OR PULL REQUEST BRINGS, one diff per commit, plus every one of those
      # commits' MESSAGES (cr-modules-001, design D-a). Diffing one push's net change let a later
      # commit hide an earlier one, and a message is published with its commit (round-2 d2-01).
      # Author and committer identities are not collected: an identity is the committer's own, and the
      # vault's history mode checks those (round-3 r3-03).
      #
      # The base: a pull request's base sha; a push to main, the previous tip; a push to any other
      # branch, its merge-base with main — so a branch head is green only when fast-forwarding main to
      # it adds no commit that fails. `--diff-merges=first-parent` scans what a merge brought onto its
      # branch, including a merged-in main's lines, which main's own scan already passed: re-scanning
      # them is harmless, and it keeps a merge resolution's own lines in scope.
      #
      # Added lines only. A commit that DELETES a leak is never blocked by it — but the commit that
      # ADDED it stays in the range, so a branch that went red is rewritten, never patched on top.
      #
      # An unknown base (a re-created branch, a force-pushed-away tip, no common history with main) is
      # never widened to the whole history (round-2 d2-02): the tree and HEAD's message are scanned.
      - name: collect added lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          OUT="$RUNNER_TEMP/added.txt"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ "$REF" = "refs/heads/main" ]; then
            BASE="$BEFORE"
          else
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || true)
          fi
          # each commit's message under a header of its own, every line prefixed `+` like an added line
          messages() { git log --format='+++ b/(commit metadata)%n%B' "$@" | sed '/^+++ b\/(commit metadata)$/!s/^/+/'; }
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            { git log -p -U0 --format= --diff-merges=first-parent "$BASE"..HEAD | grep '^+' || true; messages "$BASE"..HEAD; } > "$OUT"
          else
            echo "::warning::base unknown — scanning the tree and HEAD's metadata only"
            EMPTY=$(git hash-object -t tree /dev/null)
            { git diff "$EMPTY" HEAD -U0 | grep '^+' || true; messages -1 HEAD; } > "$OUT"
          fi
          wc -l < "$OUT" | sed 's/^ */added lines to scan: /'

      - name: Hebrew codepoints
        run: |
          # perl, not `grep -P`: -CSD makes perl match CODEPOINTS. Without it the pattern silently
          # never fires, which is the worst possible failure for a leak gate.
          # `+++ b/<path>` lines in the diff carry the file each hunk belongs to, which is what makes
          # a per-file exemption possible at all.
          perl -CSD -e '
            my %allow;
            if (open my $a, "<", ".leak-scan-allow") {
              while (<$a>) {
                next if /^\s*#/ || /^\s*$/;
                my ($p, $r) = split /\t/;
                $allow{"$p\t$r"} = 1 if defined $r;
              }
            }
            my ($file, $n, %hit) = ("", 0);
            open my $d, "<", "$ENV{RUNNER_TEMP}/added.txt" or die "no diff to scan\n";
            while (<$d>) {
              if (m{^\+\+\+ b/(.+)$}) { $file = $1; next; }
              next unless /^\+/;
              next if $allow{"$file\thebrew"};
              if (/[\x{0590}-\x{05FF}]/) { $hit{$file}++; $n++; }
            }
            if ($n) {
              print "::error::$n added line(s) contain Hebrew codepoints outside .leak-scan-allow — vault content may be escaping into this repo.\n";
              print "Files touched (content deliberately NOT printed — this log is readable by anyone with repo access):\n";
              print "  $_ ($hit{$_} line(s))\n" for sort keys %hit;
              print "Exempt a REVIEWED file in .leak-scan-allow: <path>\thebrew\t<why>\n";
              exit 1;
            }
            print "✔ no Hebrew codepoints added outside the allow-list\n";
          '

      - name: credential shapes
        run: |
          PAT='sk-ant-[A-Za-z0-9_-]{20}|sk-[A-Za-z0-9]{32}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[0-9A-Za-z-]{10,}|glpat-[0-9A-Za-z_-]{20}|npm_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          n=$(grep -cEo "$PAT" "$RUNNER_TEMP/added.txt" || true)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::error::$n added line(s) match a credential shape. Rotate the credential FIRST, then rewrite history."
            exit 1
          fi
          echo "✔ no credential shapes added"

      - name: private names
        env:
          LEAK_NAMES: ${{ secrets.LEAK_NAMES }}
        run: |
          # Absent secret is a SKIP, loudly — the same choice the engine's copy makes, so all three
          # repos behave identically. ⚠ A skip is NOT a pass: this package was cut out of a private
          # vault, and the 2026-08 incident was both layers off with CI reporting clean. Set the
          # secret: gh secret set LEAK_NAMES --repo $GITHUB_REPOSITORY
          if [ -z "${LEAK_NAMES:-}" ]; then
            echo "::warning::secrets.LEAK_NAMES is not set — private-name check SKIPPED, not passed."
            exit 0
          fi
          # A MALFORMED pattern must fail, not pass (finding r1-09, 2026-10-31): grep exits 2 on an invalid
          # regex, and the `|| true` below would read that as "no hits" — the gate silently off. Probe once.
          rc=0; printf 'leak-names-probe\n' | grep -iE "$LEAK_NAMES" >/dev/null 2>&1 || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::secrets.LEAK_NAMES is not a valid extended regex (grep exit $rc), so the private-name check cannot run. Re-set it from the hook's \`names\` mode."
            exit 1
          fi
          n=$(grep -icE "$LEAK_NAMES" "$RUNNER_TEMP/added.txt" || true)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::error::$n added line(s) match a private name. Not printing them — this log is readable by anyone with repo access."
            exit 1
          fi
          echo "✔ no private names added"

      - name: oversized files
        run: |
          # 210 KB — the same ceiling as the engine's and the extension's copies and the vault's
          # leak-scan.sh, which is what the local pre-commit hook execs. Change
          # one, change all four, or the hook and CI disagree about what passes. This repo's own
          # largest tracked file is well under it.
          big=$(git ls-files -z | xargs -0 -I{} sh -c 'test -f "{}" && s=$(wc -c <"{}") && [ "$s" -gt 215040 ] && echo "$s {}"' || true)
          if [ -n "$big" ]; then
            echo "::error::tracked files over 210 KB:"; echo "$big"; exit 1
          fi
          echo "✔ no tracked file over 210 KB"
